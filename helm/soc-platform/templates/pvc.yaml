{{/*
============================================================
National SOC Platform - Persistent Volume Claims
============================================================*/}}

{{- if .Values.persistence.logs.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "soc-platform.fullname" . }}-logs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soc-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
    purpose: logs
spec:
  accessModes:
    - {{ .Values.persistence.logs.accessMode | quote }}
  storageClassName: {{ .Values.persistence.logs.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.logs.size }}
{{- end }}

