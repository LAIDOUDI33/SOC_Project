{{/*
=============================================================================
Djezzy National SOC Platform - Ingress Template
=============================================================================
Ingress controller configuration with TLS termination
ANRT Compliant | Security Headers Enabled
=============================================================================
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "djezzy-soc.fullname" . }}
  namespace: {{ include "djezzy-soc.namespace" . }}
  labels:
    {{- include "djezzy-soc.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
  annotations:
    {{- /* Ingress Controller Class */}}
    kubernetes.io/ingress.class: {{ .Values.ingress.className | default "nginx" }}
    
    {{- /* TLS Certificate Management */}}
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | default "letsencrypt-prod" }}
    {{- end }}
    
    {{- /* Rate Limiting */}}
    nginx.ingress.kubernetes.io/rate-limit: "{{ .Values.ingress.rateLimit | default "1000" }}"
    nginx.ingress.kubernetes.io/rate-limit-window: "{{ .Values.ingress.rateLimitWindow | default "1m" }}"
    
    {{- /* Security Headers */}}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      {{- if .Values.ingress.customSecurityHeaders }}
      {{ .Values.ingress.customSecurityHeaders | indent 6 }}
      {{- end }}
    
    {{- /* Body Size Limit */}}
    nginx.ingress.kubernetes.io/proxy-body-size: "{{ .Values.ingress.proxyBodySize | default "50m" }}"
    
    {{- /* Timeouts */}}
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "{{ .Values.ingress.proxyConnectTimeout | default "30" }}"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "{{ .Values.ingress.proxySendTimeout | default "600" }}"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "{{ .Values.ingress.proxyReadTimeout | default "600" }}"
    
    {{- /* Authentication (Optional) */}}
    {{- if .Values.ingress.basicAuth.enabled }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ .Values.ingress.basicAuth.secretName }}
    nginx.ingress.kubernetes.io/auth-realm: "{{ .Values.ingress.basicAuth.realm | default "Authentication Required" }}"
    {{- end }}
    
    {{- /* SSL Configuration */}}
    {{- if .Values.ingress.sslConfig }}
    nginx.ingress.kubernetes.io/ssl-ciphers: {{ .Values.ingress.sslConfig.ciphers | quote }}
    nginx.ingress.kubernetes.io/ssl-protocols: {{ .Values.ingress.sslConfig.protocols | quote }}
    {{- end }}
    
    {{- /* ANRT Compliance Annotations */}}
    anrt.djezzy.soc/tls-version: "{{ .Values.ingress.tlsVersion | default "1.3" }}"
    
    {{- /* Custom Annotations */}}
    {{- with .Values.ingress.annotations }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  
  {{- /* TLS Configuration */}}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range .Values.ingress.hosts }}
        - {{ .host | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls-cert" (include "djezzy-soc.fullname" .)) }}
  {{- end }}
  
  {{- /* Host Rules */}}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .service }}
                port:
                  number: {{ .port }}
          {{- end }}
    {{- end }}
{{- end }}
