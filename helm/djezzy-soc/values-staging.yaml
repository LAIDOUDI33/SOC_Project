# =============================================================================
# Djezzy National SOC Platform - Staging Values Override
# =============================================================================
# Staging environment configuration for testing before production
# =============================================================================

global:
  environment: staging
  
  # Staging image registry
  imageRegistry: registry.djezzy.dz/staging
  
  # Staging labels
  labels:
    environment: staging
    tier: staging
  
  # Relaxed ANRT compliance for staging
  anrt:
    compliance: true
    dataRetentionDays: 90  # Shorter retention for staging
    auditLogging: true
    encryptionRequired: true

# =============================================================================
# NAMESPACES - Staging Resource Quotas (Reduced)
# =============================================================================
namespaces:
  create: true
  frontend:
    resourceQuota:
      cpu: "2"
      memory: 4Gi
      pods: 5
  backend:
    resourceQuota:
      cpu: "8"
      memory: 16Gi
      pods: 25
  events:
    resourceQuota:
      cpu: "6"
      memory: 12Gi
      pods: 10
  monitoring:
    resourceQuota:
      cpu: "4"
      memory: 8Gi
      pods: 15
  ss7:
    resourceQuota:
      cpu: "2"
      memory: 4Gi
      pods: 5

# =============================================================================
# SOC PLATFORM API - Staging Configuration
# =============================================================================
socPlatformApi:
  replicas: 2  # Reduced replicas for staging
  
  image:
    tag: "latest-staging"
  
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 75
    targetMemoryUtilization: 85
  
  pdb:
    enabled: true
    minAvailable: 1
  
  config:
    nodeEnv: staging
    rateLimitMaxRequests: 500  # Lower limit for staging

# =============================================================================
# KONG GATEWAY - Staging Configuration
# =============================================================================
kongGateway:
  replicas: 1  # Single instance for staging
  
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# =============================================================================
# WAZUH SIEM - Staging Configuration
# =============================================================================
wazuh:
  enabled: true
  manager:
    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    persistence:
      size: 25Gi

# =============================================================================
# THEHIVE SOAR - Staging Configuration
# =============================================================================
thehive:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  persistence:
    size: 10Gi

# =============================================================================
# CORTEX ANALYZERS - Staging Configuration
# =============================================================================
cortex:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

# =============================================================================
# NSM TOOLS - Staging Configuration
# =============================================================================
suricata:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

zeek:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 6Gi
  persistence:
    size: 25Gi

arkime:
  replicas: 1
  persistence:
    size: 100Gi

# =============================================================================
# DATABASES - Staging Configuration
# =============================================================================
postgresql:
  primary:
    persistence:
      size: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi

elasticsearch:
  replicaCount: 1  # Single node for staging
  persistence:
    size: 100Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

redis:
  architecture: standalone
  master:
    persistence:
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 1Gi

# =============================================================================
# KAFKA - Staging Configuration
# =============================================================================
kafka:
  replicaCount: 1  # Single broker for staging
  controller:
    replicaCount: 1
  broker:
    persistence:
      size: 20Gi
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
  zookeeper:
    replicaCount: 1
    persistence:
      size: 2Gi

# =============================================================================
# MONITORING - Staging Configuration
# =============================================================================
prometheus:
  server:
    retention: 168h  # 7 days for staging
    persistentVolume:
      size: 20Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 2Gi

grafana:
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# =============================================================================
# SS7 MODULE - Staging Configuration
# =============================================================================
ss7Module:
  collector:
    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
    persistence:
      size: 10Gi
  analyzer:
    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
  diameterMonitor:
    replicas: 1

# =============================================================================
# INGRESS - Staging Configuration
# =============================================================================
ingress:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/rate-limit: "300"
  
  tls:
    enabled: true
    secretName: soc-platform-tls-cert-staging

# =============================================================================
# BACKUP - Staging Configuration
# =============================================================================
backup:
  enabled: true
  schedule: "0 3 * * *"  # Daily at 3 AM
  retention: 14d
  destinations:
    s3:
      enabled: false
    local:
      enabled: true
      path: /backups/staging

# =============================================================================
# SECRETS MANAGEMENT - Staging
# =============================================================================
secretsManagement:
  provider: sealed-secrets
  sealedSecrets:
    enabled: true
  externalSecrets:
    enabled: false
  vault:
    enabled: false
