# =============================================================================
# Djezzy National SOC Platform - Helm Chart
# =============================================================================
apiVersion: v2
name: djezzy-soc
description: >-
  Djezzy National SOC Platform - Complete Security Operations Center for
  Algerian Telecommunications. Includes SIEM, SOAR, Threat Intelligence,
  NSM, Vulnerability Management, EDR, and SS7/Diameter Signaling modules.
  
  ANRT Compliant | NSA K8s Hardening Guide | Production Ready

type: application

# Chart version (SemVer 2)
version: 1.0.0

# Application version
appVersion: "1.0.0"

# Kubernetes version compatibility
kubeVersion: ">=1.25.0-0"

# Maintainers
maintainers:
  - name: Djezzy SOC Team
    email: soc-team@djezzy.dz
    url: https://soc.djezzy.dz

# Keywords for search
keywords:
  - security
  - soc
  - siem
  - soar
  - threat-intelligence
  - nsm
  - vulnerability
  - edr
  - ss7
  - telecom
  - djezzy
  - algeria
  - anrt

# Home page
home: https://github.com/djezzy/soc-platform

# Sources
sources:
  - https://github.com/djezzy/soc-platform
  - https://soc.djezzy.dz

# Icon (base64 encoded or URL)
icon: https://soc.djezzy.dz/assets/logo.svg

# Annotations for artifact hub and other registries
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: Proprietary
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.soc.djezzy.dz
    - name: Support
      url: https://support.djezzy.dz/soc
  anrt.djezzy.soc/compliance: "telecom-regulation-v2.1"
  anrt.djezzy.soc/certification: "ANRT-SOC-2024-001"

# Dependencies (subcharts)
dependencies:
  # PostgreSQL (Bitnami)
  - name: postgresql
    version: "15.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
    alias: postgresql
  
  # Redis (Bitnami)
  - name: redis
    version: "18.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
    alias: redis
  
  # Elasticsearch (Bitnami)
  - name: elasticsearch
    version: "21.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: elasticsearch.enabled
    alias: elasticsearch
  
  # Kafka (Bitnami)
  - name: kafka
    version: "26.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled
    alias: kafka
  
  # Prometheus (Prometheus Community)
  - name: prometheus
    version: "22.x.x"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
    alias: prometheus
  
  # Grafana (Grafana Community)
  - name: grafana
    version: "7.x.x"
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
    alias: grafana
