## National SOC Platform - RabbitMQ Configuration
## Algeria 2026-2030 | High-Throughput Message Queue

# ===========================================
# Network Configuration
# ===========================================
listeners.tcp.default = 5672

# Disable non-TLS listener in production (enable for development)
# listeners.tcp.none = 5671

# Management interface
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# Prometheus metrics (if plugin enabled)
prometheus.tcp.port = 15692
prometheus.tcp.ip = 0.0.0.0

# ===========================================
# Memory & Disk Alarms
# ===========================================
# Memory threshold (40% of system memory or 4GB, whichever is lower)
vm_memory_high_watermark.relative = 0.4
vm_memory_high_watermark_paging_ratio = 0.5

# Disk space alarm (warn at 90% free, block at 95%)
disk_free_limit.absolute = 2GB

# ===========================================
# Resource Limits
# ===========================================
# Max connections
max_connections = 65535

# Channel limits per connection
channel_max = 65535

# Handshake timeout (30 seconds)
handshake_timeout = 30000

# ===========================================
# Message & Queue Settings
# ===========================================
# Default queue settings
default_vhost = /soc

# Allow empty queue declarations
allow_empty_name_queues = true

# Message TTL defaults (in milliseconds)
# default_message_ttl = 86400000  # 24 hours

# Queue expiry (for auto-delete queues)
queue_expire = 3600000  # 1 hour

# ===========================================
# Cluster Configuration
# ===========================================
# Cluster name
cluster_name = soc-algeria-cluster

# Partition handling strategy (autoheal or pause_minority)
cluster_partition_handling = autoheal

# Synchronization limit (number of un-synchronized messages allowed)
cluster_sync_batch_size = 50000

# ===========================================
# Statistics Collection
# ===========================================
# Collect detailed statistics
collect_statistics_interval = 30000

# Collect fine-grained statistics
collect_statistics_scope = coarse

# ===========================================
# Logging Configuration
# ===========================================
# Log levels: debug, info, warning, error, none
log.console.level = info
log.file.level = info

# Log file location
log.file = /var/log/rabbitmq/rabbitmq.log

# Log rotation
log.rotation.date = $D0
log.rotation.count = 10

# ===========================================
# Security Settings (Production)
# ===========================================
# Disable guest user in production
loopback_users.none = false
loopback_users.guest = false

# Enable SSL/TLS (uncomment and configure for production)
# listeners.ssl.default = 5671
# ssl_options.cacertfile = /etc/rabbitmq/ssl/ca.crt
# ssl_options.certfile   = /etc/rabbitmq/ssl/server.crt
# ssl_options.keyfile    = /etc/rabbitmq/ssl/server.key
# ssl_options.verify     = verify_peer
# ssl_options.fail_if_no_peer_cert = true

# ===========================================
# Federation & Shovel (Cross-DC)
# ===========================================
# Configure federation upstreams for multi-datacenter
# federation_upstream = "name=soc-primary host=primary.arpt.gov.dz"
# federation_policy = "apply-to=all pattern=\"^soc\\.\""

# ===========================================
# Performance Tuning for High Throughput
# ===========================================

# TCP buffer sizes
tcp_listen_options.backlog = 4096
tcp_listen_options.sndbuf = 131072
tcp_listen_options.recbuf = 131072

# Heartbeat interval (seconds)
heartbeat = 60

# Frame max size (increase for large messages)
frame_max = 10485760  # 10MB

# Lazy queues (better performance for high-throughput)
# Set to 'only' or 'mixed' for better disk I/O
# lazy_queue_explicit_gc_policy = {global, 1000}

# ===========================================
# Management Plugin Settings
# ===========================================
# Load definitions on boot
load_definitions = /etc/rabbitmq/definitions.json

# Management statistics collection interval
management.sample_retention_hours = 168  # 7 days

# HTTP API rate limiting
rates_mode = none  # Disable rate limiting for internal use
