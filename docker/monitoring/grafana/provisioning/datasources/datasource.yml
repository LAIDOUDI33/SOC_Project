apiVersion: 1

datasources:
  # ============= PROMETHEUS (Primary Metrics) =============
  
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      timeInterval: "15s"
      cacheDuration: "30s"
    secureJsonData:
      # Add if authentication enabled
      # httpHeaderValue: 'Bearer xxx'

  # ============= GRAFANA INTERNAL (Annotations) =============
  
  - name: Grafana
    type: grafana
    access: proxy
    url: http://grafana:3000
    isDefault: false
    editable: false

  # ============= ALERTMANAGER (Alert Status) =============
  
  - name: Alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    isDefault: false
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaAlerts: true

