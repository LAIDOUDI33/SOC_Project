# ===========================================
# National SOC Platform - Dashboard Provisioning
# Algeria 2026-2030 | Auto-load dashboards on startup
# ===========================================

apiVersion: 1

providers:
  # ============= BUILT-IN DASHBOARDS =============
  
  - name: 'SOC Platform Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

  # ============= DEFAULT FOLDERS =============
  
  - name: 'Telecom Monitoring'
    orgId: 1
    folder: 'Telecom Operations'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards/telecom

  - name: 'Security Operations'
    orgId: 1
    folder: 'Security (SOC)'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards/security

  - name: 'Infrastructure'
    orgId: 1
    folder: 'Infrastructure'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards/infrastructure

  - name: 'Compliance & ARPT'
    orgId: 1
    folder: 'Compliance'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards/compliance
