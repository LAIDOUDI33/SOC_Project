# ===========================================
# National SOC Platform - Prometheus Configuration
# Algeria 2026-2030 | Telecom Operator Scale
#
# Metrics Collection for:
# - Application (Next.js/Node.js)
# - PostgreSQL Database
# - Redis Cache
# - Nginx Load Balancer
# - System Resources
#
# Scrape Interval: 15s (high-frequency for telecom)
# Retention: 30 days
# ===========================================

global:
  scrape_interval: 15s          # High frequency for telecom traffic
  evaluation_interval: 15s      # Evaluate rules every 15s
  scrape_timeout: 10s           # Timeout for slow scrapes
  external_labels:
    monitor: 'soc-platform'
    environment: 'production'
    operator: '${OPERATOR_NAME:-algeria-telecom}'

# ============= ALERTMANAGER CONFIGURATION =============

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s

# ============= RULE FILES =============

rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/rules/alerts.yml

# ============= SCRAPE CONFIGURATIONS =============

scrape_configs:

  # ============= PROMETHEUS SELF-MONITORING =============
  
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s
    metrics_path: /metrics

  # ============= SOC APPLICATION METRICS =============
  
  - job_name: 'soc-application'
    static_configs:
      - targets: ['soc-app:3000']
        labels:
          service: 'soc-platform'
          component: 'application'
    scrape_interval: 10s           # More frequent for app metrics
    metrics_path: /api/metrics/prometheus
    scrape_timeout: 5s
    
    # Relabeling for instance identification
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'soc-app-1'

  # ============= NODE EXPORTER (System Metrics) =============
  
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'infrastructure'
          component: 'system'
    scrape_interval: 15s
    metrics_path: /metrics

  # ============= POSTGRESQL EXPORTER =============
  
  - job_name: 'postgresql-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'database'
          component: 'postgresql'
    scrape_interval: 30s            # Less frequent for DB
    metrics_path: /metrics
    
    # Custom labels for database monitoring
    relabel_configs:
      - source_labels: [__address__]
        target_label: database
        replacement: 'soc_production'

  # ============= REDIS EXPORTER =============
  
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'cache'
          component: 'redis'
    scrape_interval: 15s
    metrics_path: /metrics

  # ============= NGINX EXPORTER (Web Server Metrics) =============
  
  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'load-balancer'
          component: 'nginx'
    scrape_interval: 15s
    metrics_path: /metrics

  # ============= CADVISOR (Container Metrics) =============
  
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'containers'
          component: 'docker'
    scrape_interval: 20s
    metrics_path: /metrics

  # ============= BLACKBOX EXPORTER (Uptime Monitoring) =============
  
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://localhost:3000/api/health   # App health
          - https://soc.arpt.gov.dz/health   # Production health
          - https://wazuh.internal:55000     # Wazuh SIEM
          - https://misp.internal             # MISP Threat Intel
        labels:
          service: 'uptime'
          component: 'endpoints'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # job_name: 'blackbox-tcp'
  #   metrics_path: /probe
  #   params:
  #     module: [tcp_connect]
  #   static_configs:
  #     - targets:
  #         - postgres:5432                  # PostgreSQL
  #         - redis:6379                     # Redis
  #         - wazuh.internal:1514            # Wazuh Agent
  #       labels:
  #         service: 'tcp-uptime'
  #         component: 'ports'
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: __param_target
  #     - source_labels: [__param_target]
  #       target_label: instance
  #     - target_label: __address__
  #       replacement: blackbox-exporter:9115

  # ============= CUSTOM APPLICATION METRICS =============
  
  - job_name: 'soc-alerts-metrics'
    static_configs:
      - targets: ['soc-app:3000']
        labels:
          service: 'soc-metrics'
          component: 'alerts'
    scrape_interval: 10s
    metrics_path: /api/metrics/prometheus

  - job_name: 'soc-incidents-metrics'
    static_configs:
      - targets: ['soc-app:3000']
        labels:
          service: 'soc-metrics'
          component: 'incidents'
    scrape_interval: 10s
    metrics_path: /api/metrics/prometheus

  - job_name: 'soc-telecom-metrics'
    static_configs:
      - targets: ['soc-app:3000']
        labels:
          service: 'soc-metrics'
          component: 'telecom'
    scrape_interval: 5s              # Very frequent for telecom data
    metrics_path: /api/metrics/prometheus

# ============= REMOTE WRITE (Optional - Long-term Storage) =============

# remote_write:
#   - url: "http://victoria-metrics:8428/write"
#     queue_config:
#       max_samples_per_send: 10000
#       capacity: 250000
#       max_shards: 40

# remote_read:
#   - url: "http://victoria-metrics:8428/read"

# ============= STORAGE CONFIGURATION =============

storage:
  tsdb:
    retention: 30d               # Keep 30 days of detailed metrics
    retention_size: 50GB         # Max storage size
    wal_compression: gzip        # Compress WAL files
    head_chunks_write_queue_size: 1000  # High throughput tuning
