# ===========================================
# National SOC Platform - Nginx Configuration
# Algeria 2026-2030 | Production Load Balancer
#
# Optimized for:
# - High-traffic telecom operators (100K+ req/s)
# - SSL/TLS termination
# - DDoS protection & rate limiting
# - WebSocket support (real-time alerts)
# - Static asset caching
# ===========================================

# ============= MAIN CONFIGURATION =============

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Optimized for high concurrency
worker_rlimit_nofile 100000;
events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ============= BASIC SETTINGS =============
    
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    charset utf-8;
    
    # Logging format for telecom-scale traffic
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time '
                    'upstream_response_time=$upstream_response_time';
    
    log_format json_log escape=json '{'
        '"time": "$time_iso8601", '
        '"remote_addr": "$remote_addr", '
        '"request": "$request", '
        '"status": $status, '
        '"body_bytes_sent": $body_bytes_sent, '
        '"request_time": $request_time, '
        '"upstream_response_time": "$upstream_response_time", '
        '"http_user_agent": "$http_user_agent", '
        '"http_x_forwarded_for": "$http_x_forwarded_for"'
    '}';
    
    access_log /var/log/nginx/access.log main;
    
    # ============= PERFORMANCE OPTIMIZATIONS =============
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Timeout settings
    keepalive_timeout 65;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    
    # Buffer sizes (optimized for large payloads)
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    
    # Output compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml
        application/vnd.ms-fontobject
        font/opentype
        font/ttf
        font/woff
        font/woff2;
    
    # ============= RATE LIMITING (DDoS Protection) =============
    
    # General rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=500r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=connlimit:10m;
    
    # Status codes
    limit_req_status 429;
    limit_conn_status 429;
    
    # ============= UPSTREAM DEFINITIONS =============
    
    upstream soc_app {
        server soc-app:3000 weight=5 max_fails=3 fail_timeout=30s;
        
        # Keepalive connections to backend
        keepalive 32;
        
        # Load balancing method
        least_conn;
    }
    
    # ============= SERVER BLOCKS =============
    
    # HTTP -> HTTPS Redirect
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        
        # Health check endpoint (no redirect)
        location /health {
            access_log off;
            return 200 '{"status":"ok","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }
        
        # All other traffic redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
    
    # HTTPS Server (Main Application)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name soc.arpt.gov.dz *.soc.arpt.gov.dz localhost;
        
        # ============= SSL/TLS Configuration =============
        
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        
        # Modern SSL configuration (TLS 1.3 preferred)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/nginx/ssl/chain.pem;
        
        # HSTS (HTTP Strict Transport Security)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        
        # ============= SECURITY HEADERS =============
        
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:;" always;
        
        # ============= HEALTH CHECK ENDPOINT =============
        
        location /health {
            access_log off;
            return 200 '{"status":"ok","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
            
            # No rate limiting for health checks
            limit_req off;
            limit_conn off;
        }
        
        # ============= API ROUTES (High Performance) =============
        
        location /api/ {
            # Rate limiting for API
            limit_req zone=api burst=1000 nodelay;
            limit_conn connlimit=50;
            
            proxy_pass http://soc_app;
            proxy_http_version 1.1;
            
            # Headers for real IP
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts for API calls
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            
            # Disable buffering for streaming
            proxy_buffering off;
            proxy_cache off;
            
            # WebSocket upgrade support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Keepalive to backend
            proxy_set_header Connection "";
        }
        
        # ============= TELECOM API (Highest Priority) =============
        
        location /api/telecom/ {
            # Higher rate limits for telecom data ingestion
            limit_req zone=api burst=5000 nodelay;
            limit_conn connlimit=100;
            
            proxy_pass http://soc_app;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Longer timeouts for protocol parsing
            proxy_connect_timeout 15s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Large body size for packet data
            client_max_body_size 200M;
            
            # No buffering for real-time processing
            proxy_buffering off;
            proxy_cache off;
        }
        
        # ============= STATIC ASSETS (Cached) =============
        
        location /_next/static/ {
            proxy_pass http://soc_app;
            proxy_http_version 1.1;
            
            # Aggressive caching for static assets
            expires 365d;
            add_header Cache-Control "public, immutable";
            
            # Enable compression
            gzip_static on;
        }
        
        # ============= NEXT.JS APPLICATION =============
        
        location / {
            # Rate limiting for pages
            limit_req zone=general burst=200 nodelay;
            limit_conn connlimit=20;
            
            proxy_pass http://soc_app;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Keepalive connection
            proxy_set_header Connection "";
            
            # Standard timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Page caching
            proxy_cache_valid 200 1m;
        }
        
        # ============= WEBSOCKET SUPPORT (Real-time) =============
        
        location /socket.io/ {
            proxy_pass http://soc_app;
            proxy_http_version 1.1;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Long-lived connections
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            
            # No rate limiting for WebSockets
            limit_req off;
            limit_conn off;
        }
        
        # ============= ERROR PAGES =============
        
        error_page 429 /429.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /429.html {
            internal;
            default_type application/json;
            return 429 '{"error":"Rate limit exceeded","retry_after":1}';
        }
        
        location = /50x.html {
            internal;
            default_type application/json;
            return 503 '{"error":"Service temporarily unavailable"}';
        }
        
        # ============= DENY SENSITIVE PATHS =============
        
        location ~ /\. {
            deny all;
            return 404;
        }
        
        location ~* \.(git|svn|env|log|md)$ {
            deny all;
            return 404;
        }
    }
}
