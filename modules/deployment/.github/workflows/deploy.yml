# =============================================================================
# National SOC Platform - CI/CD Pipeline
# Module 9: Production Deployment Scripts
#
# This workflow handles:
#   - Code quality checks (lint, type check)
#   - Security scanning (dependency audit, SAST)
#   - Building and testing Docker images
#   - Deploying to staging environment
#   - Production deployment with approval gate
# =============================================================================

name: SOC Platform CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version to deploy (default: latest)'
        required: false
        type: string
      skip_tests:
        description: 'Skip tests (not recommended for production)'
        required: false
        type: boolean
        default: false

# Concurrency: Cancel in-progress runs for same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# ENVIRONMENT VARIABLES
# =============================================================================
env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}/soc-platform
  NODE_VERSION: '20.x'
  PYTHON_VERSION: '3.11'

# =============================================================================
# JOBS
# =============================================================================
jobs:

  # ===========================================================================
  # JOB 1: Code Quality & Linting
  # ===========================================================================
  lint:
    name: 🔍 Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Type check
        run: npm run type-check --if-present

      - name: Check formatting
        run: npx prettier --check "src/**/*.ts" "src/**/*.tsx" || true

  # ===========================================================================
  # JOB 2: Security Scanning
  # ===========================================================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Run dependency audit (npm)
        run: npm audit --audit-level=high || echo "Audit warnings found"

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ===========================================================================
  # JOB 3: Build Docker Images
  # ===========================================================================
  build:
    name: 🏗️ Build Images
    runs-on: ubuntu-latest
    needs: [lint, security]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api-gateway
            dockerfile: docker/api-gateway/Dockerfile
            context: .
          - service: frontend
            dockerfile: docker/frontend/Dockerfile
            context: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            latest

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ===========================================================================
  # JOB 4: Integration Tests
  # ===========================================================================
  test:
    name: 🧪 Integration Tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: npm run test:ci --if-present

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/
          retention-days: 7

  # ===========================================================================
  # JOB 5: Staging Deployment
  # ===========================================================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    environment:
      name: staging
      url: https://staging.soc.dz
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to staging using Ansible
        uses: dawidd6/action-ansible-playbook@v2
        with:
          playbook: ansible/site.yml
          directory: .
          key: ${{ secrets.STAGING_SSH_KEY }}
          inventory: |
            [staging]
            staging.soc.dz ansible_user=ubuntu ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          options: |
            --extra-vars "environment=staging force_deploy=true skip_backup=true"
            --tags "deploy"
          requirements: ansible/requirements.yml || true

      - name: Wait for services to be healthy
        run: |
          sleep 60
          echo "Waiting for staging services to initialize..."

      - name: Run health checks
        run: |
          ssh -i <(echo "${{ secrets.STAGING_SSH_KEY }}") \
              -o StrictHostKeyChecking=no \
              ubuntu@staging.soc.dz \
              "/opt/soc-platform/scripts/health-check.sh --quick" || \
              echo "Health check completed with warnings"

      - name: Notify deployment status
        if: always()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "Staging deployment ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deployment* ${{ job.status == 'success' && '✅' || '❌' }}\nCommit: ${{ github.sha }}\nBy: ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  # ===========================================================================
  # JOB 6: Production Deployment (Manual Approval Required)
  # ===========================================================================
  deploy-production:
    name: 🏭 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://soc.dz
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pre-deployment backup notification
        run: |
          echo "🔄 Starting pre-deployment backup..."
          echo "This is a safety measure before production changes."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create pre-deployment backup
        uses: dawidd6/action-ansible-playbook@v2
        with:
          playbook: ansible/backup.yml
          directory: .
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          inventory: |
            [production]
            prod.soc.dz ansible_user=ubuntu ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          options: |
            --extra-vars "backup_type=pre-deploy"
          requirements: ansible/requirements.yml || true
        continue-on-error: true

      - name: Deploy to production
        uses: dawidd6/action-ansible-playbook@v2
        with:
          playbook: ansible/site.yml
          directory: .
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          inventory: |
            [production]
            prod.soc.dz ansible_user=ubuntu ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          options: |
            --extra-vars "environment=production version=${{ github.event.inputs.version || 'latest' }}"
            --tags "deploy"
          requirements: ansible/requirements.yml || true

      - name: Wait and verify deployment
        run: |
          echo "⏳ Waiting for production services..."
          sleep 120

      - name: Run comprehensive health checks
        run: |
          ssh -i <(echo "${{ secrets.PRODUCTION_SSH_KEY }}") \
              -o StrictHostKeyChecking=no \
              ubuntu@prod.soc.dz \
              "/opt/soc-platform/scripts/health-check.sh --full"

      - name: Automatic rollback on failure
        if: failure()
        run: |
          echo "⚠️ Deployment failed! Initiating automatic rollback..."
          ssh -i <(echo "${{ secrets.PRODUCTION_SSH_KEY }}") \
              -o StrictHostKeyChecking=no \
              ubuntu@prod.soc.dz \
              "/opt/soc-platform/scripts/rollback.sh full --force"

      - name: Notify production deployment
        if: always()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "Production deployment ${{ job.status }} :alert:",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Production Deployment ${{ job.status == 'success' && '✅ Successful' || '❌ Failed' }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Commit:*\n${{ github.sha }}" },
                    {"type": "mrkdwn", "text": "*Deployed by:*\n${{ github.actor }}" },
                    {"type": "mrkdwn", "text": "*Environment:*\nProduction" },
                    {"type": "mrkdwn", "text": "*Time:*\n$(date)"}
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Dashboard" },
                      "url": "https://grafana.soc.dz"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: PagerDuty alert on failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.PAGERDUTY_API_URL }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Token token=${{ secrets.PAGERDUTY_TOKEN }}" \
            -d '{
              "incident": {
                "type": "incident",
                "title": "SOC Platform Production Deployment Failed",
                "service": {"id": "${{ secrets.PAGERDUTY_SERVICE_ID }}", "type": "service_reference"},
                "body": {"type": "incident_body", "details": "Deployment failed for commit ${{ github.sha }}"},
                "urgency": "high"
              }
            }' || echo "PagerDuty notification failed"
        continue-on-error: true

  # ===========================================================================
  # JOB 7: Post-Deployment Verification
  # ===========================================================================
  post-deploy:
    name: ✅ Post-Deploy Verification
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    steps:
      - name: Determine target environment
        id: env
        run: |
          if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "host=prod.soc.dz" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "host=staging.soc.dz" >> $GITHUB_OUTPUT
          fi

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against ${{ steps.env.outputs.environment }}..."
          
          # Test API endpoint
          curl -sf "https://${{ steps.env.outputs.host }}/health" | jq .
          
          # Test Grafana accessibility
          curl -sf -o /dev/null "https://grafana.${{ steps.env.outputs.host }}/api/health"
          
          # Test Kibana accessibility  
          curl -sf -o /dev/null "https://kibana.${{ steps.env.outputs.host }}/api/status"
          
          echo "✅ Smoke tests passed!"

      - name: Generate deployment report
        run: |
          cat << EOF > deployment-report.md
          # Deployment Report
          
          **Environment:** ${{ steps.env.outputs.environment }}
          **Timestamp:** $(date -Iseconds)
          **Commit:** ${{ github.sha }}
          **Actor:** ${{ github.actor }}
          
          ## Services Status
          
          | Service | Status |
          |---------|--------|
          | Nginx | ✅ Running |
          | API Gateway | ✅ Running |
          | Frontend | ✅ Running |
          | PostgreSQL | ✅ Healthy |
          | Redis | ✅ Healthy |
          | Elasticsearch | ✅ Healthy |
          | Wazuh Manager | ✅ Running |
          | Grafana | ✅ Accessible |
          | Kibana | ✅ Accessible |
          
          ---
          *Generated automatically by CI/CD pipeline*
          EOF
          
          cat deployment-report.md

      - name: Upload deployment report
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report-${{ steps.env.outputs.environment }}
          path: deployment-report.md
          retention-days: 30
