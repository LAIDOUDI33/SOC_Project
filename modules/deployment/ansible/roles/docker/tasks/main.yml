# =============================================================================
# Docker Role - Main Tasks
# Handles: Docker engine installation, configuration, and Docker Compose
# =============================================================================
---

- name: "DOCKER | Display role start message"
  debug:
    msg: "═══ Starting Docker Engine Installation ═══"

# ============================================================================
# SECTION 1: Prerequisites
# ============================================================================
- name: "DOCKER | Install Docker prerequisites (Debian/Ubuntu)"
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"
  tags: [docker-prereqs]

- name: "DOCKER | Install Docker prerequisites (RHEL/CentOS)"
  yum:
    name:
      - yum-utils
      - device-mapper-persistent-data
      - lvm2
    state: present
  when: ansible_os_family == "RedHat"
  tags: [docker-prereqs]

# ============================================================================
# SECTION 2: Docker Repository Setup
# ============================================================================
- name: "DOCKER | Add Docker GPG key (Debian/Ubuntu)"
  apt_key:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    keyring: /usr/share/keyrings/docker-archive-keyring.gpg
    state: present
  when: ansible_os_family == "Debian"
  tags: [docker-repo]

- name: "DOCKER | Add Docker APT repository (Debian/Ubuntu)"
  apt_repository:
    repo: "deb [arch={{ architecture_map[ansible_architecture] }} signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
    update_cache: yes
  vars:
    architecture_map:
      x86_64: amd64
      aarch64: arm64
      armv7l: armhf
  when: ansible_os_family == "Debian"
  tags: [docker-repo]

- name: "DOCKER | Add Docker YUM repository (RHEL/CentOS)"
  yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable
    baseurl: https://download.docker.com/linux/{{ (ansible_distribution == 'RedHat') | ternary('rhel', 'centos') }}/$releasever/$basearch/stable
    gpgcheck: yes
    gpgkey: https://download.docker.com/linux/{{ (ansible_distribution == 'RedHat') | ternary('rhel', 'centos') }}/gpg
    enabled: yes
  when: ansible_os_family == "RedHat"
  tags: [docker-repo]

# ============================================================================
# SECTION 3: Docker Engine Installation
# ============================================================================
- name: "DOCKER | Install Docker Engine (Debian/Ubuntu)"
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"
  notify: Restart Docker
  tags: [docker-install]

- name: "DOCKER | Install Docker Engine (RHEL/CentOS)"
  yum:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
  when: ansible_os_family == "RedHat"
  notify: Restart Docker
  tags: [docker-install]

# ============================================================================
# SECTION 4: Docker Configuration
# ============================================================================
- name: "DOCKER | Create Docker configuration directory"
  file:
    path: /etc/docker
    state: directory
    mode: '0755'
  tags: [docker-config]

- name: "DOCKER | Configure Docker daemon"
  template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: Restart Docker
  tags: [docker-config]

- name: "DOCKER | Create Docker systemd override directory"
  file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: '0755'
  tags: [docker-config]

- name: "DOCKER | Configure Docker service options"
  copy:
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/dockerd --containerd /run/containerd/containerd.sock --log-driver=json-file --log-opt=max-size=50m --log-opt=max-file=5
    dest: /etc/systemd/system/docker.service.d/override.conf
    mode: '0644'
  notify: Reload systemd
  tags: [docker-config]

# ============================================================================
# SECTION 5: User Permissions
# ============================================================================
- name: "DOCKER | Add SOC admin user to docker group"
  user:
    name: "{{ soc_system_user }}"
    groups: docker
    append: yes
  tags: [docker-users]

# ============================================================================
# SECTION 6: Service Management
# ============================================================================
- name: "DOCKER | Ensure Docker is started and enabled"
  service:
    name: docker
    state: started
    enabled: yes
  tags: [docker-service]

- name: "DOCKER | Ensure containerd is started and enabled"
  service:
    name: containerd
    state: started
    enabled: yes
  tags: [docker-service]

# ============================================================================
# SECTION 7: Docker Compose Installation (Standalone)
# ============================================================================
- name: "DOCKER | Check if docker compose plugin is available"
  command: docker compose version
  register: docker_compose_check
  changed_when: false
  ignore_errors: yes
  tags: [docker-compose]

- name: "DOCKER | Install Docker Compose standalone if plugin not available"
  get_url:
    url: "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-linux-{{ architecture_map[ansible_architecture] }}"
    dest: /usr/local/bin/docker-compose
    mode: '0755'
  vars:
    architecture_map:
      x86_64: x86_64
      aarch64: aarch64
      armv7l: armv7
  when: docker_compose_check.rc != 0
  tags: [docker-compose]

# ============================================================================
# SECTION 8: Network Configuration for Containers
# ============================================================================
- name: "DOCKER | Create Docker networks for SOC platform"
  docker_network:
    name: "{{ item.name }}"
    driver: bridge
    ipam_config:
      - subnet: "{{ item.subnet }}"
    state: present
  loop:
    - { name: soc-frontend, subnet: 172.20.0.0/24 }
    - { name: soc-backend, subnet: 172.21.0.0/22 }
    - { name: soc-data, subnet: 172.22.0.0/22 }
    - { name: soc-monitoring, subnet: 172.23.0.0/22 }
  tags: [docker-networks]
  ignore_errors: yes

# ============================================================================
# SECTION 9: Log Rotation for Docker
# ============================================================================
- name: "DOCKER | Configure log rotation for Docker containers"
  template:
    src: docker-logrotate.j2
    dest: /etc/logrotate.d/docker-containers
    mode: '0644'
  tags: [docker-logging]

# ============================================================================
# SECTION 10: Verification
# ============================================================================
- name: "DOCKER | Verify Docker installation"
  command: docker info
  register: docker_info
  changed_when: false
  tags: [docker-verify]

- name: "DOCKER | Display Docker information"
  debug:
    msg: |
      Docker Version: {{ docker_info.stdout_lines | select('search', 'Server Version') | first | regex_replace('^\\s*Server Version:\\s*', '') }}
      Storage Driver: {{ docker_info.stdout_lines | select('search', 'Storage Driver') | first | regex_replace('^\\s*Storage Driver:\\s*', '') }}
      Total Memory: {{ docker_info.stdout_lines | select('search', 'Total Memory') | first | regex_replace('^\\s*Total Memory:\\s*', '') }}
  tags: [docker-verify]

- name: "DOCKER | Display role completion message"
  debug:
    msg: "═══ Docker Engine Installation Complete ═══"
