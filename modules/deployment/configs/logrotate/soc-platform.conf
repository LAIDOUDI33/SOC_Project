# =============================================================================
# National SOC Platform - Log Rotation Configuration
# Module 9: Production Deployment Scripts
#
# Install to: /etc/logrotate.d/soc-platform
#
# This configuration handles log rotation for all SOC platform services.
# Logs are rotated daily, compressed, and retained for 30 days by default.
# =============================================================================

# ────────────────────────────────────────────────────────────────────────────────
# Nginx Access & Error Logs
# ────────────────────────────────────────────────────────────────────────────────

/var/log/nginx/*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid)
    endscript
}

/var/log/nginx/soc_*.log {
    daily
    missingok
    rotate 60
    compress
    delaycompress
    notifempty
    create 0640 www-data adm
    dateext
    dateformat .%Y%m%d
    maxsize 500M
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid)
    endscript
}

# ────────────────────────────────────────────────────────────────────────────────
# Docker Container Logs (via JSON file driver)
# ────────────────────────────────────────────────────────────────────────────────
# Note: Docker's json-file driver handles its own rotation via docker-compose config.
# This section handles any host-level container logs.

/var/lib/docker/containers/*/*.log {
    weekly
    missingok
    rotate 4
    compress
    delaycompress
    copytruncate
    notifempty
    maxsize 200M
}

# ────────────────────────────────────────────────────────────────────────────────
# PostgreSQL Database Logs
# ────────────────────────────────────────────────────────────────────────────────

/var/log/soc/postgres/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 postgres postgres
    copytruncate
    # Don't rotate if database is being backed up
    prerotate
        if [ -f /var/backups/soc/.backup_in_progress ]; then
            exit 1
        fi
    endscript
}

# ────────────────────────────────────────────────────────────────────────────────
# Elasticsearch Logs
# ────────────────────────────────────────────────────────────────────────────────

/var/log/soc/elasticsearch/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 0640 elasticsearch elasticsearch
    copytruncate
    maxsize 1G
}

