# =============================================================================
# National SOC Platform - Nginx Main Configuration
# Module 9: Production Deployment Scripts
#
# This is the main site configuration for the SOC platform.
# Handles: SSL termination, reverse proxy, rate limiting, security headers
# =============================================================================

# Upstream definitions (loaded from separate file)
include /etc/nginx/includes/upstreams.conf;

# Rate limiting zones
# Global request rate limiting
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:5m rate=10r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Server block - HTTP to HTTPS redirect
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    
    # Security headers even on HTTP
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    
    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server block
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    
    server_name ${BASE_DOMAIN} _;
    
    # ──────────────────────────────────────────────────
    # SSL/TLS Configuration
    # ──────────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/${BASE_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${BASE_DOMAIN}/privkey.pem;
    
    # Modern TLS configuration (TLS 1.2 and 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # SSL session settings for performance
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/${BASE_DOMAIN}/chain.pem;
    
    # ──────────────────────────────────────────────────
    # Security Headers
    # ──────────────────────────────────────────────────
    include /etc/nginx/includes/security-headers.conf;
    
    # ──────────────────────────────────────────────────
    # Connection Limits
    # ──────────────────────────────────────────────────
    limit_conn conn_limit 50;
    
    # ──────────────────────────────────────────────────
    # Logging
    # ──────────────────────────────────────────────────
    access_log /var/log/nginx/soc_access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/soc_error.log warn;
    
    # Custom log format with security info
    log_format security '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'rt=$request_time '
                       'upstream=$upstream_response_time '
                       'conn=$connection '
                       'ssl_protocol=$ssl_protocol '
                       'ssl_cipher=$ssl_cipher';
    
    # ──────────────────────────────────────────────────
    # Health Check Endpoint
    # ──────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 '{"status":"healthy","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }
    
    # ──────────────────────────────────────────────────
    # API Gateway Proxy
    # ──────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://api-gateway:4000/;
        proxy_http_version 1.1;
        
        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Disable caching for API
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }
    
    # Authentication endpoints (stricter rate limiting)
    location ~ ^/api/(auth|login|register|token) {
        limit_req zone=auth_limit burst=5 nodelay;
        
        proxy_pass http://api-gateway:4000;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Sensitive data - don't log passwords
        # (handled by application level)
    }
    
    # ──────────────────────────────────────────────────
    # Frontend Application
    # ──────────────────────────────────────────────────
    location / {
        limit_req zone=general_limit burst=30 nodelay;
        
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Caching for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            proxy_pass http://frontend:3000;
        }
    }
    
    # ──────────────────────────────────────────────────
    # Grafana Dashboard
    # ──────────────────────────────────────────────────
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for Grafana live features
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # ──────────────────────────────────────────────────
    # Kibana Dashboard
    # ──────────────────────────────────────────────────
    location /kibana/ {
        proxy_pass http://kibana:5601/;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 300s;
    }
    
    # ──────────────────────────────────────────────────
    # Wazuh API
    # ──────────────────────────────────────────────────
    location /wazuh/ {
        proxy_pass http://wazuh-manager:55000/;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Wazuh needs longer timeouts for large queries
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # ──────────────────────────────────────────────────
    # Security Blocks
    # ──────────────────────────────────────────────────
    
    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Block common attack patterns
    location ~* (\.git|\.env|\.htaccess|\.htpasswd) {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Block SQL injection patterns (basic)
    location ~* (union.*select|insert.*into|delete.*from|drop.*table) {
        return 403;
    }
    
    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# Subdomain-based service routing (for dedicated domains)
# Grafana subdomain
server {
    listen 443 ssl http2;
    server_name grafana.${BASE_DOMAIN};
    
    ssl_certificate /etc/letsencrypt/live/${BASE_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${BASE_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    
    include /etc/nginx/includes/security-headers.conf;
    
    location / {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Kibana subdomain
server {
    listen 443 ssl http2;
    server_name kibana.${BASE_DOMAIN};
    
    ssl_certificate /etc/letsencrypt/live/${BASE_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${BASE_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    
    include /etc/nginx/includes/security-headers.conf;
    
    location / {
        proxy_pass http://kibana:5601;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
