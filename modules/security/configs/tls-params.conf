# ============================================================================
# TLS Parameters Configuration
# National SOC Platform for Algeria (2026-2030)
# ============================================================================
#
# Modern TLS configuration following current best practices.
# Compatible with Nginx, Apache, and other servers supporting OpenSSL.
#
# Based on:
# - Mozilla SSL Configuration Generator (Intermediate/Modern)
# - CIS Benchmark for TLS Configuration
# - NIST SP 800-52 Rev2
#
# Version: 1.0.0
# Last Updated: 2024-01-15
# ============================================================================

# ============================================================================
# PROTOCOL VERSIONS
# ============================================================================

# Minimum TLS version (TLSv1.2 is minimum acceptable)
# For maximum security: Use only TLSv1.3 when all clients support it
ssl_protocols TLSv1.2 TLSv1.3;

# Note on protocol support:
# - TLSv1.0 and TLSv1.1 are INSECURE and must be disabled
# - TLSv1.2 provides good compatibility with strong ciphers
# - TLSv1.3 provides best security (recommended when possible)

# ============================================================================
# CIPHER SUITES
# ============================================================================

# Server cipher preference (use server's ordering, not client's)
ssl_prefer_server_ciphers on;

# Cipher suite configuration for TLSv1.2
# Order matters: strongest first
ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256';

# Cipher suites to explicitly disable (for reference):
# BLOCKED CIPHERS (DO NOT USE):
# - DES, 3DES, RC4 (broken/insecure)
# - NULL ciphers (no encryption)
# - EXPORT grade (intentionally weak)
# - aNULL, eNULL (no authentication)
# - ADH (anonymous Diffie-Hellman)
# - MD5 based (collision attacks)

# ============================================================================
# ELLIPTIC CURVE CONFIGURATION
# ============================================================================

# Supported elliptic curves (order matters)
ssl_ecdh_curve secp384r1:X25519;

# Curve priority:
# 1. secp384r1 - 384-bit prime field (high security)
# 2. X25519 - Modern curve for key exchange

# Alternative curves (if needed):
# - secp521r1 - 521-bit (even higher security but slower)
# - secp256r1 - 256-bit (faster, still secure)

# ============================================================================
# DIFFIE-HELLMAN PARAMETERS
# ============================================================================

# DH parameter file location
# Generate with: openssl dhparam -out /etc/nginx/dhparam.pem 4096
ssl_dhparam /etc/nginx/dhparam.pem;

# Recommended DH parameter sizes:
# - 2048 bits: Minimum acceptable
# - 4096 bits: Recommended for high-security environments
# - 8192 bits: Maximum security (significant performance impact)

# ============================================================================
# SESSION CONFIGURATION
# ============================================================================

# Session cache settings
ssl_session_cache shared:SSL:50m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Session ticket considerations:
# - Disabled tickets = better forward secrecy
# - If enabled, rotate ticket keys regularly (hourly recommended)

# ============================================================================
# OCSP STAPLING
# ============================================================================

# Enable OCSP Stapling for faster certificate validation
ssl_stapling on;
ssl_stapling_verify on;

# Trusted certificate chain for OCSP verification
ssl_trusted_certificate /etc/ssl/certs/fullchain.pem;

# DNS resolver for OCSP lookups
resolver 8.8.8.8 8.8.4.4 valid=300s ipv6=off;
resolver_timeout 5s;

# ============================================================================
# CERTIFICATE CONFIGURATION
# ============================================================================

# Main server certificate (full chain required)
ssl_certificate /etc/ssl/certs/soc.algeria.dz.fullchain.pem;
ssl_certificate_key /etc/ssl/certs/soc.algeria.dz.privkey.pem;

# Certificate requirements:
# - RSA: Minimum 2048 bits, recommended 4096 bits
# - ECDSA: P-256 or higher (P-384 recommended)
# - SHA-256 or SHA-384 signatures (SHA-1 deprecated)

# Client certificate authentication (mTLS) - if needed
# ssl_client_certificate /etc/ssl/certs/ca-bundle.crt;
# ssl_verify_client optional; # or 'on' for mandatory mTLS
# ssl_verify_depth 3;

# ============================================================================
# HSTS (HTTP STRICT TRANSPORT SECURITY)
# ============================================================================

# HSTS header (also set in nginx security headers config)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# HSTS values explained:
# - max-age=31536000: 1 year in seconds (minimum recommended: 15768000 = 6 months)
# - includeSubDomains: Apply HSTS to all subdomains
# - preload: Submit to browser preload lists (requires max-age >= 1 year)

# ============================================================================
# PERFORMANCE TUNING
# ============================================================================

# SSL session caching improves performance for returning visitors
# Adjust cache size based on traffic:
# - Low traffic (<1000 req/s): 10m
# - Medium traffic (1000-10000 req/s): 20m-50m
# - High traffic (>10000 req/s): 50m-100m

# Hardware acceleration (if available):
# ssl_engine [device]; # e.g., ssl_engine aesni;

# ============================================================================
# COMPLIANCE NOTES
# ============================================================================

# This configuration meets the following standards:
#
# CIS Benchmark:
# ✓ TLS 1.0/1.1 disabled
# ✓ Strong cipher suites only
# ✓ Secure DH parameters (2048+ bits)
# ✓ OCSP stapling enabled
# ✓ HSTS configured properly
#
# NIST SP 800-52:
# ✓ FIPS-approved algorithms
# ✓ Minimum 112-bit security strength
# ✓ Proper certificate validation
#
# PCI DSS:
# ✓ No SSL/TLS versions with known vulnerabilities
# ✓ Strong cryptography (AES-256, SHA-256+)
# ✓ No export-grade cipher suites

