# ============================================================================
# Nginx Security Configuration
# National SOC Platform for Algeria (2026-2030)
# ============================================================================
#
# This configuration file contains hardened security settings for Nginx.
# Based on CIS Benchmark, NIST guidelines, and OWASP recommendations.
#
# Version: 1.0.0
# Last Updated: 2024-01-15
# 
# USAGE:
#   Include this file in your nginx server block:
#   include /etc/nginx/conf.d/security.conf;
#
# WARNING:
#   Test configuration before deploying to production:
#   nginx -t && systemctl reload nginx
# ============================================================================

# ============================================================================
# 1. SERVER INFORMATION HIDING
# ============================================================================

# Hide server version (security through obscurity)
server_tokens off;

# Custom server string (optional - remove if not needed)
more_set_headers "Server: National-SOC-Algeria";

# Remove X-Powered-By header if present
proxy_hide_header X-Powered-By;
fastcgi_hide_header X-Powered-By;

# ============================================================================
# 2. SECURITY HEADERS
# ============================================================================

# Content Security Policy - Prevents XSS and data injection attacks
# Adjust domains based on your actual infrastructure
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' wss: https: http://localhost:*; media-src 'self'; object-src 'none'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

# Strict Transport Security - Forces HTTPS connections
# 1 year max-age with subdomains included, preload ready
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# X-Frame-Options - Prevents clickjacking attacks
add_header X-Frame-Options "DENY" always;

# X-Content-Type-Options - Prevents MIME sniffing
add_header X-Content-Type-Options "nosniff" always;

# X-XSS-Protection - Legacy XSS filter (disabled in favor of CSP)
add_header X-XSS-Protection "0" always;

# Referrer-Policy - Controls referrer information leakage
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions-Policy - Disables unnecessary browser features
add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(self), battery=(), camera=(), clipboard-read=(), clipboard-write=(self), displaycapture=(), document-domain=(), encrypted-media=(self), fullscreen=(self), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(self), publickey-credentials-get=(self), screen-wake-lock=(), serial=(), usb=(), web-share=(self), xr-spatial-tracking=()" always;

# Cross-Origin Policies (for modern browsers)
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Cache-Control for sensitive pages
add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
add_header Pragma "no-cache" always;
add_header Expires "0" always;

# Additional security headers
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Expect-CT "max-age=86400, enforce" always;

# ============================================================================
# 3. SSL/TLS CONFIGURATION
# ============================================================================

# Only enable TLS 1.2 and 1.3 (disable insecure versions)
ssl_protocols TLSv1.2 TLSv1.3;

# Use strong cipher suites only
ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256';

# Prefer server cipher order
ssl_prefer_server_ciphers on;

# Disable SSL session caching for perfect forward secrecy (or configure securely)
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP Stapling - Faster certificate validation
ssl_stapling on;
ssl_stapling_verify on;
ssl_trusted_certificate /etc/ssl/certs/chain.pem;
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

# DH Parameters (generate with: openssl dhparam -out /etc/nginx/dhparam.pem 4096)
ssl_dhparam /etc/nginx/dhparam.pem;

# Certificate configuration
ssl_certificate /etc/ssl/certs/soc.algeria.dz.fullchain.pem;
ssl_certificate_key /etc/ssl/certs/soc.algeria.dz.privkey.pem;

# ============================================================================
# 4. REQUEST SIZE LIMITS
# ============================================================================

# Limit request body size (prevents DoS via large uploads)
client_max_body_size 10m;

# Buffer size limits (prevents buffer overflow attacks)
client_body_buffer_size 128k;
client_max_body_size 10m;
client_header_buffer_size 1k;
large_client_header_buffers 4 16k;

# Request timeout settings
client_body_timeout 12;
client_header_timeout 12;
send_timeout 10;
keepalive_timeout 65;
keepalive_requests 100;

# ============================================================================
# 5. METHOD RESTRICTIONS
# ============================================================================

# Allow only necessary HTTP methods
if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$) {
    return 444;
}

# Block certain methods on specific endpoints
if ($request_method = PURGE) {
    return 444;
}

# ============================================================================
# 6. ACCESS CONTROL & RATE LIMITING
# ============================================================================

# Rate limiting zone definitions (define in http block)
# limit_req_zone $binary_remote_addr zone=general:10r/s;
# limit_req_zone $binary_remote_addr zone=api:30r/m;
# limit_req_zone $binary_remote_addr zone=login:5r/m;
# limit_conn_zone $binary_remote_addr zone=connlimit:10m;

# Apply rate limits
# limit_req zone=general burst=20 nodelay;
# limit_conn connlimit 20;

# Block access to hidden files
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# Block access to sensitive files
location ~* \.(sql|log|bak|conf|ini|sh|old|orig|gitignore|env|htaccess|htpasswd)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# Block access to backup files
location ~* ~$ {
    deny all;
    access_log off;
    log_not_found off;
}

# ============================================================================
# 7. PROXY SECURITY SETTINGS
# ============================================================================

# Proxy headers
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# Remove proxy headers that could leak information
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
proxy_hide_header X-AspNet-Version;
proxy_hide_header X-AspNetMvc-Version;

# Proxy timeouts
proxy_connect_timeout 10;
proxy_send_timeout 60;
proxy_read_timeout 60;

# Buffer size for proxy responses
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;

# ============================================================================
# 8. LOGGING CONFIGURATION
# ============================================================================

# Custom log format with security-relevant fields
log_format security '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   '$request_time $upstream_response_time '
                   '$pipe';

# Access log location
access_log /var/log/nginx/access.log security;
error_log /var/log/nginx/error.log warn;

# Disable logging for health checks
location = /health {
    access_log off;
    return 200 "OK";
    add_header Content-Type text/plain;
}

# ============================================================================
# 9. BOT AND SCANNER BLOCKING
# ============================================================================

# Block based on User-Agent (common malicious bots)
if ($http_user_agent ~* (python|curl|java|wget|perl|libwww|httpclient|scan)) {
    return 444;
}

# Map for blocking bad user agents
map $http_user_agent $blocked_agent {
    default 0;
    ~*malicious 1;
    ~*bot 1;
    ~*backdoor 1;
    ~*crawler 1;
    ~*scanner 1;
}

# Apply user-agent blocking
# if ($blocked_agent) {
#     return 444;
# }

# ============================================================================
# 10. CORS CONFIGURATION (API Endpoints)
# ============================================================================

# CORS headers for API endpoints
location /api/ {
    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '$http_origin';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CSRF-Token';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }
    
    # Add CORS headers to API responses
    add_header 'Access-Control-Allow-Origin' '$http_origin' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Expose-Headers' 'X-Request-Id,X-RateLimit-Remaining' always;
    
    # Proxy to backend
    # proxy_pass http://backend;
}

# ============================================================================
# 11. ADDITIONAL HARDENING
# ============================================================================

# Disable content sniffing for specific file types
location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    add_header X-Content-Type-Options "nosniff";
    expires 30d;
    add_header Cache-Control "public, immutable";
}

