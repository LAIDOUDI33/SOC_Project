# ============================================================
# Grafana Dashboard Provisioning - CyberSOC Analytics
# Target: Djezzy Telecom Algeria Production
# Location: /etc/grafana/provisioning/dashboards/
# =================================================-----------

apiVersion: 1

providers:
  # ----------------------------------------------------------
  # Analytics & ML Dashboards Provider
  # ----------------------------------------------------------
  - name: 'CyberSOC Analytics'
    orgId: 1
    folder: 'CyberSOC'
    folderUid: 'cybersoc-folder'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/analytics
      foldersFromFilesStructure: true

  # ----------------------------------------------------------
  # SOC Core Dashboards Provider  
  # ----------------------------------------------------------
  - name: 'CyberSOC Core'
    orgId: 1
    folder: 'CyberSOC/Core'
    folderUid: 'cybersoc-core-folder'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/core

  # ----------------------------------------------------------
  # Security Dashboards Provider
  # ----------------------------------------------------------
  - name: 'CyberSOC Security'
    orgId: 1
    folder: 'CyberSOC/Security'
    folderUid: 'cybersoc-security-folder'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/security
