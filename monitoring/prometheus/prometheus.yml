# ============================================================
# National SOC Platform - Prometheus Configuration
# Scraping configuration for SOC platform metrics
# ============================================================

global:
  scrape_interval: 15s      # Default scrape interval
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  scrape_timeout: 10s       # Per-scrape timeout
  
  # External labels
  external_labels:
    monitor: 'soc-platform'
    environment: 'production'
    organization: 'djezzy'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'alertmanager:9093'
          - 'alertmanager-backup:9093'

# Rule files for alerting rules
rule_files:
  - 'soc_alerts.yml'
  - 'telecom_alerts.yml'

# Scrape configurations
scrape_configs:

  # ----------------------------------------------------------
  # SOC Platform Application Metrics
  # ----------------------------------------------------------
  - job_name: 'soc-platform'
    metrics_path: '/api/metrics'
    scheme: https
    
    static_configs:
      - targets: ['soc-platform-service.soc-platform.svc.cluster.local:80']
        labels:
          app: 'soc-platform'
          environment: 'production'
          team: 'soc-ops'
    
    # TLS configuration for HTTPS scraping
    tls_config:
      insecure_skip_verify: false
      ca_file: /etc/prometheus/secrets/ca.crt
    
    # Authentication (if required)
    # bearer_token_file: /etc/prometheus/secrets/bearer.token
    
    # Relabeling to extract useful information
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

  # ----------------------------------------------------------
  # Node Exporter (Infrastructure Metrics)
  # ----------------------------------------------------------
  - job_name: 'node-exporter'
    static_configs:
      - targets: 
        - 'node-exporter-1:9100'
        - 'node-exporter-2:9100'
        - 'node-exporter-3:9100'
        labels:
          environment: 'production'

  # ----------------------------------------------------------
  # PostgreSQL Exporter (Database Metrics)
  # ----------------------------------------------------------
  - job_name: 'postgres-exporter'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          db_cluster: 'soc-platform-primary'

  # ----------------------------------------------------------
  # Redis Exporter (Cache Metrics)
  # ----------------------------------------------------------
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          redis_instance: 'soc-platform-cache'

  # ----------------------------------------------------------
  # Nginx Ingress Controller Metrics
  # ----------------------------------------------------------
  - job_name: 'nginx-ingress'
    metrics_path: '/metrics'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - ingress-nginx
    
    relabel_configs:
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        action: keep
        regex: prometheus

  # ----------------------------------------------------------
  # Kubernetes API Server Metrics
  # ----------------------------------------------------------
  - job_name: 'kubernetes-apiservers'
    kubernetes_sd_configs:
      - role: endpoints
    scheme: https
    
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount
    
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https

  # ----------------------------------------------------------
  # Kubernetes Nodes (cAdvisor)
  # ----------------------------------------------------------
  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
      - role: node
    
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics

  # ----------------------------------------------------------
  # Kubernetes Pods
  # ----------------------------------------------------------
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
    
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod

# Remote write configuration (for long-term storage)
remote_write:
  - url: "http://thanos-receive:19291/api/v1/receive"
    remote_timeout: 30s
    
    # Queue configuration
    queue_config:
      max_samples_per_send: 1000
      max_shards: 200
      capacity: 25000
      batch_send_deadline: 5s
      min_backoff: 30ms
      max_backoff: 100ms
