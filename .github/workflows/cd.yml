# =============================================================================
# Djezzy National SOC Platform - Continuous Deployment Pipeline
# =============================================================================
# GitOps-based CD with ArgoCD/Flux compatibility
# Environment Promotion: dev → staging → prod
# =============================================================================

name: Djezzy SOC Platform CD

on:
  workflow_run:
    workflows: ["Djezzy SOC Platform CI"]
    types: [completed]
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production
      version:
        description: 'Version to deploy (leave empty for latest)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no actual deployment)'
        required: false
        default: false
        type: boolean

env:
  ARGOCD_SERVER: argocd.soc.djezzy.dz
  ARGOCD_NAMESPACE: argocd
  HELM_REPO: https://charts.djezzy.dz

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  # ===========================================================================
  # PRE-DEPLOYMENT CHECKS
  # ===========================================================================
  pre-deploy-checks:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      target_env: ${{ steps.check.outputs.target_env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: check
        name: Determine deployment target
        run: |
          if [ "${{ github.event.inputs.environment }}" != "" ]; then
            TARGET_ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            TARGET_ENV="production"
          elif [[ "${{ github.ref }}" == refs/heads/develop ]]; then
            TARGET_ENV="staging"
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            TARGET_ENV="staging"
          else
            TARGET_ENV="none"
          fi
          
          echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT
          
          # Only proceed if CI passed
          if [ "${{ github.event.workflow_run.conclusion }}" == "success" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi
          
          echo "🚀 Deployment target: $TARGET_ENV"

  # ===========================================================================
  # DATABASE MIGRATIONS
  # ===========================================================================
  database-migration:
    name: Database Migrations
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    if: needs.pre-deploy-checks.outputs.should_deploy == 'true'
    environment:
      name: ${{ needs.pre-deploy-checks.outputs.target_env }}
      url: https://${{ needs.pre-deploy-checks.outputs.target_env == 'production' && 'soc.djezzy.dz' || format('{0}.soc.djezzy.dz', needs.pre-deploy-checks.outputs.target_env) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'bun'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create migration backup
        run: |
          echo "Creating database backup before migration..."
          kubectl exec -n soc-backend deployment/postgresql -- pg_dumpall -U soc_user > db-backup-pre-migration.sql || true
          echo "Backup complete"

      - name: Run Prisma migrations
        run: |
          bunx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production

      - name: Verify migration success
        run: |
          echo "Verifying database schema..."
          bunx prisma migrate status
          echo "Migration verification complete"

      - name: Upload migration artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-backup-${{ github.run_id }}
          path: db-backup-pre-migration.sql
          retention-days: 30

  # ===========================================================================
  # DEPLOY TO KUBERNETES (GitOps)
  # ===========================================================================
  deploy-gitops:
    name: Deploy via GitOps (${{ needs.pre-deploy-checks.outputs.target_env }})
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks, database-migration]
    if: needs.pre-deploy-checks.outputs.should_deploy == 'true'
    environment:
      name: ${{ needs.pre-deploy-checks.outputs.target_env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure ArgoCD CLI
        uses: argoproj/argo-cd-action@v1
        with:
          version: v2.10.0

      - name: Login to ArgoCD
        run: |
          argocd login ${{ env.ARGOCD_SERVER }} \
            --grpc-web \
            --auth-token ${{ secrets.ARGOCD_TOKEN }} \
            --insecure || true

      - name: Update values file for environment
        run: |
          ENV="${{ needs.pre-deploy-checks.outputs.target_env }}"
          VALUES_FILE="helm/djezzy-soc/values-${ENV}.yaml"
          
          if [ ! -f "$VALUES_FILE" ]; then
            VALUES_FILE="helm/djezzy-soc/values.yaml"
          fi
          
          echo "Using values file: $VALUES_FILE"

      - name: Sync ArgoCD application
        run: |
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "🔍 Dry run mode - no actual deployment"
            argocd app diff djezzy-soc-${{ needs.pre-deploy-checks.outputs.target_env }} \
              --local helm/djezzy-soc/ \
              --helm-set global.imageTag=${{ github.sha }} \
              --local helm/djezzy-soc/values-${{ needs.pre-deploy-checks.outputs.target_env }}.yaml || true
          else
            echo "🚀 Deploying to ${{ needs.pre-deploy-checks.outputs.target_env }}..."
            
            argocd app sync djezzy-soc-${{ needs.pre-deploy-checks.outputs.target_env }} \
              --force \
              --retry-backoff-duration 30s \
              --retry-backoff-max-duration 10m
            
            echo "Waiting for healthy state..."
            argocd app wait djezzy-soc-${{ needs.pre-deploy-checks.outputs.target_env }} \
              --health \
              --timeout 600
          fi

      - name: Get deployment status
        run: |
          argocd app get djezzy-soc-${{ needs.pre-deploy-checks.outputs.target_env }}
          echo ""
          echo "## Deployment Status" >> $GITHUB_STEP_SUMMARY
          argocd app get djezzy-soc-${{ needs.pre-deploy-checks.outputs.target_env }} -o json | \
            jq '{sync: .status.sync.status, health: .status.health.status, revision: .status.sync.revision}' >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # CANARY DEPLOYMENT (Production only)
  # ===========================================================================
  canary-deployment:
    name: Canary Deployment
    runs-on: ubuntu-latest
    needs: deploy-gitops
    if: needs.pre-deploy-checks.outputs.target_env == 'production' && github.event.inputs.dry_run != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize canary deployment
        run: |
          echo "🎯 Starting canary deployment..."
          
          # Scale up canary replicas
          kubectl scale deployment/soc-platform-api \
            -n soc-backend \
            --replicas={{ .Values.canary.replicas | default 2 }} \
            -l canary=true || true
          
          echo "Canary pods deployed"

      - name: Monitor canary metrics
        run: |
          echo "Monitoring canary performance metrics..."
          sleep 60
          
          # Check error rates
          ERROR_RATE=$(kubectl exec -n soc-backend deployment/prometheus -- \
            promql 'rate(http_requests_total{status=~"5.."}[5m])' | jq '.data.result[0].value[1]')
          
          if (( $(echo "$ERROR_RATE > 0.05" | bc -l) )); then
            echo "❌ Canary error rate too high: $ERROR_RATE"
            exit 1
          fi
          
          echo "✅ Canary metrics look good"

      - name: Promote canary to full rollout
        if: success()
        run: |
          echo "🚀 Promoting canary to full deployment..."
          
          # Remove canary label and scale to full capacity
          kubectl patch deployment/soc-platform-api \
            -n soc-backend \
            --type='json' \
            -p='[{"op": "remove", "path": "/spec/template/metadata/labels/canary"}]'
          
          kubectl scale deployment/soc-platform-api \
            -n soc-backend \
            --replicas=${{ needs.pre-deploy-checks.outputs.target_env == 'production' && '5' || '2' }}
          
          echo "Full rollout complete"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "⏪ Rolling back failed canary deployment..."
          
          kubectl rollout undo deployment/soc-platform-api -n soc-backend
          
          # Notify team
          curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-type: application/json' \
            -d '{"text":"⚠️ Canary deployment rolled back! Environment: production"}'

  # ===========================================================================
  # POST-DEPLOYMENT VERIFICATION
  # ===========================================================================
  post-deploy-verification:
    name: Post-deployment Verification
    runs-on: ubuntu-latest
    needs: [deploy-gitops]
    if: always() && needs.deploy-gitops.result == 'success'
    steps:
      - name: Health checks
        run: |
          echo "Running post-deployment health checks..."
          
          # Check all critical pods are running
          kubectl get pods -n soc-backend -l app.kubernetes.io/part-of=soc-platform --no-headers | \
            while read line; do
              POD_STATUS=$(echo $line | awk '{print $3}')
              POD_NAME=$(echo $line | awk '{print $1}')
              
              if [ "$POD_STATUS" != "Running" ]; then
                echo "❌ Pod $POD_NAME status: $POD_STATUS"
                exit 1
              fi
              
              echo "✅ Pod $POD_NAME is running"
            done

      - name: API endpoint verification
        run: |
          echo "Verifying API endpoints..."
          
          # Test main API endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            https://api.${{ needs.pre-deploy-checks.outputs.target_env == 'production' && 'soc.djezzy.dz' || format('{0}.soc.djezzy.dz', needs.pre-deploy-checks.outputs.target_env) }}/api/health)
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ API health check failed with code: $HTTP_CODE"
            exit 1
          fi
          
          echo "✅ API health check passed"

      - name: Integration smoke tests
        run: |
          echo "Running smoke tests..."
          
          # Test key integrations
          TESTS_PASSED=true
          
          # Wazuh SIEM connectivity
          kubectl exec -n soc-backend deployment/soc-platform-api -- \
            curl -sf http://wazuh-manager:55000 >/dev/null || TESTS_PASSED=false
          
          # Redis connectivity
          kubectl exec -n soc-backend deployment/soc-platform-api -- \
            redis-cli -h redis-master ping | grep -q PONG || TESTS_PASSED=false
          
          # PostgreSQL connectivity
          kubectl exec -n soc-backend deployment/soc-platform-api -- \
            pg_isready -h postgresql -p 5432 >/dev/null || TESTS_PASSED=false
          
          if [ "$TESTS_PASSED" = false ]; then
            echo "❌ Some integration tests failed"
            exit 1
          fi
          
          echo "✅ All smoke tests passed"

      - name: Performance baseline capture
        run: |
          echo "Capturing performance baselines..."
          
          # Record current resource utilization
          kubectl top pods -n soc-backend -l app.kubernetes.io/part-of=soc-platform \
            --no-headers > perf-baseline-${{ github.run_id }}.txt
          
          echo "Performance baseline captured"

  # ===========================================================================
  # ROLLBACK AUTOMATION
  # ===========================================================================
  rollback:
    name: Automated Rollback
    runs-on: ubuntu-latest
    needs: [post-deploy-verification]
    if: failure()
    steps:
      - name: Automatic rollback
        run: |
          echo "⏪ Initiating automatic rollback..."
          
          # ArgoCD rollback
          argocd app rollback djezzy-soc-${{ needs.pre-deploy-checks.outputs.target_env }}
          
          # Notify on-call team
          curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-type: application/json' \
            -d "{
              \"text\": \"🚨 AUTOMATIC ROLLBACK TRIGGERED\",
              \"attachments\": [{
                \"color\": \"danger\",
                \"fields\": [
                  {\"title\": \"Environment\", \"value\": \"${{ needs.pre-deploy-checks.outputs.target_env }}\", \"short\": true},
                  {\"title\": \"Commit\", \"value\": \"${{ github.sha }}\", \"short\": true},
                  {\"title\": \"Triggered By\", \"value\": \"Post-deploy verification failure\", \"short\": true}
                ]
              }]
            }"
          
          echo "Rollback initiated and notifications sent"

  # ===========================================================================
  # DEPLOYMENT NOTIFICATION
  # ===========================================================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [post-deploy-verification, canary-deployment]
    if: always()
    steps:
      - name: Determine notification status
        id: status
        run: |
          if [ "${{ needs.post-deploy-verification.result }}" == "success" ]; then
            STATUS="success"
            EMOJI="✅"
            COLOR="good"
          else
            STATUS="failed"
            EMOJI="❌"
            COLOR="danger"
          fi
          
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "emoji=$EMOJI" >> $GITHUB_OUTPUT
          echo "color=$COLOR" >> $GITHUB_OUTPUT

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "channel": "#soc-deployments",
              "attachments": [{
                "color": "${{ steps.status.outputs.color }}",
                "title": "${{ steps.status.outputs.emoji }} Deployment ${{ steps.status.outputs.status }}",
                "fields": [
                  {"title": "Environment", "value": "${{ needs.pre-deploy-checks.outputs.target_env }}", "short": true},
                  {"title": "Version", "value": "`${{ github.sha }}`", "short": true},
                  {"title": "Triggered by", "value": "${{ github.actor }}", "short": true},
                  {"title": "Branch", "value": "${{ github.ref_name }}", "short": true}
                ],
                "footer": "Djezzy SOC Platform CI/CD",
                "ts": ${{ github.event.head_commit.timestamp }}
              }]
            }
        env:
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Create GitHub deployment status
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: '${{ needs.pre-deploy-checks.outputs.target_env }}',
              auto_merge: false,
              required_contexts: []
            });
            
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId.data.id,
              state: '${{ steps.status.outputs.status == 'success' && 'success' || 'failure' }}',
              description: 'Deployment completed via CI/CD pipeline',
              log_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });
