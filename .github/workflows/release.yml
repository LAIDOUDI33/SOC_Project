# ============================================================
# National SOC Platform - Release Automation
# Automated versioning and changelog generation
# ============================================================

name: 📦 Release Automation

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Type of version bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - 'patch'      # 1.0.X (bug fixes)
          - 'minor'      # 1.X.0 (new features)
          - 'major'      # X.0.0 (breaking changes)
      pre_release:
        description: 'Mark as pre-release (RC)'
        required: false
        default: false
        type: boolean
      generate_changelog:
        description: 'Auto-generate changelog'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  # ============================================================
  # JOB 1: Version Analysis
  # ============================================================
  version:
    name: 🔢 Version Analysis
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.version }}
      current_version: ${{ version.outputs.current }}
      is_release: ${{ version.outputs.release }}
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔍 Determine Next Version
        id: version
        run: |
          # Get current version from package.json or git tags
          CURRENT_VERSION=$(node -p "require('./package.json').version" || echo "0.0.0")
          
          if [ "${{ github.event.inputs.version_type }}" != "" ]; then
            BUMP_TYPE="${{ github.event.inputs.version_type }}"
          else
            # Auto-detect based on commit messages
            LAST_COMMIT_MSG=$(git log -1 --pretty=%B)
            
            if [[ "$LAST_COMMIT_MSG" == *"[major]"* ]] || [[ "$LAST_COMMIT_MSG" == *"BREAKING CHANGE"* ]]; then
              BUMP_TYPE="major"
            elif [[ "$LAST_COMMIT_MSG" == *"[minor]"* ]] || [[ "$LAST_COMMIT_MSG" == *"feat"* ]]; then
              BUMP_TYPE="minor"
            else
              BUMP_TYPE="patch"
            fi
          fi
          
          # Calculate new version
          IFS='.' read -ra PARTS <<< "$CURRENT_VERSION"
          MAJOR=${PARTS[0]}
          MINOR=${PARTS[1]}
          PATCH=${PARTS[2]}
          
          case $BUMP_TYPE in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          
          # Add RC suffix if pre-release
          PRE_RELEASE="${{ github.event.inputs.pre_release || 'false' }}"
          if [ "$PRE_RELEASE" == "true" ]; then
            NEW_VERSION="${NEW_VERSION}-rc.${{ github.run_number }}"
          fi
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "release=true" >> $GITHUB_OUTPUT
          
          echo "## Version Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Current** | \`$CURRENT_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **New** | \`$NEW_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Type** | $BUMP_TYPE |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pre-release** | $PRE_RELEASE |" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 2: Changelog Generation
  # ============================================================
  changelog:
    name: 📝 Generate Changelog
    runs-on: ubuntu-latest
    needs: version
    if: github.event.inputs.generate_changelog == 'true' || github.event_name == 'push'
    
    outputs:
      changelog_file: ${{ steps.changelog.outputs.file }}
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 📝 Generate Changelog
        id: changelog
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi
          
          # Categorize changes
          FEATURES=$(echo "$COMMITS" | grep -iE "(feat|feature)" | head -10 || echo "No features")
          FIXES=$(echo "$COMMITS" | grep -iE "(fix|bug)" | head -10 || echo "No bug fixes")
          SECURITY=$(echo "$COMMITS" | grep -iE "(security|vuln|cve)" | head -5 || echo "No security updates")
          DOCS=$(echo "$COMMITS" | grep -iE "(doc|changelog)" | head -5 || echo "No documentation")
          
          # Create changelog file
          cat > CHANGELOG.md << EOF
          # Changelog
          
          ## [${{ needs.version.outputs.new_version }}] - $(date +%Y-%m-%d)
          
          ### ✨ Features
          $FEATURES
          
          ### 🐛 Bug Fixes
          $FIXES
          
          ### 🔒 Security Updates
          $SECURITY
          
          ### 📚 Documentation
          $DOCS
          
          ---
          
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG}...v${{ needs.version.outputs.new_version }}
          EOF
          
          echo "file=CHANGELOG.md" >> $GITHUB_OUTPUT
          
          echo "## 📝 Generated Changelog" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat CHANGELOG.md >> $GITHUB_STEP_SUMMARY
      
      - name: 📤 Upload Changelog Artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog-v${{ needs.version.outputs.new_version }}
          path: CHANGELOG.md
          retention-days: 90

  # ============================================================
  # JOB 3: Create Release
  # ============================================================
  create-release:
    name: 🏷️ Create Release
    runs-on: ubuntu-latest
    needs: [version, changelog]
    if: needs.version.outputs.is_release == 'true'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 📥 Download Changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog-v${{ needs.version.outputs.new_version }}
      
      - name: 🏷️ Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -a "v${{ needs.version.outputs.new_version }}" \
            -m "Release v${{ needs.version.outputs.new_version }}"
          
          git push origin "v${{ needs.version.outputs.new_version }}"
      
      - name: 📦 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.version.outputs.new_version }}
          name: Release v${{ needs.version.outputs.new_version }}
          body_path: CHANGELOG.md
          draft: ${{ github.event.inputs.pre_release == 'true' }}
          prerelease: ${{ github.event.inputs.pre_release == 'true' }}
          generate_release_notes: true
          files: |
            package.json
            pnpm-lock.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # JOB 4: Trigger Production Deploy (optional)
  # ============================================================
  trigger-deploy:
    name: 🚀 Trigger Deployment
    runs-on: ubuntu-latest
    needs: create-release
    if: success() && github.event.inputs.pre_release != 'true'
    
    steps:
      - name: 🚀 Trigger Production Deployment
        run: |
          echo "✅ Release v${{ needs.version.outputs.new_version }} created successfully!"
          echo ""
          echo "To deploy to production:"
          echo "1. Go to Actions → Deploy to Production"
          echo "2. Run workflow with image tag: v${{ needs.version.outputs.new_version }}"
          echo ""
          echo "Or create a deployment manually:"
          echo "\`\`\`bash"
          echo "gh workflow run deploy-production.yml \\"
          echo "  -f image_tag=v${{ needs.version.outputs.new_version }} \\"
          echo "  -f reason='Release v${{ needs.version.outputs.new_version }}'"
          echo "\`\`\`"
          
          echo "## 🚀 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Release **v${{ needs.version.outputs.new_version }}** is ready for production deployment." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Manual Deployment Options:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. **GitHub Actions UI:**" >> $GITHUB_STEP_SUMMARY
          echo "   - Navigate to **Actions → Deploy to Production**" >> $GITHUB_STEP_SUMMARY
          echo "   - Click **Run workflow**" >> $GITHUB_STEP_SUMMARY
          echo "   - Enter image tag: \`v${{ needs.version.outputs.new_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "2. **CLI Command:**" >> $GITHUB_STEP_SUMMARY
          echo '\`\`\`bash' >> $GITHUB_STEP_SUMMARY
          echo 'gh workflow run deploy-production.yml \\' >> $GITHUB_STEP_SUMMARY
          echo "  -f image_tag=v${{ needs.version.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo '\`\`\`' >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # NOTIFICATION
  # ============================================================
  notify:
    name: 📢 Release Notification
    runs-on: ubuntu-latest
    needs: [create-release, trigger-deploy]
    if: always()
    
    steps:
      - name: 💬 Slack Notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "📦 New Release: v${{ needs.version.outputs.new_version }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {"type": "plain_text", "text": "📦 Djezzy SOC Platform - New Release"}
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Version:*\nv${{ needs.version.outputs.new_version }}"},
                    {"type": "mrkdwn", "text": "*Status:*\n${{ needs.create-release.result == 'success' && '✅ Published' || '❌ Failed' }}"},
                    {"type": "mrkdwn", "text": "*Pre-release:*\n${{ github.event.inputs.pre_release || 'false' }}"},
                    {"type": "mrkdwn", "text": "*By:*\n@${{ github.actor }}"}
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {"type": "plain_text", "text": "🔗 View Release"},
                      "url": "${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.version.outputs.new_version }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_DEPLOYMENTS }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
