# Djezzy National SOC Platform - CI/CD Pipeline
#
# This workflow handles:
# 1. Code quality checks (lint, type-check)
# 2. Unit tests (Jest)
# 3. Security scanning (SAST, dependency audit)
# 4. Docker image build and push
# 5. Deployment to staging (automatic)
# 6. Deployment to production (manual approval)
#
# Triggers:
# - Push to main branch: staging deployment
# - Release tags: production deployment
# - Pull requests: build and test only

name: SOC Platform CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Nightly security scan at 2 AM UTC (4 AM Algeria time)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # JOB 1: CODE QUALITY & TESTING
  # ============================================================
  code-quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Run unit tests (Jest)
        run: npx jest --testPathPattern="src/__tests__/(auth)" --ci --coverage --no-coverage
        env:
          CI: true
          NODE_ENV: test

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Test summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Unit tests completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Coverage:** See uploaded artifact" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 2: SECURITY SCANNING
  # ============================================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: code-quality
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Dependency vulnerability scan
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for outdated packages
        run: npm outdated || true

      # SAST (Static Application Security Testing) with CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

      # Secret scanning (detect potential secrets in code)
      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

      - name: Security summary
        if: always()
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Npm audit completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ CodeQL analysis completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Secret scanning completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Review security alerts in the Security tab" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 3: DOCKER BUILD & PUSH
  # ============================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build and push Docker image
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      # Scan image for vulnerabilities with Trivy
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Build summary
        run: |
          echo "## Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ needs.build-and-push.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ needs.build-and-push.outputs.image-digest }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Vulnerability scan:** Completed (see logs for details)" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 4: DEPLOY TO STAGING
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://soc-staging.djezzy.dz
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

      - name: Deploy with Helm
        run: |
          helm upgrade --install soc-platform helm/soc-platform \
            --namespace soc-staging \
            --create-namespace \
            --set image.tag="${{ github.sha }}" \
            --set image.repository="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" \
            --set ingress.hosts[0].host=soc-staging.djezzy.dz \
            --set replicaCount=2 \
            --wait --timeout=600s

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/soc-platform -n soc-staging --timeout=300s
          kubectl get pods -n soc-staging

      - name: Health check
        run: |
          sleep 30 # Wait for pod to be ready
          curl -sf https://soc-staging.djezzy.dz/api/health | jq .

      - name: Notify Slack (success)
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "✅ *SOC Platform deployed to STAGING*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Commit:* ${{ github.sha }}\n*Deployer:* ${{ github.actor }}\n*URL:* https://soc-staging.djezzy.dz"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_STAGING }}
        continue-on-error: true

  # ============================================================
  # JOB 5: DEPLOY TO PRODUCTION (MANUAL APPROVAL)
  # ============================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://soc.djezzy.dz
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-deployment checklist
        run: |
          echo "⚠️  PRODUCTION DEPLOYMENT INITIATED"
          echo ""
          echo "Version: ${{ github.ref_name }}"
          echo "Initiated by: ${{ github.actor }}"
          echo ""
          echo "Pre-flight checks:"
          echo "  ✓ Tests passed"
          echo "  ✓ Security scan completed"
          echo "  ✓ Docker image built"
          echo ""
          echo "Proceeding with deployment..."

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config

      - name: Backup current state
        run: |
          # Create backup before deployment
          BACKUP_NAME="pre-deploy-$(date +%Y%m%d-%H%M%S)"
          velero backup create $BACKUP_NAME \
            --include-namespaces soc-production \
            --wait
          echo "Backup created: $BACKUP_NAME"

      - name: Deploy with Helm (Production)
        run: |
          helm upgrade --install soc-platform helm/soc-platform \
            --namespace soc-production \
            --create-namespace \
            --set image.tag="${{ github.ref_name }}" \
            --set image.repository="${{ env.REGISTRY }}/${{ IMAGE_NAME }}" \
            --set ingress.hosts[0].host=soc.djezzy.dz \
            --set replicaCount=3 \
            --set autoscaling.minReplicas=3 \
            --set autoscaling.maxReplicas=10 \
            --wait --timeout=600s

      - name: Verify deployment
        run: |
          echo "Waiting for rollout to complete..."
          kubectl rollout status deployment/soc-platform -n soc-production --timeout=600s
          
          echo ""
          echo "Pod status:"
          kubectl get pods -n soc-production
          
          echo ""
          echo "HPA status:"
          kubectl get hpa -n soc-production

      - name: Health checks
        run: |
          echo "Running health checks..."
          
          # Wait for load balancer to be ready
          sleep 60
          
          # Main health endpoint
          echo "1. API Health:"
          curl -sf https://soc.djezzy.dz/api/health | jq '.status, .version'
          
          # Database connectivity
          echo "2. Database Status:"
          curl -sf https://soc.djezzy.dz/api/health | jq '.components.database.status'
          
          # Redis connectivity
          echo "3. Redis Status:"
          curl -sf https://soc.djezzy.dz/api/health | jq '.components.redis.status'

      - name: Post-deployment tests
        run: |
          echo "Running smoke tests..."
          
          # Test login page loads
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://soc.djezzy.dz/login)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Login page returned $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Login page OK ($HTTP_STATUS)"
          
          # Test API is accessible
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://soc.djezzy.dz/api/health)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Health endpoint returned $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Health endpoint OK ($HTTP_STATUS)"
          
          echo ""
          echo "🎉 All smoke tests passed!"

      - name: Notify teams (Production)
        if: always()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *SOC Platform PRODUCTION deployment ${{ job.status == 'success' && 'SUCCESSFUL' || 'FAILED' }}*",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ job.status == 'success' && '🚀 Production Deploy Success' : '💥 Production Deploy Failed' }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Version:*\n${{ github.ref_name }}"},
                    {"type": "mrkdwn", "text": "*Deployer:*\n${{ github.actor }}"},
                    {"type": "mrkdwn", "text": "*Status:*\n${{ job.status }}"},
                    {"type": "mrkdwn", "text": "*URL:*\nhttps://soc.djezzy.dz"}
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_PRODUCTION }}
        continue-on-error: true

      - name: PagerDuty notification (on failure)
        if: failure()
        run: |
          curl -X POST "${{ secrets.PAGERDUTY_API_URL }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Token token=${{ secrets.PAGERDUTY_TOKEN }}" \
            -d '{
              "incident": {
                "type": "incident",
                "title": "SOC Platform Production Deployment Failed",
                "service": { "id": "${{ secrets.PAGERDUTY_SERVICE_ID }}" , "type": "service_reference" },
                "body": { "type": "incident_body", "details": "Deployment failed for ${{ github.ref_name }} by ${{ github.actor }}" },
                "urgency": "high"
              }
            }'
        continue-on-error: true

  # ============================================================
  # JOB 6: NIGHTLY SECURITY REPORT
  # ============================================================
  nightly-security-report:
    name: Nightly Security Report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate security report
        run: |
          echo "# 🔒 Djezzy SOC Platform - Nightly Security Report" > security-report.md
          echo "" >> security-report.md
          echo "**Date:** $(date '+%Y-%m-%d %H:%M:%S %Z')" >> security-report.md
          echo "" >> security-report.md
          echo "## Dependency Audit" >> security-report.md
          npm audit --json > audit-results.json 2>/dev/null || true
          cat audit-results.json | jq -r '.vulnerabilities | length' >> security-report.md
          echo " vulnerabilities found" >> security-report.md
          echo "" >> security-report.md
          echo "## Outdated Packages" >> security-report.md
          npm outdated --json >> security-report.md 2>/dev/null || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.run_number }}
          path: security-report.md
          retention-days: 90

      - name: Create issue if critical vulnerabilities found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('security-report.md', 'utf8');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔒 Security Report - Critical Vulnerabilities Found (${new Date().toISOString().split('T')[0]})`,
              body: report,
              labels: ['security', 'automated'],
              assignees: ['LAIDOUDI33']
            });
