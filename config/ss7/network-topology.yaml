# Algerian SS7 Network Topology Definition
# Djezzy National SOC Platform
#
# This configuration defines the SS7 signaling network topology
# for Djezzy Algeria, including point code allocation, node definitions,
# and interconnection points.
#
# Version: 1.0.0
# Classification: CONFIDENTIAL - Network Architecture

# =============================================================================
# NETWORK OVERVIEW
# =============================================================================
network:
  operator: "Djezzy Algeria"
  operator_code: "DZ-DJEZZY"
  country: "Algeria"
  country_code: "+213"
  itu_region: "Europe (Region 1)"
  
  # ITU-T Signaling Area Code for Algeria
  signaling_area_code: 213
  
  # Network identification
  network_id:
    mcc: "603"      # Mobile Country Code (Algeria)
    mncs:           # Mobile Network Codes
      djezzy: "01"
      mobilis: "02" 
      ooredoo: "03"

# =============================================================================
# POINT CODE CONFIGURATION
# =============================================================================
point_codes:
  format: "ITU-T"     # 14-bit standard (ITU-T Q.704)
  encoding: "BCD"     # Binary Coded Decimal representation
  
  # Point code structure for Djezzy network
  # Using ITU-T 14-bit format: SLS (2 bits) + Zone (4 bits) + Cluster (8 bits)
  structure:
    bits: 14
    range_min: 0
    range_max: 16383
    
  # Reserved ranges within Djezzy network
  ranges:
    # Signaling Transfer Points (STP)
    stp_primary:
      start: 1
      end: 5
      description: "Primary STP infrastructure"
      
    stp_secondary:
      start: 6
      end: 10
      description: "Secondary/backup STP infrastructure"
    
    # Home Location Registers (HLR)
    hlr_pool:
      start: 20
      end: 50
      description: "HLR pool for subscriber data"
      notes: "HLR 20-35 primary, 36-50 backup/mirror"
    
    # Mobile Switching Centers (MSC)
    msc_pool:
      start: 51
      end: 150
      description: "MSC/VLR combined nodes by region"
      regional_allocation:
        north: [51, 80]       # Algiers, Blida, Tizi Ouzou
        west: [81, 100]       # Oran, Tlemcen, Sidi Bel Abbes
        east: [101, 120]      # Constantine, Annaba, Skikda
        south: [121, 140]     # Ouargla, Tamanrasset, Bechar
        central: [141, 150]   # M'Sila, Djelfa, Medea
    
    # Visitor Location Registers (standalone VLR)
    vlr_pool:
      start: 151
      end: 200
      description: "Standalone VLR nodes"
      
    # GPRS Support Nodes
    sgsn_pool:
      start: 201
      end: 220
      description: "Serving GPRS Support Nodes"
      
    ggsn_pool:
      start: 221
      end: 230
      description: "Gateway GPRS Support Nodes"
    
    # Intelligent Network / Service Control Points
    scp_pool:
      start: 240
      end: 255
      description: "Service Control Points (IN platform)"
      
    # SMS Centers
    smsc_pool:
      start: 256
      end: 270
      description: "SMS Service Centers"
      
    # International Gateway MSCs
    igmsc_pool:
      start: 280
      end: 290
      description: "International Gateway MSCs"
      
    # Border STPs (for international connectivity)
    border_stp:
      start: 295
      end: 300
      description: "Border STPs for international links"

# =============================================================================
# GLOBAL TITLE CONFIGURATION
# =============================================================================
global_titles:
  # GT format used in SCCP routing
  format: "E.214"          # E.212 encoded in GTT (Global Title Translation)
  
  translation_type: 0      # TT value for mobile networks
  
  numbering_plan:
    name: "E.212 (IMSI)"
    value: 1               # NP = 1 for E.212 IMSI
    
  nature_of_address:
    name: "Subscriber Number"
    value: 4               # NoA = 4 for international subscriber
  
  # GT address structures
  address_structure:
    imsi_gt:
      encoding: "BCD"
      length: 8            # Max 15 digits in BCD
      example: "603010123456789"
      
    msisdn_gt:
      encoding: "BCD"
      variable_length: true
      max_length: 15
      example: "213550123456"
      
    gt_prefixes:
      hlr: "60301"         # MCC+MNC for HLR lookup
      msc: "2136"          # MSISDN-based MSC routing
      vlr: "2137"          # VLR-specific prefix
      smsc: "2136004"      # SMSC GT prefix

# =============================================================================
# NETWORK NODES DEFINITION
# =============================================================================
nodes:

  # ===========================================================================
  # SIGNALLING TRANSFER POINTS (STP)
  # ===========================================================================
  stp_1:
    name: "STP-Algiers-Primary"
    point_code: 1
    location: "Algiers (16)"
    coordinates:
      lat: 36.7538
      lng: 3.0588
    type: "STP"
    vendor: "Huawei"
    model: "SE9200"
    status: "active"
    redundancy_pair: "stp_2"
    links:
      - node: "stp_2"
        type: "quadruplex"
        capacity: "10Gbps"
      - node: "msc_algiers"
        type: "duplex"
        capacity: "2.5Gbps"
      - node: "hlr_main"
        type: "duplex"
        capacity: "2.5Gbps"
      - node: "border_stp_mediterranean"
        type: "duplex"
        capacity: "10Gbps"
    capabilities:
      - "M3UA gateway"
      - "SIGTRAN termination"
      - "SCCP global title translation"
      - "TCAP relay"
    monitoring:
      snmp_enabled: true
      netflow_export: true

  stp_2:
    name: "STP-Algiers-Secondary"
    point_code: 2
    location: "Algiers (16) - DR Site"
    type: "STP"
    vendor: "Huawei"
    model: "SE9200"
    status: "standby"
    redundancy_pair: "stp_1"
    links:
      - node: "stp_1"
        type: "quadruplex"
        
  stp_oran:
    name: "STP-Oran-West"
    point_code: 7
    location: "Oran (31)"
    coordinates:
      lat: 35.6911
      lng: -0.6417
    type: "STP"
    vendor: "Huawei"
    model: "SE9200"
    status: "active"
    links:
      - node: "stp_1"
        type: "duplex"
        capacity: "10Gbps"
      - node: "msc_oran"
        type: "duplex"
        capacity: "2.5Gbps"
        
  stp_constantine:
    name: "STP-Constantine-East"
    point_code: 8
    location: "Constantine (23)"
    coordinates:
      lat: 36.3650
      lng: 6.6147
    type: "STP"
    vendor: "Huawei"
    model: "SE9200"
    status: "active"
    links:
      - node: "stp_1"
        type: "duplex"
        capacity: "10Gbps"
      - node: "msc_constantine"
        type: "duplex"
        capacity: "2.5Gbps"

  # ===========================================================================
  # HOME LOCATION REGISTERS (HLR)
  # ===========================================================================
  hlr_main:
    name: "HLR-Algiers-Main"
    point_code: 20
    location: "Algiers Data Center 1"
    type: "HLR/HSS"
    vendor: "Ericsson"
    model: "Dual Home Location Register"
    status: "active"
    subscriber_capacity: 15000000
    current_subscribers: 16500000
    backup_node: "hlr_backup"
    links:
      - node: "stp_1"
        type: "quad"
        priority: "primary"
      - node: "stp_2"
        type: "quad"
        priority: "secondary"
    capabilities:
