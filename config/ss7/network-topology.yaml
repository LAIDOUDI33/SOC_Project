      - "MAPv3"
      - "CAMEL phase 3"
      - "LCS (Location Services)"
      - "IMS integration"
    database:
      replication: "real-time"
      geo_redundancy: true
      dr_site: "hlr_backup"

  hlr_backup:
    name: "HLR-Algiers-Backup"
    point_code: 36
    location: "Algiers Data Center 2 (DR)"
    type: "HLR/HSS"
    vendor: "Ericsson"
    model: "Dual Home Location Register"
    status: "hot_standby"
    sync_source: "hlr_main"
