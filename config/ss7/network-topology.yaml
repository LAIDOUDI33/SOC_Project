# =============================================================================
# ROUTING CONFIGURATION
# =============================================================================
routing:
  # SCCP Global Title Translation rules
  gtt_rules:
    # Rule: Route to HLR based on IMSI GT
    - name: "imsi-to-hlr"
      match:
        tt: 0
        np: 1
        nature: "international"
        pattern: "^60301"  # Djezzy IMSI prefix
      action:
        translate_to: "hlr_main"
        pc_dpc: 20
        
    # Rule: Route to SMSC for SMS delivery
    - name: "sms-delivery"
      match:
        operation: ["mo-forwardSM", "mt-forwardSM"]
      action:
        translate_to: "smsc_djezzy"
        pc_dpc: 256
        
    # Rule: Route to SCP for IN services
    - name: "camel-services"
      match:
        operation: ["initialDP", "applyCharging", "connect"]
        ssn: [6, 8, 9, 10]  # CAP SSCNs
      action:
        translate_to: "scp_main"
        pc_dpc: 240

  # MTP3 Routing (Point Code based)
  mtp3_routes:
    # Default route via primary STP
    - destination: "default"
      next_hop: "stp_1"
      priority: 100
      
    # Direct routes for high-volume pairs
    - destination: "hlr_*"
      next_hop: "stp_1"
      load_balance: true
      
    # Regional routes
    - destination: "msc_west_*"
      next_hop: "stp_oran"
      
    - destination: "msc_east_*"
      next_hop: "stp_constantine"

# =============================================================================
# SECURITY ZONES
# =============================================================================
security_zones:
  trusted_internal:
    description: "Core network elements"
    nodes:
      - "hlr_*"
      - "msc_*"
      - "vlr_*"
      - "stp_*"
      - "scp_*"
      - "smsc_*"
    access_policy: "full_trust"
    monitoring: "comprehensive"
    
  dmz_services:
    description: "External-facing service nodes"
    nodes:
      - "igmsc_*"
      - "border_stp_*"
    access_policy: "restricted"
    monitoring: "intensive"
    firewall_rules:
      - "block_unknown_pc"
      - "validate_all_gt"
      - "rate_limit_per_source"
      
  partner_interconnect:
    description: "Operator interconnection points"
    nodes:
      - "border_stp_*"
    access_policy: "strict_validation"
    allowed_protocols:
      - "ISUP"
      - "MAP (subset)"
      - "CAP (subset)"

# =============================================================================
# MONITORING ENDPOINTS
# =============================================================================
monitoring:
  collection_points:
    - node: "stp_1"
      type: "passive_tap"
      protocols: ["M3UA", "SCTP", "SCCP", "TCAP", "MAP", "CAP", "ISUP"]
      export_format: ["IPFIX", "PCAP"]
      soc_integration: true
      
    - node: "border_stp_mediterranean"
      type: "full_capture"
      retention_days: 90
      alert_on_anomaly: true
      
  metrics_collection:
    interval_seconds: 30
    metrics:
      - "message_count_by_protocol"
      - "message_count_by_operation"
      - "message_count_by_destination"
      - "latency_percentiles"
      - "error_rates"
      - "link_utilization"
