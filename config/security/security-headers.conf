# Djezzy National SOC Platform - Security Headers Configuration
# NGINX / Kong API Gateway Security Headers
# Compliance: ANRT-SEC-012, NIST SC-8, OWASP Secure Headers
# Version: 1.0.0
# Last Updated: 2024-01-15

# ============================================
# CORE SECURITY HEADERS (All Endpoints)
# ============================================

# HTTP Strict Transport Security (HSTS)
# Forces HTTPS connections - ANRT requires TLS 1.3
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# X-Content-Type-Options
# Prevents MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# X-Frame-Options
# Prevents clickjacking attacks
add_header X-Frame-Options "DENY" always;

# X-XSS-Protection (Legacy browser support)
# Enables XSS filter in older browsers
add_header X-XSS-Protection "1; mode=block" always;

# Referrer-Policy
# Controls referrer information leakage
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Clear-Site-Data (on logout only)
# Uncomment in location block for logout endpoint
# add_header Clear-Site-Data "cache, cookies, storage, executionContexts" always;

# Permissions Policy (formerly Feature-Policy)
# Restricts browser features/APIs
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=self, magnetometer=(), microphone=(), payment=(), usb=(), screen-wake-lock=self, interest-cohort=()" always;

# Cross-Origin Policies (COOP/COEP/Corp)
# For isolation and Spectre mitigation
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Origin-Agent-Cluster "?1" always;

# Content Security Policy (CSP)
# Defined per environment below
include /etc/nginx/security/csp.conf;

# Cache-Control for sensitive responses
# Prevent caching of authenticated content
add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
add_header Pragma "no-cache" always;
add_header Expires "0" always;

# ============================================
# CONTENT SECURITY POLICY CONFIGURATION
# ============================================
# File: /etc/nginx/security/csp.conf

# Production CSP
set $csp_default "default-src 'none'; script-src 'self' 'strict-dynamic' 'nonce-$csp_nonce' https://cdn.djezzy.dz https://static.djezzy.dz; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.djezzy.dz; img-src 'self' data: https: blob:; font-src 'self' https://fonts.gstatic.com https://cdn.djezzy.dz; connect-src 'self' wss://api.djezzy.dz wss://ws.djezzy.dz https://api.djezzy.dz; media-src 'self' https://media.djezzy.dz; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests; report-uri https://csp-report.djezzy.dz/api/v1/reports/csp";

add_header Content-Security-Policy "$csp_default" always;
add_header Content-Security-Policy-Report-Only "" always;  # Disabled in production

# ============================================
# CORS CONFIGURATION
# ============================================

# CORS preflight handling
if ($request_method = 'OPTIONS') {
    add_header Access-Control-Allow-Origin "$http_origin" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Accept, Accept-Language, Content-Type, Authorization, X-CSRF-Token, X-API-Key, X-Request-ID, X-Correlation-ID" always;
    add_header Access-Control-Max-Age 7200 always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Vary "Origin" always;
    
    # Custom security headers for OPTIONS too
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    
    return 204;
}

# CORS headers for actual requests (origin validation required)
# Origin whitelist is checked via map directive or Lua module
map $http_origin $cors_origin {
    default "";
    "~^https://soc\.djezzy\.dz$" "$http_origin";
    "~^https://admin\.djezzy\.dz$" "$http_origin";
    "~^https://portal\.djezzy\.dz$" "$http_origin";
    "~^https://siem\.djezzy\.dz$" "$http_origin";
    "~^https://ti\.djezzy\.dz$" "$http_origin";
    "~^https://api\.djezzy\.dz$" "$http_origin";
    "~^http://localhost:300[0-9]$" "$http_origin";  # Development only
}

add_header Access-Control-Allow-Origin "$cors_origin" always;
add_header Access-Control-Allow-Credentials "true" always;
add_header Access-Control-Expose-Headers "X-Request-ID, X-RateLimit-Remaining, X-RateLimit-Reset, X-Page-Count, X-Total-Count, Location" always;
add_header Vary "Origin" always;

# ============================================
# RATE LIMITING HEADERS
# ============================================

# Rate limit headers are set by limit_req_zone/limit_conn_zone
# These inform clients of their current rate limit status
add_header X-RateLimit-Limit "$rate_limit_limit" always;
add_header X-RateLimit-Remaining "$rate_limit_remaining" always;
add_header X-RateLimit-Reset "$rate_limit_reset" always;

# ============================================
# REQUEST ID FOR TRACEABILITY
# ============================================

# Unique request ID for audit trail correlation
request_id_hash "$remote_addr$http_x_forwarded_for$request_id";

add_header X-Request-Id "$request_id" always;
add_header X-Correlation-Id "$http_x_correlation_id" always;

# ============================================
# SECURITY RESPONSE HEADERS
# ============================================

# Remove server version disclosure
server_tokens off;

# Custom server header (minimal info)
more_set_headers "Server: DjezzySOC";

# Remove powered-by header
more_clear_headers "X-Powered-By";
more_clear_headers "X-AspNet-Version";
more_clear_headers "X-AspNetMvc-Version";

# ============================================
# LOCATION-SPECIFIC OVERRIDES
# ============================================

# API endpoints - Additional security
location /api/ {
    # API-specific CSP (stricter)
    add_header Content-Security-Policy "default-src 'none'; connect-src 'self'; frame-ancestors 'none'" always;
    
    # Request size limits
    client_max_body_size 10m;
    
    # Timeout settings
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
    
    # Buffer overflow protection
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
}

# Authentication endpoints - Extra strict
location /api/v1/auth/ {
    # Stricter rate limiting
    limit_req zone=auth_limit burst=3 nodelay;
    
    # No caching of auth responses
    add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    
    # HSTS with longer max-age for auth
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
}

# Admin endpoints - Highest security
location /api/v1/admin/ {
    # Require additional admin headers
    if ($http_x_admin_action = "") {
        return 403;
    }
    
    # Stricter CSP
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    
    # Reduced timeouts
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

# Static assets - Optimized for caching
location /static/ {
    # Permissive CSP for static assets
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'" always;
    
    # Long cache times for hashed assets
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    
    # Allow cross-origin for fonts
    add_header Access-Control-Allow-Origin "*" always;
}

# Webhook receivers - Special handling
location /api/v1/webhooks/ {
    # IP whitelist enforcement
    allow 203.0.113.50/32;   # Partner IP
    allow 198.51.100.23/32;  # Another partner
    deny all;
    
    # Larger payload allowance
    client_max_body_size 50m;
    
    # Signature verification header required
    if ($http_x_signature_256 = "") {
        return 401;
    }
}

# Health check endpoints - Minimal processing
location /health {
    access_log off;
    add_header Content-Type "application/json" always;
    return 200 '{"status":"healthy","timestamp":"$time_iso8601"}';
}

# ============================================
# ERROR PAGES (No Information Disclosure)
# ============================================

error_page 400 /error/400.html;
error_page 401 /error/401.html;
error_page 403 /error/403.html;
error_page 404 /error/404.html;
error_page 405 /error/405.html;
error_page 408 /error/408.html;
error_page 413 /error/413.html;
error_page 429 /error/429.html;
error_page 500 /error/500.html;
error_page 502 /error/502.html;
error_page 503 /error/503.html;
error_page 504 /error/504.html;

location /error/ {
    internal;
    
    # Apply security headers to error pages too
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Request-Id "$request_id" always;
    
    alias /usr/share/nginx/html/error/;
}

# ============================================
# SSL/TLS CONFIGURATION (ANRT: TLS 1.3 Required)
# ============================================

# TLS 1.3 only (with fallback to 1.2 for legacy clients during transition)
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;

# Strong cipher suites (TLS 1.2) - TLS 1.3 handles ciphers automatically
ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK:!SRP:!CAMELLIA;

# OCSP Stapling for certificate transparency
ssl_stapling on;
ssl_stapling_verify on;
ssl_trusted_certificate /etc/nginx/ssl/chain.pem;

# SSL session caching
ssl_session_cache shared:SSL:50m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Certificate configuration
ssl_certificate /etc/nginx/ssl/fullchain.pem;
ssl_certificate_key /etc/nginx/ssl/private.key;

# DH parameters (for DHE cipher suites)
ssl_dhparam /etc/nginx/ssl/dhparams.pem;

# ============================================
# BOT PROTECTION
# ============================================

# Block bad user agents
if ($http_user_agent ~* (sqlmap|nikto|nmap|dirbuster|gobuster|wfuzz|hydra|masscan|acunetix|nessus)) {
    return 403;
}

# Block empty user agents on API endpoints
location ~ ^/api/ {
    if ($http_user_agent = "") {
        return 403;
    }
}

# ============================================
# DDoS PROTECTION SETTINGS
# ============================================

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
limit_conn conn_limit_per_ip 20;

# Request rate limiting zones
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=search_limit:10m rate=5r/m;

# Apply general rate limiting
limit_req zone=general_limit burst=20 nodelay;

# Return 429 with JSON body when rate limited
limit_req_status 429;
limit_conn_status 429;

# Body timeout (prevent slow loris)
client_body_timeout 30s;
client_header_timeout 10s;

# Keep-alive settings
keepalive_timeout 65s;
keepalive_requests 1000;

# Ignore certain headers (prevent header-based attacks
ignore_invalid_headers on;

# Maximum URI length
large_client_header_buffers 4 8k;

# ============================================
# LOGGING WITH SECURITY CONTEXT
# ============================================

# Security log format (JSON for SIEM integration)
log_format security_json escape=json 
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"server_protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"request_id":"$request_id",'
        '"ssl_protocol":"$ssl_protocol",'
        '"ssl_cipher":"$ssl_cipher"'
    '}';

# Access log with security context
access_log /var/log/nginx/security_access.log security_json;

# Error log
error_log /var/log/nginx/error.log warn;

# Don't log health checks
location = /health {
    access_log off;
}
