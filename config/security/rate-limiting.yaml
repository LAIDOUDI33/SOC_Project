# Djezzy National SOC Platform - Rate Limiting Configuration
# ANRT Compliant - Protection against DoS/Brute Force Attacks
# Distributed rate limiting with Redis backend

# Global Configuration
global:
  enabled: true
  store:
    type: redis
    connection:
      host: redis-security.djezzy-soc.svc.cluster.local
      port: 6379
      password: ${REDIS_PASSWORD}
      db: 0
      tls: true
      tlsVersion: "1.3"
    prefix: "ratelimit:soc:"
    expirationStrategy: sliding_window
  
  # Default limits applied when no specific rule matches
  defaults:
    requestsPerSecond: 10
    burstSize: 20
    windowSize: 1m
    
  # Response when limit exceeded
  response:
    statusCode: 429
    body: |
      {
        "error": "Rate limit exceeded",
        "code": "RATE_LIMITED",
        "message": "Too many requests. Please slow down.",
        "retryAfter": "{{ .RetryAfter }}",
        "documentation": "https://security.djezzy.dz/rate-limits"
      }
    headers:
      X-RateLimit-Limit: "{{ .Limit }}"
      X-RateLimit-Remaining: "{{ .Remaining }}"
      X-RateLimit-Reset: "{{ .Reset }}"
      Retry-After: "{{ .RetryAfter }}"
  
  # IP-based reputation scoring
  ipReputation:
    enabled: true
    provider: internal
    scoreDecayHours: 24
    thresholds:
      trusted: 80
      normal: 50
      suspicious: 20
      blocked: 0

# Endpoint-specific Rate Limits
# Organized by functional area and sensitivity level

authentication:
  # Login endpoints - Most sensitive, strictest limits
  login:
    path: /api/auth/login
    methods: [POST]
    limits:
      type: sliding_window
      window: 15m
      maxAttempts: 5
      # Progressive backoff
      backoff:
        enabled: true
        strategy: exponential
        baseDelay: 30s
        maxDelay: 1h
        multiplier: 2
    actions:
      onLimit:
        type: challenge
        provider: captcha
      onAbuse:
        type: block
        duration: 1h
        notify: [soc_team]
    
  sso_callback:
    path: /api/auth/sso/callback
    methods: [GET, POST]
    limits:
      type: fixed_window
      window: 5m
      maxAttempts: 10
      
  mfa_verify:
    path: /api/auth/mfa/verify
    methods: [POST]
    limits:
      type: fixed_window
      window: 5m
      maxAttempts: 5
      # MFA brute force is extremely dangerous
      onExhausted:
        action: lock_account
        lockDuration: 30m
        
  password_reset:
    path: /api/auth/password/reset
    methods: [POST]
    limits:
      type: fixed_window
      window: 1h
      maxAttempts: 3
      # Prevent email bombing
      perEmailLimit: 1

  token_refresh:
    path: /api/auth/token/refresh
    methods: [POST]
    limits:
      type: sliding_window
      window: 1h
      maxAttempts: 100

# SIEM & Data Access Endpoints
siem:
  search:
    path: /api/siem/search
    methods: [POST, GET]
    limits:
      type: sliding_window
      window: 1m
      # Different limits based on user role
      roleBasedLimits:
        analyst:
          rps: 10
          burst: 20
        engineer:
          rps: 30
          burst: 50
        admin:
          rps: 50
          burst: 100
    # Query complexity limiting
    queryLimits:
      maxTimeRangeDays: 90
      maxResults: 10000
      timeoutSeconds: 60
      
  export:
    path: /api/siem/export
    methods: [POST]
    limits:
      type: fixed_window
      window: 1h
      maxAttempts: 5
      # Large exports are resource-intensive
      sizeLimits:
        maxSizeMB: 500
        maxRecords: 1000000
    approvalRequired: true
    approvalWorkflow: export_approval
    
  real_time_stream:
    path: /api/siem/stream
    methods: [GET]
    limits:
      type: concurrent_connections
      maxConnections: 5
      perUser: true
    websocketConfig:
      heartbeatInterval: 30s
      maxMessageSize: 1MB
      messagesPerSecond: 100

# Alert Management
alerts:
  list:
    path: /api/alerts
    methods: [GET]
    limits:
      type: sliding_window
      window: 1m
      rps: 30
      burst: 60
      
  update:
    path: /api/alerts/{id}
    methods: [PATCH, PUT]
    limits:
      type: fixed_window
      window: 1m
      maxAttempts: 60
      
  bulk_actions:
    path: /api/alerts/bulk
    methods: [POST]
    limits:
      type: fixed_window
      window: 1h
      maxAttempts: 10
      maxBatchSize: 100

# Incident Management
incidents:
  create:
    path: /api/incidents
    methods: [POST]
    limits:
      type: fixed_window
      window: 1h
      maxAttempts: 50
      
  update:
    path: /api/incidents/{id}
    methods: [PATCH, PUT]
    limits:
      type: sliding_window
      window: 1m
      maxAttempts: 30
      
  add_artifact:
    path: /api/incidents/{id}/artifacts
    methods: [POST]
    limits:
      type: fixed_window
      window: 1h
      maxAttempts: 100
      fileSizeLimit: 50MB
      totalStorageLimit: 1GB

# Threat Intelligence
threat_intel:
  query_ioc:
    path: /api/threat-intel/ioc/query
    methods: [POST]
    limits:
      type: sliding_window
      window: 1m
      rps: 20
      burst: 40
      
  import_feed:
    path: /api/threat-intel/feeds/import
    methods: [POST]
    limits:
      type: fixed_window
      window: 1h
      maxAttempts: 6  # Every 10 minutes max
      fileSizeLimit: 100MB

# Reporting
reports:
  generate:
    path: /api/reports/generate
    methods: [POST]
    limits:
      type: fixed_window
      window: 1h
      maxAttempts: 10
      queueProcessing: true
      maxConcurrentGenerations: 3
      
  scheduled_reports:
    path: /api/reports/scheduled
    methods: [POST]
    limits:
      type: fixed_window
      window: 24h
      maxAttempts: 10
      perUserLimit: 5

# Admin Endpoints (Most Restricted)
admin:
  user_management:
    path: /api/admin/users/*
    methods: [POST, PUT, DELETE, PATCH]
    limits:
      type: fixed_window
      window: 1h
      maxAttempts: 100
      requireMFA: true
      auditLog: true
      
  role_management:
    path: /api/admin/roles/*
    methods: [POST, PUT, DELETE, PATCH]
    limits:
      type: fixed_window
      window: 24h
      maxAttempts: 20
      requireApproval: true
      auditLog: true
      
  system_config:
    path: /api/admin/config/*
    methods: [PUT, PATCH, DELETE]
    limits:
      type: fixed_window
      window: 24h
      maxAttempts: 10
      requireApproval: true
      requireMFA: true
      auditLog: true

# API Gateway Level Limits
gateway:
  # Global IP-based limits
  ipLimits:
    unauthenticated:
      rps: 5
      burst: 10
      dailyLimit: 10000
      
    authenticated_standard:
      rps: 30
      burst: 60
      dailyLimit: 100000
      
    authenticated_premium:
      rps: 100
      burst: 200
      dailyLimit: 500000
      
    service_account:
      rps: 500
      burst: 1000
      dailyLimit: 10000000

  # Geographic limits (ANRT compliance)
  geoLimits:
    algeria:
      multiplier: 1.0  # Full capacity
    other_africa:
      multiplier: 0.5  # Reduced capacity
    rest_of_world:
      multiplier: 0.1  # Minimal access (partners only)
      
  # Time-based adjustments
  timeBasedAdjustments:
    business_hours:
      start: "08:00"
      end: "18:00"
      timezone: "Africa/Algiers"
      multiplier: 1.0
    off_hours:
      multiplier: 1.5  # More lenient during off-hours
    weekend:
      multiplier: 2.0

# Special Event Handling
special_events:
  # DDoS mitigation mode
  ddos_mode:
    triggerConditions:
      globalRpsThreshold: 10000
      errorRateThreshold: 0.1  # 10%
      uniqueIpsThreshold: 1000
    actions:
      enableChallenge: true
      reduceLimitsBy: 0.9  # Reduce to 10%
      enableGeoBlocking: true
      allowedCountries: ["DZ"]
      notifyChannels: [soc_on_call, infrastructure_team]
    autoEnable: true
    autoRecovery:
      checkInterval: 5m
      stablePeriod: 30m
      
  # Security incident response mode
  incident_response:
    trigger: manual  # Can be triggered manually during active incidents
    actions:
      readOnlyMode: false
      enforceMFA: true
      sessionTimeoutReduction: 5m
      increaseLogging: verbose
      blockNewRegistrations: true

# Monitoring and Alerts
monitoring:
  metrics:
    enabled: true
    prefix: "rate_limiter_"
    metrics:
      - name: requests_total
        type: counter
        labels: [endpoint, method, status, limited]
      - name: current_limit
        type: gauge
        labels: [endpoint, user_type]
      - name: limit_exceeded_total
        type: counter
        labels: [endpoint, reason, ip_range]
        
  alerts:
    - name: high_rate_limit_breaches
      condition: rate_limit_exceeded > 100/min
      severity: warning
      channels: [slack_soc]
      
    - name: sustained_high_traffic
      condition: avg(rps) > threshold * 0.8 for 10min
      severity: info
      channels: [dashboard]
      
    - name: possible_ddos
      condition: unique_ips > 10000 AND error_rate > 20%
      severity: critical
      channels: [pagerduty_soc, slack_incident, email_cto]
      autoMitigation: true

# Compliance Requirements (ANRT)
compliance:
  anrt:
    logRetentionYears: 5
    logFields:
      - timestamp
      - source_ip (masked)
      - user_id
      - endpoint
      - method
      - status_code
      - rate_limit_applied
      - action_taken
    dataLocalization: true  # All rate limit data stays in Algeria
    encryption:
      atRest: AES-256-GCM
      inTransit: TLS-1.3
    auditTrail: true
    tamperProof: true  # Write-once logs
