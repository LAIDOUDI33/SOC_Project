# ============================================================
# Djezzy SOC Platform - PostgreSQL 16 Performance Tuning
# ============================================================
# Target: 500K+ EPS ingestion, <200ms P95 query response
# Scale: 10K concurrent connections, 100TB+ data
# 
# @version 2.0.0
# Hardware: 64GB RAM, 32 CPU cores, NVMe SSD storage
# ============================================================

# ----------------------
# CONNECTION SETTINGS
# ----------------------

# Maximum concurrent connections
# Formula: (core_count * 2) + effective_cache_size_GB
# For 32 cores: ~500 connections (use PgBouncer for more)
max_connections = 500

# Superuser reserved connections for maintenance operations
superuser_reserved_connections = 5

# Connection authentication timeout
authentication_timeout = 60s

# TCP keepalive settings (detect dead connections)
tcp_keepalives_idle = 600       # 10 minutes before first keepalive
tcp_keepalives_interval = 30    # 30 seconds between keepalives
tcp_keepalives_count = 10        # Max missed keepalives

# Listen address
listen_addresses = '*'
port = 5432

# Password encryption
password_encryption = scram-sha-256


# ----------------------
# MEMORY SETTINGS (64GB RAM Server)
# ----------------------

# Shared memory for caching (~25% of RAM)
# Critical for read performance - increase for read-heavy workloads
shared_buffers = 16GB

# Effective cache size (~75% of RAM)
# Tells planner how much memory is available for caching
effective_cache_size = 48GB

# Memory per operation for sorting, hashing, etc.
# Higher = faster complex queries but more memory per connection
work_mem = 256MB

# Memory for maintenance operations (VACUUM, CREATE INDEX, etc.)
maintenance_work_mem = 2GB

# Huge pages support (improves TLB efficiency significantly)
huge_pages = try

# Logical decoding memory
wal_sender_buffer = 16MB


# ----------------------
# WAL (Write-Ahead Log) SETTINGS
# For high-write throughput (500K+ EPS)
# ----------------------

# WAL level for replication and PITR
wal_level = replica

# WAL segment size (default 16MB, larger = less segments)
#wal_segment_size = 256MB         # Uncomment for very high write workloads

# Number of WAL segments to keep pre-allocated
min_wal_size = 2GB
max_wal_size = 8GB

# WAL buffers (typically one WAL segment)
wal_buffers = 64MB

# Checkpoint settings - less frequent = better throughput
checkpoint_completion_target = 0.9    # Complete checkpoints in 90% of interval
checkpoint_timeout = 15min             # Time between checkpoints
checkpoint_flush_after = 256KB         # Flush after this amount written
checkpoint_wait_timeout = 300s         # Wait timeout for checkpoint
max_wal_senders = 10                   # Max concurrent streaming replications

# WAL compression (reduces I/O)
wal_compression = zstd                 # zstd offers best compression ratio
wal_compression_level = 3              # 1-19, higher = more compression

# Commit settings for throughput optimization
commit_delay = 100                     # Microseconds to group commits (0 = disable)
commit_siblings = 5                    # Min concurrent transactions for delay

# Synchronous commit mode
# Options: off, local, remote_write, remote_apply, on
# 'off' for maximum throughput (risk of data loss on crash)
# 'local' for single-node durability
# 'on' or 'remote_apply' for full durability
synchronous_commit = on


# ----------------------
# QUERY PLANNER OPTIMIZATIONS
# ----------------------

# Parallel query processing (utilize multi-core CPUs)
max_parallel_workers_per_gather = 4     # Parallel workers per query
max_parallel_workers = 32               # Total parallel workers
max_parallel_maintenance_workers = 4    # For parallel index builds

# Cost-based optimizer parameters
# Tuned for SSD storage (lower random_page_cost)
random_page_cost = 1.1                  # SSD: close to sequential cost
seq_page_cost = 1.0
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005            # Favor indexes
cpu_operator_cost = 0.0025
parallel_tuple_cost = 0.001              # Make parallel plans cheaper
parallel_setup_cost = 100.0

# Join strategies
join_collapse_limit = 12                # Collapse subqueries up to this size
from_collapse_limit = 8                 # Collapse FROM list
geqo_threshold = 12                     # Use genetic query optimizer for large joins
geqo_effort = 150                       # GEQO effort (1-100)
geqo_pool_size = 500                    # GEQO population size
geqo_generations = 250                   # GEQO generations

# Statistics quality (higher = better plans but slower ANALYZE)
default_statistics_target = 200

# JIT compilation (enable for complex queries)
jit = above_threshold
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000
jit_exceed_cost_above_cost = 1000000


# ----------------------
# AUTOVACUUM TUNING (Critical for high-write workloads)
# ----------------------

# Enable autovacuum
autovacuum = on

# Worker processes
autovacuum_max_workers = 6              # Run multiple vacuums in parallel
autovacuum_naptime = 30s                # Check for work every 30 seconds

# Trigger vacuum more aggressively for high-insert tables
autovacuum_vacuum_scale_factor = 0.05   # Vacuum when 5% of table changes
autovacuum_analyze_scale_factor = 0.02   # Analyze when 2% changes
autovacuum_vacuum_insert_threshold = 50000  # For insert-heavy tables

# Cost-based vacuum throttling
autovacuum_vacuum_cost_limit = 2000      # Allow more work before sleeping
autovacuum_vacuum_cost_delay = 2ms      # Sleep only 2ms between cost cycles

# Anti-wraparound protection (CRITICAL - prevents downtime)
autovacuum_freeze_max_age = 1500000000   # ~48 days max age
autovacuum_multixact_freeze_max_age = 1600000000
autovacuum_vacuum_freeze_min_age = 150000000
autovacuum_multixact_freeze_min_age = 160000000


# ----------------------
# REPLICATION SETTINGS
# ----------------------

# Streaming replication configuration
wal_keep_size = 4GB                    # Keep 4GB of WAL for replicas
hot_standby = on                        # Allow queries on standby
hot_standby_feedback = on               # Standby tells primary its status
wal_receiver_status_interval = 10s      # Standby status updates
wal_receiver_timeout = 60s              # Standby receive timeout
max_replication_slots = 10              # Physical + logical slots
max_wal_senders = 10                   # Max concurrent streaming replications

# Logical replication (for CDC to Elasticsearch/Kafka)
max_logical_replication_workers = 8
max_sync_workers_per_subscription = 4
max_slot_wal_keep_size = 2GB            # Keep WAL for logical slots


# ----------------------
# LOGGING & MONITORING
# ----------------------

# Slow query logging (>200ms is concerning for SOC dashboard)
log_min_duration_statement = 200        # Log queries >200ms
log_min_error_statement = error          # Log statements that cause errors

# Log format with useful context
log_line_prefix = '%t [%p]: [%l-1] db=%d,user=%u,app=%a,client=%h '
log_timezone = 'Africa/Algiers'

# Connection logging
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on                     # Detect lock contention
log_temp_files = 0                      # Log all temp file creation
log_autovacuum_min_duration = 0         # Log all autovacuum activity

# Statistics collection
track_activities = on
track_counts = on
track_io_timing = on                    # Track physical read/write times
track_functions = all
track_activity_query_size = 2048        # Track full query text

# pg_stat_statements extension
pg_stat_statements.max = 10000           # Track top 10000 queries
pg_stat_statements.track = top          # Track by total time


# ----------------------
# PARTITIONING CONFIGURATION
# ----------------------

# Enable partitioning features
enable_partition_pruning = on           # Skip irrelevant partitions
enable_partitionwise_join = on          # Parallel joins across partitions
enable_partitionwise_aggregate = on     # Parallel aggregates across partitions


# ============================================================
# PgBOUNCER CONNECTION POOLER CONFIGURATION
# ============================================================
# Place in: /etc/pgbouncer/pgbouncer.ini
# Purpose: Efficiently manage thousands of client connections

[databases]
# SOC Platform database
soc_platform = host=postgres-primary.djezzy-soc.internal port=5432 dbname=soc_platform pool_size=100

[pgbouncer]
# Pool mode options:
#   session: One server connection per client session (most compatible)
#   transaction: Share connections per transaction (recommended)
#   statement: Share connections per statement (fastest, limited SQL support)
pool_mode = transaction

# Admin users for pgbouncer console
admin_users = postgres, soc_admin, pgbouncer_admin

# Stats users (read-only access to stats)
stats_users = monitoring, grafana

# Connection limits
default_pool_size = 100                  # Connections per user/db pair
reserve_pool_size = 50                  # Extra connections for peak load
reserve_pool_timeout = 3                # Seconds to wait for reserve pool
max_client_conn = 5000                  # Max clients connecting to pgbouncer

# Timeout settings (seconds)
server_idle_timeout = 300                # Recycle idle server connections
client_idle_timeout = 0                 # Don't disconnect clients
query_timeout = 30                      # Kill slow queries
idle_transaction_timeout = 0             # No limit (app manages)
server_connect_timeout = 5               # Timeout connecting to Postgres
server_lifetime = 3600                  # Recycle server connections after 1 hour
server_check_delay = 30                 # Health check interval
server_check_query = SELECT 1           # Simple health check query
server_reset_query = DISCARD ALL         # Clean up connection state

# Buffer and network settings
pkt_buf = 4096
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer
auth_query = SELECT username, password FROM pgbouncer_users WHERE username=$1

# Pooler settings
server_round_robin = on                 # Distribute load evenly
ignore_startup_parameters = extra_float_digits

# Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats_period = 60                   # Print stats every 60 seconds

# Disable pause on failure (high availability)
server_fast_close = 1
close_extra_client_connections = 0


# ============================================================
# INDEX STRATEGIES FOR HIGH-VOLUME TABLES
# ============================================================

/*
 * EVENTS TABLE INDEXES
 * Primary table for security events - highest write volume
 * Expected: 50M+ events/day at 500K EPS
 */

-- B-tree indexes for equality lookups and sorting
CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_events_timestamp 
    ON events (timestamp DESC);

CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_events_severity 
    ON events (severity) 
    WHERE status != 'archived';

CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_events_event_type 
    ON events (event_type);

CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_events_source 
    ON events (source);

-- Composite indexes for common query patterns
CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_events_time_severity 
    ON events (timestamp DESC, severity) 
    WHERE timestamp > NOW() - INTERVAL '7 days';

CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_events_source_time 
    ON events (source, timestamp DESC) 
    WHERE timestamp > NOW() - INTERVAL '24 hours';

CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_events_type_time 
    ON events (event_type, timestamp DESC)
    WHERE timestamp > NOW() - INTERVAL '7 days';

-- Partial indexes for active data only (smaller, faster)
CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_events_active_status 
    ON events (status) 
    WHERE status IN ('new', 'analyzing', 'in_progress');

CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_events_critical_recent 
    ON events (timestamp DESC) 
    WHERE severity = 'critical' AND timestamp > NOW() - INTERVAL '24 hours';

-- GIN index for JSONB fields (custom_fields)
CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_events_custom_fields 
    ON events USING GIN (custom_fields);

-- BRIN index for time-series ordering (very small, good for append-only)
CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_events_timestamp_brin 
    ON events USING BRIN (timestamp) WITH (pages_per_range = 32);

-- Hash index for exact lookups on event_id
CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_events_id_hash 
    ON events USING HASH (id);


/*
 * ALERTS TABLE INDEXES
 */

CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_alerts_status_created 
    ON alerts (status, created_at DESC);

CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_alerts_severity_status 
    ON alerts (severity DESC, status) 
    WHERE status != 'closed';

CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_alerts_assigned_to 
    ON alerts (assigned_to) 
    WHERE status IN ('new', 'acknowledged', 'in_progress');

CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_alerts_source_ref 
    ON alerts (source_event_id) 
    WHERE source_event_id IS NOT NULL;

CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_alerts_created_range 
    ON alerts (created_at DESC)
    WHERE created_at > NOW() - INTERVAL '30 days';


/*
 * INCIDENTS TABLE INDEXES
 */

CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_incidents_status_priority 
    ON incidents (status, priority DESC);

CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_incidents_created 
    ON incidents (created_at DESC);

CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_incidents_assignee 
    ON incidents (assigned_to) 
    WHERE status != 'closed';

CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_incidents_type_status 
    ON incidents (incident_type, status);


/*
 * TIME-SERIES PARTITIONING SCHEME
 * For tables exceeding 50TB annual retention
 */

