# =============================================================================
# Djezzy National SOC Platform - GitLab CI/CD Pipeline
# =============================================================================
# GitOps-compatible pipeline for self-hosted GitLab instances
# ANRT Compliant | Production Ready
# =============================================================================

stages:
  - validate
  - test
  - security
  - build
  - deploy-staging
  - deploy-production
  - verify
  - notify

variables:
  NODE_VERSION: "20"
  REGISTRY: registry.djezzy.dz
  IMAGE_PREFIX: soc/
  HELM_CHART_VERSION: "1.0.0"

# =============================================================================
# TEMPLATES
# =============================================================================
.docker-build-template: &docker-build-template
  stage: build
  image: docker:24.0-dind
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $REGISTRY
  script:
    - docker build -t $REGISTRY/$IMAGE_PREFIX$IMAGE_NAME:$CI_COMMIT_SHA -f $DOCKERFILE $BUILD_CONTEXT
    - docker push $REGISTRY/$IMAGE_PREFIX$IMAGE_NAME:$CI_COMMIT_SHA
    - |
      if [ "$CI_DEFAULT_BRANCH" == "$CI_COMMIT_BRANCH" ]; then
        docker tag $REGISTRY/$IMAGE_PREFIX$IMAGE_NAME:$CI_COMMIT_SHA $REGISTRY/$IMAGE_PREFIX$IMAGE_NAME:latest
        docker push $REGISTRY/$IMAGE_PREFIX$IMAGE_NAME:latest
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH

# =============================================================================
# VALIDATION STAGE
# =============================================================================
lint:code:
  stage: validate
  image: node:${NODE_VERSION}-alpine
  before_script:
    - corepack enable
    - bun install --frozen-lockfile
  script:
    - echo "Running ESLint..."
    - bun run lint
    - echo "Running TypeScript check..."
    - npx tsc --noEmit --pretty
  artifacts:
    when: always
    paths:
      - eslint-report.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*$/

lint:kubernetes:
  stage: validate
  image: bitnami/kubectl:latest
  script:
    - echo "Validating Kubernetes manifests..."
    - |
      for file in k8s/production/*.yaml; do
        kubectl apply --dry-run=client -o yaml -f "$file" || true
      done
    - echo "✅ K8s manifests validated"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

lint:helm:
  stage: validate
  image: alpine/helm:3.14
  script:
    - echo "Linting Helm chart..."
    - helm lint helm/djezzy-soc/
    - helm template djezzy-soc helm/djezzy-soc/ > /dev/null
    - echo "Running Helm unit tests..."
    - helm plugin install https://github.com/helm-unittest/helm-unittest.git || true
    - helm unittest helm/djezzy-soc/
    - echo "✅ Helm chart validated"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# =============================================================================
# TEST STAGE
# =============================================================================
test:unit:
  stage: test
  image: node:${NODE_VERSION}-alpine
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    POSTGRES_DB: test_db
    DATABASE_URL: postgresql://test_user:test_password@postgres:5432/test_db
    REDIS_URL: redis://redis:6379
    NODE_ENV: test
    CI: true
  before_script:
    - corepack enable
    - bun install --frozen-lockfile
  script:
    - echo "Running unit tests..."
    - bun test --coverage --reporter=json
    - echo "✅ Unit tests completed"
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    paths:
      - coverage/
    reports:
      junit: junit.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:integration:
  stage: test
  image: node:${NODE_VERSION}-alpine
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
    - name: bitnami/kafka:latest
      alias: kafka
  variables:
    DATABASE_URL: postgresql://test_user:test_password@postgres:5432/test_db
    REDIS_URL: redis://redis:6379
    KAFKA_BROKERS: kafka:9092
    NODE_ENV: test
    CI: true
  before_script:
    - corepack enable
    - bun install --frozen-lockfile
  script:
    - echo "Running integration tests..."
    - bunx prisma migrate deploy
    - bun test tests/integration/
    - echo "✅ Integration tests completed"
  artifacts:
    when: always
    paths:
      - test-results/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# =============================================================================
# SECURITY STAGE
# =============================================================================
security:trivy-fs:
  stage: security
  image: aquasec/trivy:latest
  script:
    - trivy fs --severity CRITICAL,HIGH --exit-code 1 --format table .
  allow_failure: true
  artifacts:
    when: always
    paths:
      - trivy-fs-results.txt
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

security:secrets:
  stage: security
  image: trufflesecurity/trufflehog:latest
  script:
    - trufflehog filesystem --only-verified --fail .
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

security:kubelinter:
  stage: security
  image: stackrox/kube-linter:latest
  script:
    - kube-linter lint k8s/production/ --format json > kube-linter-results.json || true
    - cat kube-linter-results.json
  artifacts:
    when: always
    paths:
      - kube-linter-results.json
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# =============================================================================
# BUILD STAGE
# =============================================================================
build:platform-api:
  <<: *docker-build-template
  variables:
    IMAGE_NAME: platform-api
    DOCKERFILE: Dockerfile
    BUILD_CONTEXT: .

build:ss7-collector:
  <<: *docker-build-template
  variables:
    IMAGE_NAME: ss7-collector
    DOCKERFILE: docker/ss7-collector/Dockerfile
    BUILD_CONTEXT: ./docker/ss7-collector
  only:
    changes:
      - docker/ss7-collector/**/*

build:ss7-analyzer:
  <<: *docker-build-template
  variables:
    IMAGE_NAME: ss7-analyzer
    DOCKERFILE: docker/ss7-analyzer/Dockerfile
    BUILD_CONTEXT: ./docker/ss7-analyzer
  only:
    changes:
      - docker/ss7-analyzer/**/*

build:diameter-monitor:
  <<: *docker-build-template
  variables:
    IMAGE_NAME: diameter-monitor
    DOCKERFILE: docker/diameter-monitor/Dockerfile
    BUILD_CONTEXT: ./docker/diameter-monitor
  only:
    changes:
      - docker/diameter-monitor/**/*

build:helm-package:
  stage: build
  image: alpine/helm:3.14
  script:
    - helm package helm/djezzy-soc/ \
      --destination ./helm-packages/ \
      --app-version $CI_COMMIT_SHORT_SHA \
      --version $HELM_CHART_VERSION+$CI_PIPELINE_IID
    - echo "Helm package created"
  artifacts:
    paths:
      - helm-packages/*.tgz
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# =============================================================================
# DEPLOYMENT STAGES
# =============================================================================
deploy:staging:
  stage: deploy-staging
  image: bitnami/kubectl:latest
  environment:
    name: staging
    url: https://staging.soc.djezzy.dz
  before_script:
    - kubectl config use-context $KUBE_CONTEXT_STAGING
  script:
    - echo "Deploying to staging environment..."
    - |
      helm upgrade --install djezzy-soc-staging helm-packages/djezzy-soc-*.tgz \
        --namespace soc-backend \
        --create-namespace \
        --values helm/djezzy-soc/values-staging.yaml \
        --set global.imageTag=$CI_COMMIT_SHA \
        --wait \
        --timeout 600s
    - echo "Waiting for rollout..."
    - kubectl rollout status deployment/soc-platform-api -n soc-backend --timeout=300s
    - echo "✅ Staging deployment complete"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - build:platform-api
    - build:helm-package

deploy:production:
  stage: deploy-production
  image: bitnami/kubectl:latest
  environment:
    name: production
    url: https://soc.djezzy.dz
  before_script:
    - kubectl config use-context $KUBE_CONTEXT_PRODUCTION
  script:
    - echo "Deploying to PRODUCTION environment..."
    
    # Database migration backup
    - kubectl exec -n soc-backend deployment/postgresql -- pg_dumpall -U soc_user > prod-pre-deploy-backup.sql
    
    # Deploy
    - |
      helm upgrade --install djezzy-soc-prod helm-packages/djezzy-soc-*.tgz \
        --namespace soc-backend \
        --values helm/djezzy-soc/values-production.yaml \
        --set global.imageTag=$CI_COMMIT_SHA \
        --wait \
        --timeout 900s
    
    # Health checks
    - kubectl rollout status deployment/soc-platform-api -n soc-backend --timeout=300s
    - kubectl rollout status deployment/kong-gateway -n soc-backend --timeout=180s
    
    # Verify deployment
    - |
      HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" https://api.soc.djezzy.dz/api/health)
      if [ "$HTTP_CODE" != "200" ]; then
        echo "❌ Health check failed with code: $HTTP_CODE"
        kubectl rollout undo deployment/soc-platform-api -n soc-backend
        exit 1
      fi
    
    - echo "✅ Production deployment complete"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*$/
      when: manual
  needs:
    - deploy:staging

# =============================================================================
# VERIFICATION STAGE
# =============================================================================
verify:smoke-tests:
  stage: verify
  image: curlimages/curl:latest
  script:
    - echo "Running smoke tests..."
    - |
      ENDPOINTS=(
        "https://api.soc.djezzy.dz/api/health"
        "https://soc.djezzy.dz/"
      )
      
      for ENDPOINT in "${ENDPOINTS[@]}"; do
        HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" "$ENDPOINT")
        if [ "$HTTP_CODE" != "200" ]; then
          echo "❌ Failed: $ENDPOINT ($HTTP_CODE)"
          exit 1
        fi
        echo "✅ OK: $ENDPOINT ($HTTP_CODE)"
      done
    - echo "✅ Smoke tests passed"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - deploy:staging

verify:integration-health:
  stage: verify
  image: bitnami/kubectl:latest
  script:
    - echo "Checking integration health..."
    - kubectl get pods -n soc-backend -l app.kubernetes.io/part-of=soc-platform
    - kubectl top pods -n soc-backend -l app.kubernetes.io/part-of=soc-platform || true
    - echo "✅ Integration health verified"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - deploy:staging

# =============================================================================
# NOTIFICATION STAGE
# =============================================================================
notify:slack-success:
  stage: notify
  image: alpine/curl:latest
  script:
    - |
      curl -X POST "$SLACK_WEBHOOK_URL" \
        -H 'Content-type: application/json' \
        -d "{
          \"text\": \"✅ Pipeline Successful\",
          \"attachments\": [{
            \"color\": \"good\",
            \"fields\": [
              {\"title\": \"Project\", \"value\": \"$CI_PROJECT_NAME\", \"short\": true},
              {\"title\": \"Branch\", \"value\": \"$CI_COMMIT_REF_NAME\", \"short\": true},
              {\"title\": \"Commit\", \"value\": \"$CI_COMMIT_SHORT_SHA\", \"short\": true},
              {\"title\": \"Author\", \"value\": \"$CI_COMMIT_AUTHOR\", \"short\": true},
              {\"title\": \"Pipeline\", \"value\": \"$CI_PIPELINE_URL\", \"short\": false}
            ]
          }]
        }"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

notify:slack-failure:
  stage: notify
  image: alpine/curl:latest
  script:
    - |
      curl -X POST "$SLACK_WEBHOOK_URL" \
        -H 'Content-type: application/json' \
        -d "{
          \"text\": \"❌ Pipeline Failed\",
          \"attachments\": [{
            \"color\": \"danger\",
            \"fields\": [
              {\"title\": \"Project\", \"value\": \"$CI_PROJECT_NAME\", \"short\": true},
              {\"title\": \"Branch\", \"value\": \"$CI_COMMIT_REF_NAME\", \"short\": true},
              {\"title\": \"Commit\", \"value\": \"$CI_COMMIT_SHORT_SHA\", \"short\": true},
              {\"title\": \"Stage\", \"value\": \"$CI_JOB_STAGE\", \"short\": true},
              {\"title\": \"Pipeline\", \"value\": \"$CI_PIPELINE_URL\", \"short\": false}
            ]
          }]
        }"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_failure

notify:anrt-compliance:
  stage: notify
  image: alpine/curl:latest
  script:
    - |
      echo "Logging deployment for ANRT compliance..."
      # Log to audit system
      curl -X POST "$AUDIT_LOG_ENDPOINT" \
        -H 'Content-type: application/json' \
        -d "{
          \"timestamp\": \"$(date -Iseconds)\",
          \"event\": \"deployment\",
          \"environment\": \"$CI_ENVIRONMENT_NAME\",
          \"version\": \"$CI_COMMIT_SHA\",
          \"compliance\": \"ANRT-v2.1\"
        }" || true
  rules:
    - if: $CI_ENVIRONMENT_NAME == "production"
      when: always

# =============================================================================
# PAGES (Coverage Reports)
# =============================================================================
pages:
  stage: notify
  image: alpine:latest
  script:
    - mkdir -p public
    - cp -r coverage/* public/ || true
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - test:unit
