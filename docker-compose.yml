# ============================================================
# National SOC Platform - Docker Compose (Development)
# For local development and testing
# Usage: docker compose up -d
# ============================================================

version: '3.8'

services:
  # ----------------------------------------------------------
  # Next.js Application (Development Mode)
  # ----------------------------------------------------------
  soc-platform:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: soc-platform-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:./db/custom.db
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=dev-secret-change-in-production
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
      - ./db:/app/db
      - ./prisma:/app/prisma
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - soc-network
    restart: unless-stopped

  # ----------------------------------------------------------
  # Redis (Session Cache & Rate Limiting)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: soc-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soc-network
    restart: unless-stopped

  # ----------------------------------------------------------
  # PostgreSQL (Optional - for testing production-like setup)
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: soc-postgres-dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=soc_admin
      - POSTGRES_PASSWORD=soc_dev_password_2024
      - POSTGRES_DB=soc_platform
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc_admin -d soc_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soc-network
    restart: unless-stopped
    profiles:
      - postgres

  # ----------------------------------------------------------
  # pgAdmin (Database Management UI)
  # ----------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: soc-pgadmin-dev
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@djezzy.dz
      - PGADMIN_DEFAULT_PASSWORD=admin123
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - soc-network
    restart: unless-stopped
    profiles:
      - postgres

# ============================================================
# Volumes
# ============================================================
volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  pgadmin-data:
    driver: local

# ============================================================
# Networks
# ============================================================
networks:
  soc-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
