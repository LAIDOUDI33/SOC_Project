# ============================================================
# National SOC Platform - Server Block Configuration
# Djezzy Production: soc.djezzy.dz
# ============================================================

# ----------------------------------------------------------
# HTTP -> HTTPS Redirect
# ----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;
    
    # ACME challenge for Let's Encrypt (if used)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------
# HTTPS Main Server
# ----------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name soc.djezzy.dz *.soc.djezzy.dz localhost;
    
    # ----------------------------------------------------------
    # SSL Configuration (Djezzy Security Standards)
    # ----------------------------------------------------------
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/ssl/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # ----------------------------------------------------------
    # Security Headers (CIS Benchmark + OWASP)
    # ----------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:;" always;
    
    # Remove server version
    server_tokens off;

    # ----------------------------------------------------------
    # Root Location - Next.js App Proxy
    # ----------------------------------------------------------
    location / {
        limit_req zone=general burst=20 nodelay;
        
        proxy_pass http://soc_backend;
        proxy_http_version 1.1;
        
        # WebSocket support for SSE
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Forward real IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffering
        proxy_buffering off;
        proxy_cache off;
        
        # Disable request buffering for SSE streaming
        proxy_request_buffering off;
    }

    # ----------------------------------------------------------
    # API Endpoints (Higher Rate Limit)
    # ----------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        
        proxy_pass http://soc_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API-specific timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ----------------------------------------------------------
    # Authentication Endpoints (Strict Rate Limit)
    # ----------------------------------------------------------
    location /api/auth {
        limit_req zone=auth burst=10 nodelay;
        
        proxy_pass http://soc_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------
    # SSE Streaming Endpoints (Connection Limit)
    # ----------------------------------------------------------
    location /api/stream {
        limit_conn sse 5;
        
        proxy_pass http://soc_backend;
        proxy_http_version 1.1;
        
        # Essential for SSE
        proxy_set_header Connection '';
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 86400s;  # 24 hours for SSE
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable gzip for SSE
        gzip off;
    }

    # ----------------------------------------------------------
    # Next.js Static Assets (with caching)
    # ----------------------------------------------------------
    location /_next/static {
        proxy_pass http://soc_backend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ----------------------------------------------------------
    # Health Check Endpoint (No auth required)
    # ----------------------------------------------------------
    location /api/health {
        access_log off;
        
        proxy_pass http://soc_backend;
        proxy_set_header Host $host;
    }

    # ----------------------------------------------------------
    # Deny Sensitive Files
    # ----------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~* \.(env|log|conf|ini|bak|sql|git)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ----------------------------------------------------------
# Map for WebSocket/SSE upgrade
# ----------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
