# ============================================================
# National SOC Platform - Nginx Main Configuration
# Production Reverse Proxy for Djezzy
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    # ----------------------------------------------------------
    # Basic Settings
    # ----------------------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    charset utf-8;
    
    # Logging format for JSON parsing in ELK
    log_format json_combined escape=json
        '{'
            '"time_local":"$time_local",'
            '"remote_addr":"$remote_addr",'
            '"remote_user":"$remote_user",'
            '"request":"$request",'
            '"status": "$status",'
            '"body_bytes_sent":"$body_bytes_sent",'
            '"request_time":"$request_time",'
            '"http_referrer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for",'
            '"upstream_response_time":"$upstream_response_time"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ----------------------------------------------------------
    # Performance Optimization
    # ----------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Timeouts
    keepalive_timeout 65;
    client_header_timeout 30;
    client_body_timeout 30;
    send_timeout 30;
    
    # Buffer sizes
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # ----------------------------------------------------------
    # Rate Limiting Zones (DDoS Protection)
    # ----------------------------------------------------------
    # General requests: 10 req/s per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    # API requests: 30 req/s per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # Auth endpoints: 5 req/s per IP (brute force protection)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    # SSE connections: 5 concurrent per IP
    limit_conn_zone $binary_remote_addr zone=sse:10m;
    
    # Upstream definition
    upstream soc_backend {
        server app:3000;
        keepalive 32;
    }

    # ----------------------------------------------------------
    # Include additional configs
    # ----------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
