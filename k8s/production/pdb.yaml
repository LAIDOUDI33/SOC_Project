# =============================================================================

# =============================================================================
# SOC PLATFORM API - PDB
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: soc-platform-api-pdb
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: djezzy-soc
    app.kubernetes.io/component: pdb
    app.kubernetes.io/part-of: soc-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: soc-platform-api

