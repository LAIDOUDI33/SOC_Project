# =============================================================================
# Djezzy National SOC Platform - Services
# =============================================================================
# ClusterIP Services | Proper Labeling | GitOps Ready
# =============================================================================

# =============================================================================
# SOC PLATFORM API SERVICE
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: soc-platform-api
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: soc-platform-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: soc-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/api/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: soc-platform-api
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP

---
# =============================================================================
# KONG API GATEWAY SERVICE
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: kong-gateway
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: kong-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: soc-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kong-gateway
  ports:
  - name: proxy
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: proxy-ssl
    port: 8443
    targetPort: 8443
    protocol: TCP
  - name: admin
    port: 8001
    targetPort: 8001
    protocol: TCP

