# =============================================================================
# KAFKA & ZOOKEEPER SERVICES
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: soc-events
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: soc-platform
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app.kubernetes.io/name: kafka
  ports:
  - name: internal
    port: 9092
    targetPort: 9092
    protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: soc-events
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: soc-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka
  ports:
  - name: external
    port: 9092
    targetPort: 9092
    protocol: TCP
  - name: jmx
    port: 9999
    targetPort: 9999
    protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-headless
  namespace: soc-events
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/component: messaging-coordination
    app.kubernetes.io/part-of: soc-platform
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app.kubernetes.io/name: zookeeper
  ports:
  - name: client
    port: 2181
    targetPort: 2181
    protocol: TCP
  - name: follower
    port: 2888
    targetPort: 2888
    protocol: TCP
  - name: leader-election
    port: 3888
    targetPort: 3888
    protocol: TCP

