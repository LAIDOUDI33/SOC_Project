# =============================================================================
# 15. POSTGRESQL DATABASE
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: soc-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: soc-postgresql
  replicas: 1  # Use external HA solution for production
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/part-of: soc-platform
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
      - name: postgresql
        image: postgres:16-alpine
        imagePullPolicy: Always
        ports:
        - name: postgres
          containerPort: 5432
          protocol: TCP
        - name: metrics
          containerPort: 9187
          protocol: TCP
        env:
        - name: POSTGRES_USER
          value: "soc_user"
        - name: POSTGRES_DB
          value: "soc_platform"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: POSTGRES_PASSWORD
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "4"
            memory: "16Gi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - soc_user
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - soc_user
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: postgresql-data
          mountPath: /var/lib/postgresql/data
        - name: postgresql-backup
          mountPath: /backups
      volumes:
      - name: postgresql-data
        persistentVolumeClaim:
          claimName: postgresql-data-pvc
      - name: postgresql-backup
        persistentVolumeClaim:
          claimName: postgresql-backup-pvc
  volumeClaimTemplates:
  - metadata:
      name: postgresql-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path
      resources:
        requests:
          storage: 500Gi

