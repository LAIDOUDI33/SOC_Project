# SS7 Collector
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ss7-collector
  namespace: soc-ss7
  labels:
    app.kubernetes.io/name: ss7-collector
    app.kubernetes.io/component: ss7-signaling
    app.kubernetes.io/part-of: ss7-module
    anrt.djezzy.soc/classification: restricted
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ss7-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ss7-collector
        app.kubernetes.io/part-of: ss7-module
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      containers:
      - name: ss7-collector
        image: registry.djezzy.dz/soc/ss7-collector:production
        imagePullPolicy: Always
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
        envFrom:
        - configMapRef:
            name: ss7-module-config
        - secretRef:
            name: ss7-module-secrets
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
          limits:
            cpu: "4"
            memory: "4Gi"
        livenessProbe:
          tcpSocket:
            port: 9100
          initialDelaySeconds: 30
          periodSeconds: 15
        volumeMounts:
        - name: ss7-collector-data
          mountPath: /data/ss7
      volumes:
      - name: ss7-collector-data
        persistentVolumeClaim:
          claimName: ss7-collector-data-pvc

