    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      initContainers:
      - name: check-es
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z soc-elasticsearch 9200; do echo waiting for elasticsearch; sleep 2; done']
      containers:
      - name: arkime-capture
        image: arkime/arkime:latest
        imagePullPolicy: Always
        command: ["capture"]
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
            - IPC_LOCK
        envFrom:
        - configMapRef:
            name: arkime-config
        - secretRef:
            name: application-secrets
        resources:
          requests:
            cpu: "2"
            memory: "2Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        volumeMounts:
        - name: arkime-pcaps
          mountPath: /data/pcap
        - name: arkime-config-volume
          mountPath: /opt/arkime/etc/config.ini
          subPath: config.ini
      - name: arkime-viewer
        image: arkime/arkime:latest
        imagePullPolicy: Always
        command: ["viewer"]
        ports:
        - name: viewer
          containerPort: 8005
          protocol: TCP
        envFrom:
        - configMapRef:
            name: arkime-config
        - secretRef:
            name: application-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
      volumes:
      - name: arkime-pcaps
        persistentVolumeClaim:
          claimName: arkime-pcaps-pvc
      - name: arkime-config-volume
        configMap:
          name: arkime-config

