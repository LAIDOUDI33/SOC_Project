        - secretRef:
            name: application-secrets
      containers:
      - name: defectdojo-uwsgi
        image: defectdojo/defectdojo-latest:latest
        imagePullPolicy: Always
        ports:
        - name: web
          containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: defectdojo-config
        - secretRef:
            name: database-credentials
        - secretRef:
            name: application-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        securityContext:
