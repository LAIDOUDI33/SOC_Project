# =============================================================================
# KAFKA CLUSTER (StatefulSet for 3 brokers)
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: soc-events
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: soc-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: soc-kafka
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: soc-platform
        prometheus.io/scrape: "true"
        prometheus.io/port: "9999"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
      - name: check-zookeeper
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z soc-zookeeper-headless 2181; do echo waiting for zookeeper; sleep 2; done']
      containers:
      - name: kafka-broker
        image: bitnami/kafka:3.6
        imagePullPolicy: Always
        ports:
        - name: internal
          containerPort: 9092
          protocol: TCP
        - name: jmx
          containerPort: 9999
          protocol: TCP
        env:
        - name: KAFKA_BROKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: KAFKA_CFG_ZOOKEEPER_CONNECT
          value: "soc-zookeeper-headless:2181"
        - name: KAFKA_CFG_LISTENERS
          value: "PLAINTEXT://:9092"
        - name: KAFKA_CFG_ADVERTISED_LISTENERS
          value: "PLAINTEXT://$(KAFKA_POD_FQDN):9092"
        - name: KAFKA_POD_FQDN
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: KAFKA_HEAP_OPTS
          value: "-Xmx4g -Xms4g"
        - name: KAFKA_JMX_PORT
          value: "9999"
        - name: KAFKA_LOG_DIRS
          value: "/bitnami/kafka/data"
        envFrom:
        - configMapRef:
            name: kafka-config
        resources:
          requests:
            cpu: "1"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        livenessProbe:
          exec:
            command:
            - bin/kafka-broker-api-versions.sh
            - --bootstrap-server
            - localhost:9092
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          exec:
            command:
            - bin/kafka-broker-api-versions.sh
            - --bootstrap-server
            - localhost:9092
          initialDelaySeconds: 20
          periodSeconds: 10
        volumeMounts:
        - name: kafka-data
          mountPath: /bitnami/kafka/data
      volumes:
      - name: kafka-data
        persistentVolumeClaim:
          claimName: kafka-data-pvc
  volumeClaimTemplates:
  - metadata:
      name: kafka-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path
      resources:
        requests:
          storage: 100Gi

---
# =============================================================================
# ZOOKEEPER CLUSTER
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: soc-events
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/component: messaging-coordination
    app.kubernetes.io/part-of: soc-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: soc-zookeeper-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zookeeper
        app.kubernetes.io/part-of: soc-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: zookeeper
        image: bitnami/zookeeper:3.8
        imagePullPolicy: Always
        ports:
        - name: client
          containerPort: 2181
          protocol: TCP
        - name: follower
          containerPort: 2888
          protocol: TCP
        - name: leader-election
          containerPort: 3888
          protocol: TCP
        env:
        - name: ZOO_SERVERS
          value: "server.1=soc-zookeeper-0.soc-zookeeper-headless:2888:3888,server.2=soc-zookeeper-1.soc-zookeeper-headless:2888:3888,server.3=soc-zookeeper-2.soc-zookeeper-headless:2888:3888"
        - name: ZOO_MY_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['statefulset.kubernetes.io/pod-name']
        envFrom:
        - configMapRef:
            name: zookeeper-config
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "2Gi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        livenessProbe:
          tcpSocket:
            port: client
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - bash
            - -c
            - ruok | grep imok
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: zk-data
          mountPath: /bitnami/zookeeper/data
      volumes:
      - name: zk-data
        persistentVolumeClaim:
          claimName: zookeeper-data-pvc
  volumeClaimTemplates:
  - metadata:
      name: zk-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path
      resources:
        requests:
          storage: 10Gi

---
# =============================================================================
# PROMETHEUS MONITORING
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: soc-monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: soc-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: soc-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      serviceAccountName: prometheus-service-account
      containers:
      - name: prometheus
        image: prom/prometheus:v2.49.0
        imagePullPolicy: Always
        args:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
        - "--storage.tsdb.retention.time=2555h"  # ANRT compliance - 7 years data retention
        - "--storage.tsdb.retention.size=500GB"
        - "--web.enable-lifecycle"
        - "--web.enable-admin-api"
        ports:
        - name: web
          containerPort: 9090
          protocol: TCP
        envFrom:
        - configMapRef:
            name: prometheus-config
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "8Gi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: web
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /-/ready
            port: web
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: prometheus-config-volume
          mountPath: /etc/prometheus
        - name: prometheus-data
          mountPath: /prometheus
      volumes:
      - name: prometheus-config-volume
        configMap:
          name: prometheus-config
      - name: prometheus-data
        persistentVolumeClaim:
          claimName: prometheus-data-pvc

---
# =============================================================================
# GRAFANA MONITORING UI
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: soc-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring-ui
    app.kubernetes.io/part-of: soc-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: soc-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472  # Grafana user ID
        fsGroup: 472
      initContainers:
      - name: provision-dashboards
        image: busybox:1.36
        command: ['sh', '-c', 'cp /dashboards/* /grafana-dashboards/']
        volumeMounts:
        - name: dashboard-provisioning
          mountPath: /dashboards
        - name: grafana-dashboards
          mountPath: /grafana-dashboards
      containers:
      - name: grafana
        image: grafana/grafana:10.2.0
        imagePullPolicy: Always
        ports:
        - name: web
          containerPort: 3000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: grafana-config
        - secretRef:
            name: grafana-secrets
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "2Gi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        livenessProbe:
          httpGet:
            path: /api/health
            port: web
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/health
            port: web
          initialDelaySeconds: 20
          periodSeconds: 10
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        - name: grafana-dashboards
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
      volumes:
      - name: grafana-data
        persistentVolumeClaim:
          claimName: grafana-data-pvc
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards
      - name: grafana-datasources
        configMap:
          name: grafana-datasources

