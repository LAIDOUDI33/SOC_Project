        - configMapRef:
            name: defectdojo-config
        - secretRef:
            name: database-credentials
        - secretRef:
            name: application-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
      volumes:
      - name: defectdojo-media
        persistentVolumeClaim:
          claimName: defectdojo-media-pvc

