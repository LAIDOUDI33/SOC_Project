# =============================================================================
# 9. SURICATA NSM
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: suricata
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: suricata
    app.kubernetes.io/component: nsm
    app.kubernetes.io/part-of: soc-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 2  # Multiple instances for high availability
  selector:
    matchLabels:
      app.kubernetes.io/name: suricata
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suricata
        app.kubernetes.io/part-of: soc-platform
        prometheus.io/scrape: "true"
        prometheus.io/port: "9114"
    spec:
      hostNetwork: true  # Required for packet capture
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: false  # Suricata needs root for network access
        runAsUser: 0
      containers:
      - name: suricata
        image: jasonish/suricata:latest
        imagePullPolicy: Always
        command: ["/usr/bin/suricata", "-c", "/etc/suricata/suricata.yaml", "-i", "eth0"]
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
            - IPC_LOCK
            - SYS_NICE
        envFrom:
        - configMapRef:
            name: suricata-config
        resources:
          requests:
            cpu: "2"
            memory: "2Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        volumeMounts:
        - name: suricata-rules
          mountPath: /etc/suricata/rules
        - name: suricata-logs
          mountPath: /var/log/suricata
        - name: suricata-config-volume
          mountPath: /etc/suricata/suricata.yaml
          subPath: suricata.yaml
      volumes:
      - name: suricata-rules
        configMap:
          name: suricata-config
      - name: suricata-logs
        emptyDir: {}
      - name: suricata-config-volume
        configMap:
          name: suricata-config

---
