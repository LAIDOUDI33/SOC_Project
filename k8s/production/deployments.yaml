# =============================================================================
# 12. OPENVAS VULNERABILITY SCANNER
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openvas
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: openvas
    app.kubernetes.io/component: vulnerability-scanner
    app.kubernetes.io/part-of: soc-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openvas
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openvas
        app.kubernetes.io/part-of: soc-platform
    spec:
      securityContext:
        runAsNonRoot: false  # OpenVAS needs root
        runAsUser: 0
      initContainers:
      - name: setup-openvas
        image: greenbone/openvas-scanner:22.4
        command: ['/bin/sh', '-c', 'openvas --update-vt-data && openvas -s']
      containers:
      - name: ospd-openvas
        image: greenbone/ospd-openvas:22.4
        imagePullPolicy: Always
        ports:
        - name: scanner
          containerPort: 12321
          protocol: TCP
        envFrom:
        - configMapRef:
            name: openvas-config
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        securityContext:
          capabilities:
            add:
            - NET_RAW
            - NET_ADMIN
        livenessProbe:
          tcpSocket:
            port: scanner
          initialDelaySeconds: 180
          periodSeconds: 30
        readinessProbe:
          tcpSocket:
            port: scanner
          initialDelaySeconds: 150
          periodSeconds: 20
        volumeMounts:
        - name: openvas-data
          mountPath: /var/lib/openvas
      - name: gvmd
        image: greenbone/gvmd:22.4
        imagePullPolicy: Always
        ports:
        - name: manager
          containerPort: 9392
          protocol: TCP
        envFrom:
        - configMapRef:
            name: openvas-config
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
        livenessProbe:
          tcpSocket:
            port: manager
          initialDelaySeconds: 60
          periodSeconds: 20
      - name: gsa
        image: greenbone/gsa:22.4
        imagePullPolicy: Always
        ports:
        - name: web
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /
            port: web
          initialDelaySeconds: 30
          periodSeconds: 15
      volumes:
      - name: openvas-data
        persistentVolumeClaim:
          claimName: openvas-data-pvc

