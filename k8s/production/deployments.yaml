# =============================================================================
# 1. SOC PLATFORM API (Next.js Application)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soc-platform-api
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: djezzy-soc
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: soc-platform
    app.kubernetes.io/managed-by: argocd
    anrt.djezzy.soc/compliance: telecom-regulation
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    description: "Main SOC Platform API - Next.js 16"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: soc-platform-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soc-platform-api
        app.kubernetes.io/part-of: soc-platform
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/metrics"
      annotations:
        prometheus.io/scrape: "true"
    spec:
      serviceAccountName: soc-platform-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [soc-platform-api]
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 80
            preference:
              matchExpressions:
              - key: node-role/djezzy.soc
                operator: In
                values: [backend]
      containers:
      - name: soc-platform-api
        image: registry.djezzy.dz/soc/platform-api:production
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: soc-platform-config
        - secretRef:
            name: application-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health/readiness
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        volumeMounts:
        - name: tmp-dir
          mountPath: /tmp
        - name: cache-dir
          mountPath: /app/.next/cache
      volumes:
      - name: tmp-dir
        emptyDir: {}
      - name: cache-dir
        emptyDir: {}

---
# =============================================================================
# 2. KONG API GATEWAY
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-gateway
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: kong-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: soc-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kong-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kong-gateway
        app.kubernetes.io/part-of: soc-platform
        prometheus.io/scrape: "true"
        prometheus.io/port: "8443"
        prometheus.io/path: "/metrics"
      annotations:
        prometheus.io/scrape: "true"
    spec:
      serviceAccountName: kong-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: kong-gateway
        image: kong/kong-gateway:3.6-ubuntu
        imagePullPolicy: Always
        ports:
        - name: proxy
          containerPort: 8000
          protocol: TCP
        - name: proxy-ssl
          containerPort: 8443
          protocol: TCP
        - name: admin
          containerPort: 8001
          protocol: TCP
        envFrom:
        - configMapRef:
            name: kong-config
        - secretRef:
            name: kong-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # Kong needs write access for temp files
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        livenessProbe:
          httpGet:
            path: /status
            port: admin
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /status/ready
            port: admin
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: kong-tmp
          mountPath: /tmp
        - name: kong-prefix
          mountPath: /var/run/kong
      volumes:
      - name: kong-tmp
        emptyDir: {}
      - name: kong-prefix
        emptyDir: {}

---
# =============================================================================
# 3. WAZUH SIEM MANAGER
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-manager
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: wazuh-manager
    app.kubernetes.io/component: siem
    app.kubernetes.io/part-of: soc-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wazuh-manager
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-manager
        app.kubernetes.io/part-of: soc-platform
        prometheus.io/scrape: "true"
        prometheus.io/port: "1514"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: false  # Wazuh requires root for some operations
        runAsUser: 0
        fsGroup: 0
      initContainers:
      - name: check-elasticsearch
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z soc-elasticsearch 9200; do echo waiting for elasticsearch; sleep 2; done']
      containers:
      - name: wazuh-manager
        image: wazuh/wazuh-manager:4.7.0
        imagePullPolicy: Always
        ports:
        - name: events
          containerPort: 1514
          protocol: TCP
        - name: events-udp
          containerPort: 1514
          protocol: UDP
        - name: api
          containerPort: 55000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: wazuh-config
        - secretRef:
            name: database-credentials
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        securityContext:
          allowPrivilegeEscalation: true  # Required by Wazuh
          capabilities:
            add:
            - SYS_ADMIN
            - NET_ADMIN
            drop:
            - ALL
        livenessProbe:
          tcpSocket:
            port: 1514
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pgrep -f wazuh-manager || exit 1
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: wazuh-data
          mountPath: /var/ossec/data
        - name: wazuh-config-volume
          mountPath: /var/ossec/etc/ossec.conf
          subPath: ossec.conf
      volumes:
      - name: wazuh-data
        persistentVolumeClaim:
          claimName: wazuh-data-pvc
      - name: wazuh-config-volume
        configMap:
          name: wazuh-config

---
# =============================================================================
# 4. WAZUH DASHBOARD (Kibana Fork)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-dashboard
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: wazuh-dashboard
    app.kubernetes.io/component: siem-ui
    app.kubernetes.io/part-of: soc-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wazuh-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-dashboard
        app.kubernetes.io/part-of: soc-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
      - name: check-wazuh
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z wazuh-manager 55000; do echo waiting for wazuh-manager; sleep 2; done']
      containers:
      - name: wazuh-dashboard
        image: wazuh/wazuh-dashboard:4.7.0
        imagePullPolicy: Always
        ports:
        - name: web
          containerPort: 5601
          protocol: TCP
        env:
        - name: WAZUH_API_URL
          value: "https://wazuh-manager:55000"
        - name: WAZUH_DASHBOARD_USERNAME
          value: "${WAZUH_DASHBOARD_USER}"
        - name: WAZUH_DASHBOARD_PASSWORD
          valueFrom:
            secretKeyRef:
              name: application-secrets
              key: WAZUH_DASHBOARD_PASSWORD
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        livenessProbe:
          httpGet:
            path: /api/status
            port: web
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/status
            port: web
          initialDelaySeconds: 45
          periodSeconds: 10

