# =============================================================================
# Djezzy National SOC Platform - Secrets Template
# =============================================================================
# IMPORTANT: This file contains SECRET TEMPLATES only!
# 
# DEPLOYMENT INSTRUCTIONS FOR SEALED SECRETS:
# ------------------------------------------------
# 1. Install Sealed Secrets controller:
#    kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.25.0/controller.yaml
#
# 2. Install kubeseal CLI:
#    # Linux
#    wget https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.25.0/kubeseal-linux-amd64 -O kubeseal
#    chmod +x kubeseal && sudo mv kubeseal /usr/local/bin/
#
# 3. Create actual secrets from this template:
#    # Create a temporary secret manifest
#    cat secrets-template.yaml | sed 's/PLACEHOLDER_VALUE//g' > temp-secrets.yaml
#    # Generate values for each field
#    # Then seal it:
#    kubeseal --format yaml < temp-secrets.yaml > sealed-secrets.yaml
#
# 4. Or use Kubernetes native secrets (for development ONLY):
#    # Create .env file with actual values
#    kubectl create secret generic soc-secrets \
#      --from-env-file=.env \
#      --namespace=soc-backend \
#      --dry-run=client -o yaml > secrets.yaml
#
# SECURITY REQUIREMENTS (ANRT COMPLIANT):
# - All passwords must be minimum 32 characters
# - Use cryptographic random generation
# - Rotate secrets every 90 days
# - Store sealed-secrets.yaml in Git repository (encrypted)
# - NEVER commit plain text secrets to version control
# =============================================================================

