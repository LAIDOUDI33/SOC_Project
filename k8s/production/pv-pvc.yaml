# =============================================================================
# Djezzy National SOC Platform - Persistent Volumes & Claims
# =============================================================================
# Production Storage | Local Path / NFS / Ceph | ANRT Compliant
# =============================================================================

# =============================================================================
# POSTGRESQL DATA - PVC
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data-pvc
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database-storage
    app.kubernetes.io/part-of: soc-platform
  annotations:
    volume.beta.kubernetes.io/storage-class: local-path
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 500Gi

---
