# =============================================================================
# Kong API Gateway Configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: kong-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: soc-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  KONG_DATABASE: "off"
  KONG_DECLARATIVE_CONFIG: "/etc/kong/kong.yml"
  KONG_NGINX_PROXY_REAL_IP_HEADER: "X-Forwarded-For"
  KONG_NGINX_PROXY_REAL_IP_RECURSIVE: "on"
  KONG_PROXY_ACCESS_LOG: /dev/stdout
  KONG_ADMIN_ACCESS_LOG: /dev/stdout
  KONG_PROXY_ERROR_LOG: /dev/stderr
  KONG_ADMIN_ERROR_LOG: /dev/stderr
  KONG_ADMIN_LISTEN: "0.0.0.0:8001"
  KONG_ADMIN_GUI_URL: "https://kong-admin.soc.djezzy.dz"
  # Plugins
  KONG_PLUGINS: "bundled,rate-limiting,key-auth,acl,jwt,oauth2,correlation-id,request-transformer,response-transformer"
  # SSL/TLS
  KONG_SSL_CIPHER_SUITE: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
  # Performance
  KONG_WORKER_PROCESS: "auto"
  KONG_WORKER_CONNECTIONS: "16384"
  # Declarative Config
  kong.yml: |
    _format_version: "3.0"
    
    services:
      - name: soc-platform-api
        url: http://soc-platform-api.soc-backend:3000
        routes:
          - name: api-route
            paths:
              - /api
            strip_path: true
            methods:
              - GET
              - POST
              - PUT
              - DELETE
            plugins:
              - name: rate-limiting
                config:
                  minute: 1000
                  policy: local
                  fault_tolerant: true
              - name: cors
                config:
                  origins:
                    - https://soc.djezzy.dz
                  methods:
                    - GET
                    - POST
                    - PUT
                    - DELETE
                    - OPTIONS
                  headers:
                    - Accept
                    - Authorization
                    - Content-Type
                  credentials: true
                  max_age: 3600
      
      - name: thehive-service
        url: http://soc-thehive.soc-backend:9000
        routes:
          - name: thehive-route
            paths:
              - /thehive
            strip_path: true
            plugins:
              - name: key-auth
                config:
                  hide_credentials: false
      
      - name: misp-service
        url: http://soc-misp.soc-backend:80
        routes:
          - name: misp-route
            paths:
              - /misp
            strip_path: true
      
      - name: grafana-service
        url: http://soc-grafana.soc-monitoring:3000
        routes:
          - name: grafana-route
            paths:
              - /grafana
            strip_path: true
            plugins:
              - name: jwt
                config:
                  secret_is_base64: false
                  claims_to_verify:
                    - exp

# =============================================================================
# Prometheus Monitoring Configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: soc-monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: soc-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'djezzy-soc'
        environment: 'production'
    
    rule_files:
      - '/etc/prometheus/alert_rules.yml'
    
    scraping_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
      
      - job_name: 'kubernetes-services'
        kubernetes_sd_configs:
          - role: service
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
      
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: '(.*):10250'
            target_label: __address__
            replacement: '${1}:9100'
      
      - job_name: 'kubernetes-cadvisor'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

  alert_rules.yml: |
    groups:
      - name: soc_platform_alerts
        rules:
          - alert: HighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "High error rate detected"
              description: "Error rate is {{ $value }} on {{ $labels.instance }}"
          
          - alert: HighMemoryUsage
            expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage"
              description: "Container {{ $labels.container }} is using {{ $value }}% of memory"
          
          - alert: KafkaConsumerLag
            expr: kafka_consumer_lag > 10000
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "High Kafka consumer lag"
              description: "Consumer lag is {{ $value }} messages"
          
          - alert: PostgreSQLConnectionPoolExhaustion
            expr: pg_stat_activity_count / pg_settings_max_connections > 0.85
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "PostgreSQL connection pool nearly exhausted"
          
          - alert: SIEMAlertBacklog
            expr: wazuh_alerts_pending > 10000
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "SIEM alert backlog growing"
              description: "{{ $value }} pending alerts in Wazuh"

# =============================================================================
# Grafana Dashboard Configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: soc-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: soc-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  GF_SECURITY_ADMIN_USER: "admin"
  GF_USERS_ALLOW_SIGN_UP: "false"
  GF_AUTH_ANONYMOUS_ENABLED: "false"
  GF_SERVER_ROOT_URL: "https://grafana.soc.djezzy.dz"
  GF_SERVER_DOMAIN: "grafana.soc.djezzy.dz"
  GF_INSTALL_PLUGINS: "grafana-piechart-panel,grafana-worldmap-panel,grafana-clock-panel,natel-discrete-panel"
  GF_DATAPROXY_TIMEOUT: "180"
  GF_LOG_MODE: "console"
  GF_LOG_LEVEL: "info"
  # ANRT Compliance
  GF_AUDIT_LOGGING_ENABLED: "true"
  GF_AUDIT_LOG_ACTIONS: "export,settings,create,delete,modify"

# =============================================================================
# Kafka Cluster Configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: soc-events
  labels:
    app.kubernetes.io/name: kafka-cluster
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: soc-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  KAFKA_BROKER_ID: "1"
  KAFKA_NUM_PARTITIONS: "12"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_LOG_RETENTION_HOURS: "168"  # 7 days
  KAFKA_LOG_SEGMENT_BYTES: "1073741824"  # 1GB
  KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "300000"
  KAFKA_ZOOKEEPER_CONNECT: "soc-zookeeper-headless.soc-events:2181"
  KAFKA_JMX_PORT: "9999"
  KAFKA_HEAP_OPTS: "-Xmx4g -Xms4g"
  # Security
  KAFKA_SSL_ENABLED: "false"  # Enable with certificates in production
  KAFKA_SASL_MECHANISM: ""
  # Topics Configuration
  KAFKA_TOPICS: |
    security.alerts:12:3
    security.events:24:3
    ss7.signaling:6:3
    telecom.fraud:6:3
    threat.intelligence:6:3
    vulnerability.findings:6:3
    soar.cases:6:3
    audit.logs:12:3

# =============================================================================
# Zookeeper Configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: zookeeper-config
  namespace: soc-events
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: soc-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  ZOOKEEPER_CLIENT_PORT: "2181"
  ZOOKEEPER_TICK_TIME: "2000"
  ZOOKEEPER_INIT_LIMIT: "10"
  ZOOKEEPER_SYNC_LIMIT: "5"
  ZOOKEEPER_MAX_CLIENT_CNXNS: "60"
  ZOOKEEPER_HEAP_OPTS: "-Xmx1g -Xms1g"
  ZOOKEEPER_PURGE_INTERVAL: "24"

# =============================================================================
# SS7 Module Configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ss7-module-config
  namespace: soc-ss7
  labels:
    app.kubernetes.io/name: ss7-module
    app.kubernetes.io/component: ss7-signaling
    app.kubernetes.io/part-of: soc-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  # SS7 Collector Configuration
  SS7_COLLECTOR_INTERFACE: "eth0"
  SS7_COLLECTOR_PCAP_BUFFER_SIZE: "512MB"
  SS7_COLLECTOR_FILTER: "m3ua or sccp or tcap or map or isup or diameter"
  
  # SS7 Analyzer Configuration
  SS7_ANALYZER_RULES_PATH: "/etc/ss7/rules"
  SS7_ANALYZER_OUTPUT_FORMAT: "json"
  SS7_ANALYZER_KAFKA_TOPIC: "ss7.signaling"
  SS7_ANALYZER_ALERT_THRESHOLD: "high"
  
  # Diameter Monitor Configuration
  DIAMETER_MONITOR_ORIGIN_HOST: "soc.djezzy.dz"
  DIAMETER_MONITOR_ORIGIN_REALM: "djezzy.dz"
  DIAMETER_MONITOR_VENDOR_ID: "28608"  # Djezzy vendor ID placeholder
  DIAMETER_MONITOR_PRODUCT_NAME: "Djezzy-SOC-Diameter-Monitor"
  
  # Common Settings
  SS7_MODULE_LOG_LEVEL: "info"
  SS7_MODULE_METRICS_PORT: "9100"
  SS7_MODULE_KAFKA_BROKERS: "soc-kafka-0.soc-events:9092,soc-kafka-1.soc-events:9092,soc-kafka-2.soc-events:9092"
  # ANRT Compliance
  SS7_MODULE_ANRT_LOG_ALL_MESSAGES: "true"
  SS7_MODULE_DATA_RETENTION_DAYS: "2555"

# =============================================================================
# Redis Configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: soc-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    requirepass ${REDIS_PASSWORD}
    maxmemory 4gb
    maxmemory-policy allkeys-lru
    save 900 1
    save 300 10
    save 60 10000
    appendonly yes
    appendfsync everysec
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
    loglevel notice
    databases 16
