# =============================================================================
# Djezzy National SOC Platform - ConfigMaps
# =============================================================================
# Production Configuration | ANRT Compliant | GitOps Ready
# =============================================================================

# =============================================================================
# SOC Platform API Configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: soc-platform-config
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: djezzy-soc
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: soc-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  # Database Configuration
  DATABASE_URL: "postgresql://soc_user:${DB_PASSWORD}@soc-postgresql.soc-backend:5432/soc_platform?schema=public"
  # Redis Configuration
  REDIS_HOST: "soc-redis-master.soc-backend"
  REDIS_PORT: "6379"
  # Kafka Configuration
  KAFKA_BROKERS: "soc-kafka-0.soc-events:9092,soc-kafka-1.soc-events:9092,soc-kafka-2.soc-events:9092"
  KAFKA_CLIENT_ID: "soc-platform-api"
  # Security Settings
  SESSION_SECRET_PLACEHOLDER: "${SESSION_SECRET}"
  JWT_SECRET_PLACEHOLDER: "${JWT_SECRET}"
  ENCRYPTION_KEY_PLACEHOLDER: "${ENCRYPTION_KEY}"
  # ANRT Compliance
  ANRT_LOG_LEVEL: "audit"
  ANRT_DATA_RETENTION_DAYS: "2555"  # 7 years per ANRT requirements
  ANRT_AUDIT_ENABLED: "true"
  # Rate Limiting
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "1000"
  # CORS Configuration
  CORS_ALLOWED_ORIGINS: "https://soc.djezzy.dz,https://api.soc.djezzy.dz"
  # Feature Flags
  ENABLE_SS7_MODULE: "true"
  ENABLE_AI_AUTOMATION: "true"
  ENABLE_THREAT_HUNTING: "true"
  ENABLE_GEOMARKETING: "true"

# =============================================================================
# Wazuh SIEM Configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-config
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: wazuh-siem
    app.kubernetes.io/component: siem
    app.kubernetes.io/part-of: soc-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  WAZUH_CLUSTER_NAME: "djezzy-soc-cluster"
  WAZUH_CLUSTER_NODE_NAME: "node-1"
  WAZUH_CLUSTER_NODE_TYPE: "master"
  WAZUH_CLUSTER_KEY: ""
  # Elasticsearch Connection
  WAZUH_ELASTICSEARCH_URL: "https://soc-elasticsearch.soc-backend:9200"
  WAZUH_ELASTICSEARCH_USERNAME: "wazuh"
  WAZUH_ELASTICSEARCH_INDEX_PREFIX: "wazuh-alerts-*"
  # File Integrity Monitoring
  WAZUH_FIM_DIRECTORIES: "/etc,/usr/bin,/usr/sbin,/bin,/sbin,/boot"
  # Rootkit Detection
  WAZUH_ROOTKIT_DETECTION: "yes"
  # Log Collection
  WAZUH_LOG_LEVEL: "info"
  WAZUH_LOG_FORMAT: "json"
  # Active Response
  WAZUH_ACTIVE_RESPONSE: "disabled"
  # ANRT Compliance Logging
  WAZUH_ANRT_AUDIT_LOGGING: "enabled"
  WAZUH_ANRT_RETENTION: "2555d"
  # Custom Rules for Algerian Telecom Threats
  WAZUH_CUSTOM_RULES: |
    <group name="algerian_telecom,">
      <rule id="100001" level="10">
        <if_sid>5501</if_sid>
        <field name="srcip">\.dz$</field>
        <description>Algerian IP Address - Suspicious Activity</description>
      </rule>
      <rule id="100002" level="12">
        <if_sid>5503</if_sid>
        <field name="data.auth.program">ss7|diameter|sigtran</field>
        <description>SS7/Diameter Authentication Attempt</description>
      </rule>
    </group>

# =============================================================================
# TheHive SOAR Configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: thehive-config
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: thehive-soar
    app.kubernetes.io/component: soar
    app.kubernetes.io/part-of: soc-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  THEHIVE_HTTP_PORT: "9000"
  THEHIVE_HTTP_ADDRESS: "0.0.0.0"
  THEHIVE_SECRET_CONFIG: "${THEHIVE_SECRET}"
  # Database
  THEHIVE_DB_PROVIDER: "postgresql"
  THEHIVE_DB_JDBC_URL: "jdbc:postgresql://soc-postgresql.soc-backend:5432/thehive?sslmode=disable"
  # Elasticsearch
  THEHIVE_ES_URL: "http://soc-elasticsearch.soc-backend:9200"
  # Index Configuration
  THEHIVE_INDEX_CONFIG: |
    {
      "index": {
        "number_of_shards": 3,
        "number_of_replicas": 1
      }
    }
  # Playbook Directory
  THEHIVE_PLAYBOOK_DIRECTORY: "/opt/thehive/playbooks"
  # ANRT Compliance
  THEHIVE_AUDIT_ENABLED: "true"
  THEHIVE_CASE_RETENTION_DAYS: "2555"

# =============================================================================
# Cortex Analyzer Configuration
# =============================================================================
