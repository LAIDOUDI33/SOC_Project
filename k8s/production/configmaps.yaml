    argocd.argoproj.io/sync-wave: "1"
data:
  ZEEK_CLUSTER_ENABLED: "false"
  ZEEK_CLUSTERNODE: "worker"
  ZEEK_MANAGERHOSTNAME: "localhost"
  ZEEK_INTERFACE: "eth0"
  ZEEK_LB_METHOD: "custom"
  ZEEK_LB_PROCS: "4"
  # Scripts
  ZEEK_LOCAL_SCRIPTS: |
    @load protocols/ssh/detect-bruteforcing
    @load protocols/http/detect-SQL-injection
    @load frameworks/files/hash-all-files
