# =============================================================================
# MONITORING NAMESPACE - Prometheus Scraping
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: soc-monitoring
  labels:
    app.kubernetes.io/name: djezzy-soc
    app.kubernetes.io/component: network-policy
    policy.djezzy.soc/type: monitoring
  annotations:
    description: "Allow Prometheus to scrape metrics from all namespaces"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector: {}
      podSelector:
        matchExpressions:
        - key: prometheus.io/scrape
          operator: In
          values:
          - "true"
    ports:
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: metrics
    - protocol: TCP
      port: 9100
    - protocol: TCP
      port: 9300

