        matchLabels:
          app.kubernetes.io/name: kong-gateway
    ports:
    - protocol: TCP
      port: 3000

# =============================================================================
# CROSS-NAMESPACE: Allow Metrics Export to Monitoring
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-export
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: djezzy-soc
    app.kubernetes.io/component: network-policy
    policy.djezzy.soc/type: metrics-export
  annotations:
    description: "Export Prometheus metrics to monitoring namespace"
spec:
  podSelector:
    matchLabels:
      prometheus.io/scrape: "true"
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: soc-monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: metrics

# =============================================================================
# SS7 MODULE NAMESPACE - Isolated Network Policies
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all-ingress
  namespace: soc-ss7
  labels:
    app.kubernetes.io/name: djezzy-soc
    app.kubernetes.io/component: network-policy
    policy.djezzy.soc/type: deny-all
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all-egress
  namespace: soc-ss7
  labels:
    app.kubernetes.io/name: djezzy-soc
    app.kubernetes.io/component: network-policy
    policy.djezzy.soc/type: deny-all
spec:
  podSelector: {}
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ss7-internal
  namespace: soc-ss7
  labels:
    app.kubernetes.io/name: djezzy-soc
    app.kubernetes.io/component: network-policy
    policy.djezzy.soc/type: ss7-internal
  annotations:
    description: "SS7 module internal communication - highly isolated"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: ss7-module
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: ss7-module
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: ss7-module
  # Allow SS7 module to send events to Kafka
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: soc-events
      podSelector:
        matchLabels:
          app.kubernetes.io/name: kafka
    ports:
    - protocol: TCP
      port: 9092
  # Allow SS7 module to be scraped by Prometheus
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: soc-monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 9090
