# =============================================================================
# BACKEND NAMESPACE - Database Access Policy
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgresql-access
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: djezzy-soc
    app.kubernetes.io/component: network-policy
    policy.djezzy.soc/type: database-access
  annotations:
    description: "Strict PostgreSQL access control - only allowed services"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  policyTypes:
  - Ingress
  ingress:
  - from:
    # Wazuh SIEM
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: wazuh-manager
    # TheHive SOAR
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: thehive
    # Cortex
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: cortex
    # MISP
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: misp
    # OpenCTI
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: opencti
    # Next.js Application
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: soc-platform-api
    ports:
    - protocol: TCP
      port: 5432

