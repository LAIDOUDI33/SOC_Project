# =============================================================================
# DEFAULT DENY ALL POLICY - Frontend Namespace
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all-ingress
  namespace: soc-frontend
  labels:
    app.kubernetes.io/name: djezzy-soc
    app.kubernetes.io/component: network-policy
    policy.djezzy.soc/type: deny-all
  annotations:
    description: "Default deny all ingress traffic in frontend namespace"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all-egress
  namespace: soc-frontend
  labels:
    app.kubernetes.io/name: djezzy-soc
    app.kubernetes.io/component: network-policy
    policy.djezzy.soc/type: deny-all
  annotations:
    description: "Default deny all egress traffic in frontend namespace"
spec:
  podSelector: {}
  policyTypes:
  - Egress

# =============================================================================
# FRONTEND NAMESPACE - Allow Kong Gateway Ingress
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kong-ingress
  namespace: soc-frontend
  labels:
    app.kubernetes.io/name: djezzy-soc
    app.kubernetes.io/component: network-policy
    policy.djezzy.soc/type: allow-ingress
  annotations:
    description: "Allow ingress from Kong API Gateway"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: soc-platform
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: soc-backend
      podSelector:
        matchLabels:
          app.kubernetes.io/name: kong-gateway
    ports:
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 443

# =============================================================================
# FRONTEND NAMESPACE - Allow Egress to Backend
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: soc-frontend
  labels:
    app.kubernetes.io/name: djezzy-soc
    app.kubernetes.io/component: network-policy
    policy.djezzy.soc/type: allow-egress
  annotations:
    description: "Allow egress from frontend to backend services"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: soc-platform
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: soc-backend
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8443
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: soc-monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 9090

