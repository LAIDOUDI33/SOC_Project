# =============================================================================
# EVENTS NAMESPACE - Kafka Cluster Communication
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-cluster
  namespace: soc-events
  labels:
    app.kubernetes.io/name: djezzy-soc
    app.kubernetes.io/component: network-policy
    policy.djezzy.soc/type: kafka-cluster
  annotations:
    description: "Kafka broker cluster internal communication"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: kafka
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: zookeeper
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: soc-backend
      podSelector:
        matchLabels:
          app.kubernetes.io/part-of: soc-platform
    ports:
    - protocol: TCP
      port: 9092
    - protocol: TCP
      port: 29092
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: zookeeper
    ports:
    - protocol: TCP
      port: 2181
    - protocol: TCP
      port: 2888
    - protocol: TCP
      port: 3888

