# CyberSOC Platform - SIEM Network Policies
# Djezzy Telecom Algeria - Zero-Trust Network Security
# ANRT/ISO27001/GDPR Compliant Network Segmentation

# ============================================
# POLICY 1: Default Deny All Ingress (Zero Trust)
# ============================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cybersoc-siem
  labels:
    policy: zero-trust-deny-all
    severity: critical
    anrt-compliance: mandatory
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
# ============================================
# POLICY 2: Default Deny All Egress (Data Loss Prevention)
# ============================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: cybersoc-siem
  labels:
    policy: zero-trust-deny-all
    severity: critical
    gdpr-compliance: data-prevention
spec:
  podSelector: {}
  policyTypes:
  - Egress

---
# ============================================
# POLICY 3: Allow Elasticsearch Cluster Communication
# ============================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elasticsearch-allow-cluster
  namespace: cybersoc-siem
  labels:
    component: elasticsearch
    purpose: cluster-communication
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: elasticsearch
    ports:
    - protocol: TCP
      port: 9200
    - protocol: TCP
      port: 9300
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: elasticsearch
    ports:
    - protocol: TCP
      port: 9200
    - protocol: TCP
      port: 9300

---
# ============================================
# POLICY 4: Allow Logstash to Elasticsearch
# ============================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logstash-to-elasticsearch
  namespace: cybersoc-siem
  labels:
    component: siem-pipeline
    purpose: data-flow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: logstash
    ports:
    - protocol: TCP
      port: 9200

---
# ============================================
# POLICY 5: Allow Kibana to Elasticsearch
# ============================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kibana-to-elasticsearch
  namespace: cybersoc-siem
  labels:
    component: siem-visualization
    purpose: data-access
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: kibana
    ports:
    - protocol: TCP
      port: 9200

---
# ============================================
# POLICY 6: Allow External Log Sources to Logstash
# ============================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logstash-ingest-from-external
  namespace: cybersoc-siem
  labels:
    component: log-ingestion
    purpose: external-data-collection
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: logstash
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Beats input (Filebeat, Metricbeat, Packetbeat)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cybersoc-monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: filebeat
    ports:
    - protocol: TCP
      port: 5044
    
  # Syslog from network devices (via NodePort or LoadBalancer)
  - from:
    - ipBlock:
        cidr: 10.0.0.0/8  # Internal network
        except:
        - 10.255.255.0/24
    ports:
    - protocol: TCP
      port: 5514
    - protocol: UDP
      port: 5514
      
  # Kafka consumer egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cybersoc-infrastructure
      podSelector:
        matchLabels:
          app.kubernetes.io/name: kafka
    ports:
    - protocol: TCP
      port: 9092

---
# ============================================
# POLICY 7: Correlation Engine Access
# ============================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: correlation-engine-access
  namespace: cybersoc-siem
  labels:
    component: core-siem
    purpose: event-correlation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: siem-correlation-engine
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # API access from SOAR and Analytics services
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cybersoc-soar
      podSelector:
        matchLabels:
          app.kubernetes.io/name: soar-engine
    ports:
    - protocol: TCP
      port: 8080
    
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cybersoc-analytics
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ml-server
    ports:
    - protocol: TCP
      port: 8080
      
  # gRPC access from UEBA service
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cybersoc-analytics
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ueba
    ports:
    - protocol: TCP
      port: 9090
      
  egress:
  # To Elasticsearch
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: elasticsearch
    ports:
    - protocol: TCP
      port: 9200
      
  # To Kafka (alert output)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cybersoc-infrastructure
      podSelector:
        matchLabels:
          app.kubernetes.io/name: kafka
    ports:
    - protocol: TCP
      port: 9092
      
  # To Redis (caching)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cybersoc-infrastructure
      podSelector:
        matchLabels:
          app.kubernetes.io/name: redis-master
    ports:
    - protocol: TCP
      port: 6379

---
# ============================================
# POLICY 8: Kibana External Access (via Ingress)
# ============================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kibana-external-access
  namespace: cybersoc-siem
  labels:
    component: siem-visualization
    purpose: user-interface
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kibana
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # From Ingress Controller
  - from:
    - namespaceSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
      podSelector: {}
    ports:
    - protocol: TCP
      port: 5601
      
  egress:
  # DNS resolution
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---
# ============================================
# POLICY 9: Monitoring & Observability Access
# ============================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scraping
  namespace: cybersoc-siem
  labels:
    purpose: observability
    component: monitoring
spec:
  podSelector: {}  # All pods in namespace
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cybersoc-monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 9114   # Elasticsearch exporter
    - protocol: TCP
      port: 9600   # Logstash metrics
    - protocol: TCP
      port: 8080   # Correlation engine / Rule manager
    - protocol: TCP
      port: 5601   # Kibana health

---
# ============================================
# POLICY 10: DNS Resolution for All SIEM Pods
# ============================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-resolution
  namespace: cybersoc-siem
  labels:
    purpose: infrastructure
    component: dns
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---
# ============================================
# POLICY 11: Cross-Namespace: Analytics → SIEM
# ============================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analytics-to-siem
  namespace: cybersoc-siem
  labels:
    purpose: cross-service
    source: analytics
    destination: siem
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cybersoc-analytics
    ports:
    - protocol: TCP
      port: 9200

---
# ============================================
# POLICY 12: Cross-Namespace: Threat Intel → SIEM
# ============================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: threat-intel-to-siem
  namespace: cybersoc-siem
  labels:
    purpose: cross-service
    source: threat-intel
    destination: siem
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: siem-correlation-engine
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cybersoc-threat-intel
      podSelector:
        matchLabels:
          app.kubernetes.io/name: threat-intel-hub
    ports:
    - protocol: TCP
      port: 8080
