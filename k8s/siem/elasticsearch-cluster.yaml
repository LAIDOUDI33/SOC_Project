  namespace: cybersoc-siem
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/component: warm-data
spec:
  replicas: 2
  serviceName: elasticsearch-siem-warm
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
      app.kubernetes.io/component: warm-data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/component: warm-data
    spec:
      serviceAccountName: siem-sa
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          env:
            - name: node.roles
              value: "data_warm"
            - name: discovery.seed_hosts
              value: "elasticsearch-siem-master-0.elasticsearch-siem-master,elasticsearch-siem-master-1.elasticsearch-siem-master,elasticsearch-siem-master-2.elasticsearch-siem-master"
            - name: cluster.name
              value: "cybersoc-siem-cluster"
            - name: xpack.security.enabled
              value: "true"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: siem-secrets
                  key: elasticsearch-password
            - name: JAVA_OPTS
              value: "-Xms4g -Xmx4g"
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "16Gi"
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      nodeSelector:
        node-type: production
        workload-class: standard
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: premium-ssd
        resources:
          requests:
            storage: "1Ti"

---
# Elasticsearch Cold Tier (Archive)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch-siem-cold
  namespace: cybersoc-siem
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/component: cold-data
spec:
  replicas: 1
  serviceName: elasticsearch-siem-cold
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
      app.kubernetes.io/component: cold-data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/component: cold-data
    spec:
      serviceAccountName: siem-sa
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: node.roles
              value: "data_cold"
            - name: discovery.seed_hosts
              value: "elasticsearch-siem-master-0.elasticsearch-siem-master"
            - name: cluster.name
              value: "cybersoc-siem-cluster"
            - name: xpack.security.enabled
              value: "true"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: siem-secrets
                  key: elasticsearch-password
            - name: JAVA_OPTS
              value: "-Xms2g -Xmx2g"
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      nodeSelector:
        node-type: archive
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-hdd
        resources:
          requests:
            storage: "5Ti"

---
# Kibana for SIEM Visualization & Analysis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana-siem
  namespace: cybersoc-siem
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: cybersoc-siem
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: siem-sa
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.11.0
          ports:
            - name: http
              containerPort: 5601
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "https://elasticsearch-siem-master.cybersoc-siem.svc.cluster.local:9200"
            - name: ELASTICSEARCH_USERNAME
              value: "kibana_system"
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: siem-secrets
                  key: kibana-password
            - name: SERVER_NAME
              value: "kibana.soc.djezzy.dz"
            - name: SERVER_PUBLICBASEURL
              value: "https://kibana.soc.djezzy.dz"
            - name: XPACK_SECURITY_ENCRYPTIONKEY
              valueFrom:
                secretKeyRef:
                  name: siem-secrets
                  key: xpack-encryption-key
            - name: I18N_LOCALE
              value: "fr-DZ"  # Algerian French locale
            - name: XPACK_FLEET_ENABLED
              value: "true"
            - name: XPACK_Siem_ENABLED
              value: "true"
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          livenessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 60
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 30
            periodSeconds: 10
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kibana
                topologyKey: kubernetes.io/hostname
