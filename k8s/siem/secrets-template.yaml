# =============================================================================
# CyberSOC Platform - SIEM Secrets Template
# ⚠️  IMPORTANT: Encrypt before applying to production!
# Use: sops --encrypt --kms "arn:aws:kms:region:account:key" secrets.yaml
# Target: Djezzy Telecom Algeria - ANRT Compliant
# =============================================================================

---
# SIEM Secrets (All sensitive configuration)
apiVersion: v1
kind: Secret
metadata:
  name: siem-secrets
  namespace: cybersoc-siem
  labels:
    app.kubernetes.io/part-of: cybersoc-siem
type: Opaque
stringData:
  # Elasticsearch Credentials
  elasticsearch-password: "${ES_PASSWORD}"  # Generate: openssl rand -base64 32
  kibana-password: "${KIBANA_PASSWORD}"
  logstash-password: "${LOGSTASH_PASSWORD}"
  filebeat-password: "${FILEBEAT_PASSWORD}"
  metricbeat-password: "${METRICBEAT_PASSWORD}"
  packetbeat-password: "${PACKETBEAT_PASSWORD}"
  
  # Kafka SASL Credentials (from logging namespace)
  kafka-sasl-username: "${KAFKA_SASL_USER}"
  kafka-sasl-password: "${KAFKA_SASL_PASS}"
  
  # Redis Password
  redis-password: "${REDIS_PASSWORD}"
  
  # Splunk HEC Token
  splunk-hec-token: "${SPLUNK_HEC_TOKEN}"
  
  # Alerting Integrations
  slack-webhook-url: "${SLACK_WEBHOOK_URL}"
  teams-webhook-url: "${TEAMS_WEBHOOK_URL}"
  pagerduty-service-key: "${PAGERDUTY_KEY}"
  
  # SMTP for Email Alerts
  smtp-username: "${SMTP_USER}"
  smtp-password: "${SMTP_PASS}"
  
  # X-Pack Encryption Key (for Kibana)
  xpack-encryption-key: "${XPACK_KEY}"  # Must be 32+ characters
  
  # ANRT Compliance Keys
  anrt-reporting-api-key: "${ANRT_API_KEY}"
  anrt-audit-signing-key: "${AUDIT_SIGNING_KEY}"

---
# Instructions for Secrets Generation
# ====================================
# 
# 1. Generate strong passwords:
#    ES_PASSWORD=$(openssl rand -base64 32)
#    KIBANA_PASSWORD=$(openssl rand -base64 32)
#    etc.
#
# 2. For Kafka credentials, use existing logging namespace secrets:
#    kubectl get secret kafka-sasl-users -n logging -o jsonpath='{.data.username}' | base64 -d
#
# 3. For Splunk, obtain HEC token from Splunk admin:
#    Settings > Data Inputs > HTTP Event Collector > New Token
#
# 4. For Slack/Teams, create incoming webhooks:
#    Slack: https://api.slack.com/apps
#    Teams: https://teams.microsoft.com/apps
#
# 5. Encrypt with SOPS before committing:
#    sops --encrypt --kms "arn:aws:kms:eu-west-1:123456789012:key/xyz" siem-secrets.yaml > siem-secrets.enc.yaml
#
# 6. Apply to cluster:
#    kubectl apply -f siem-secrets.enc.yaml
#
# NEVER commit unencrypted secrets to version control!
