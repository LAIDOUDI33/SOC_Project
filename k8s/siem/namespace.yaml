# CyberSOC Platform - SIEM Namespace
# Target: Djezzy Telecom Algeria (ANRT/ISO27001/GDPR Compliant)
# Phase: Security Information & Event Management

apiVersion: v1
kind: Namespace
metadata:
  name: cybersoc-siem
  labels:
    app.kubernetes.io/name: cybersoc-platform
    app.kubernetes.io/component: siem
    app.kubernetes.io/part-of: djezzy-telecom
    app.kubernetes.io/managed-by: kubernetes
    security.djezzy.dz/compliance: anrt-iso27001-gdpr
    security.djezzy.dz/classification: confidential
    environment: production
    region: algeria-dz
  annotations:
    description: "CyberSOC SIEM Namespace - Djezzy Telecom Algeria"
    contact: "soc-team@djezzy.dz"
    compliance-framework: "ANRT Telecom Security | ISO27001:2022 | GDPR EU Data Protection"
---
# Resource Quota for SIEM Namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: siem-resource-quota
  namespace: cybersoc-siem
spec:
  hard:
    requests.cpu: "20"
    requests.memory: "40Gi"
    limits.cpu: "40"
    limits.memory: "80Gi"
    persistentvolumeclaims: "15"
    pods: "30"
    services: "20"
    secrets: "25"
    configmaps: "20"
---
# Limit Range for SIEM Namespace
apiVersion: v1
kind: LimitRange
metadata:
  name: siem-limit-range
  namespace: cybersoc-siem
spec:
  limits:
  - type: Container
    default:
      cpu: "2"
      memory: "4Gi"
    defaultRequest:
      cpu: "500m"
      memory: "1Gi"
    max:
      cpu: "8"
      memory: "16Gi"
    min:
      cpu: "100m"
      memory: "128Mi"
