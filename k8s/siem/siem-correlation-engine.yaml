# CyberSOC Platform - SIEM Correlation Engine
# Djezzy Telecom Algeria - Real-time Event Correlation & Analysis
# Core intelligence engine for multi-source log correlation

apiVersion: apps/v1
kind: Deployment
metadata:
  name: siem-correlation-engine
  namespace: cybersoc-siem
  labels:
    app.kubernetes.io/name: siem-correlation-engine
    app.kubernetes.io/component: core-siem
    app.kubernetes.io/part-of: djezzy-telecom
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: siem-correlation-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: siem-correlation-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: elasticsearch-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
      - name: init-rules-db
        image: busybox:1.36
        command: ['sh', '-c', 'chmod -R 755 /rules && ls -la /rules']
        volumeMounts:
        - name: rules-volume
          mountPath: /rules
      containers:
      - name: correlation-engine
        image: cybersoc/correlation-engine:v2.1.0-djezzy
        ports:
        - containerPort: 8080
          name: api
          protocol: TCP
        - containerPort: 9090
          name: grpc
          protocol: TCP
        env:
        - name: CORRELATION_ENGINE_MODE
          value: "production"
        - name: ELASTICSEARCH_URL
          value: "http://elasticsearch.cybersoc-siem.svc.cluster.local:9200"
        - name: KAFKA_BROKERS
          value: "kafka.cybersoc-infrastructure.svc.cluster.local:9092"
        - name: REDIS_URL
          value: "redis-master.cybersoc-infrastructure.svc.cluster.local:6379"
        - name: POSTGRES_URL
          value: "jdbc:postgresql://postgres.cybersoc-infrastructure.svc.cluster.local:5432/siem_db"
        - name: ANALYTICS_ML_SERVICE
          value: "ml-server.cybersoc-analytics.svc.cluster.local:8001"
        - name: UEBA_SERVICE
          value: "ueba.cybersoc-analytics.svc.cluster.local:8003"
        - name: ANRT_COMPLIANCE_ENABLED
          value: "true"
        - name: GDPR_DATA_PROTECTION
          value: "true"
        - name: DJEZZY_TENANT_ID
          value: "djezzy-telecom-algeria"
        - name: LOG_LEVEL
          value: "INFO"
        - name: CORRELATION_WINDOW_SEC
          value: "300"
        - name: MAX_CORRELATION_RULES
          value: "10000"
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "6"
            memory: "12Gi"
        volumeMounts:
        - name: rules-volume
          mountPath: /rules
          readOnly: true
        - name: config-volume
          mountPath: /config
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
      volumes:
      - name: rules-volume
        persistentVolumeClaim:
          claimName: siem-rules-pvc
      - name: config-volume
        configMap:
          name: siem-correlation-config
---
apiVersion: v1
kind: Service
metadata:
  name: siem-correlation-engine
  namespace: cybersoc-siem
  labels:
    app.kubernetes.io/name: siem-correlation-engine
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: siem-correlation-engine
  ports:
  - port: 8080
    targetPort: 8080
    name: api
    protocol: TCP
  - port: 9090
    targetPort: 9090
    name: grpc
    protocol: TCP
---
# Horizontal Pod Autoscaler for Correlation Engine
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: siem-correlation-hpa
  namespace: cybersoc-siem
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: siem-correlation-engine
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 120
---
# PVC for Correlation Rules Storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: siem-rules-pvc
  namespace: cybersoc-siem
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: managed-premium
  resources:
    requests:
      storage: 50Gi
---
# Correlation Engine Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: siem-correlation-config
  namespace: cybersoc-siem
data:
  engine.yaml: |
    # CyberSOC SIEM Correlation Engine Configuration
    # Djezzy Telecom Algeria Production Instance
    
    engine:
      instance_id: "cybersoc-siem-djezzy-001"
      environment: production
      tenant: djezzy-telecom-algeria
      
    correlation:
      # Time windows for event correlation (seconds)
      windows:
        immediate: 30       # Immediate threat detection
        short: 300          # 5 minutes - session-based attacks
        medium: 1800        # 30 minutes - campaign detection
        long: 86400         # 24 hours - APT/insider threats
        
      # Maximum events to correlate in a single window
      max_events_per_window: 50000
      
      # Parallelism settings
      worker_count: 16
      batch_size: 1000
      
    sources:
      elasticsearch:
        enabled: true
        hosts: ["elasticsearch.cybersoc-siem.svc.cluster.local:9200"]
        indices_pattern: "cybersoc-*"
        scroll_timeout: 5m
        
      kafka:
        enabled: true
        brokers: ["kafka.cybersoc-infrastructure.svc.cluster.local:9092"]
        topics:
          - firewall-logs
          - ids-alerts
          - telecom-events
          - authentication
          - dns-queries
          - proxy-logs
          - endpoint-telemetry
        consumer_group: "correlation-engine-consumers"
        
      analytics_services:
        ml_server:
          url: "http://ml-server.cybersoc-analytics.svc.cluster.local:8001"
          enabled: true
        ueba:
          url: "http://ueba.cybersoc-analytics.svc.cluster.local:8003"
          enabled: true
        predictive:
          url: "http://predictive-analytics.cybersoc-analytics.svc.cluster.local:8002"
          enabled: true
    
    output:
      alerts:
        kafka_topic: "siem-alerts"
        elasticsearch_index: "cybersoc-alerts"
        webhook_url: "http://soar-engine.cybersoc-soar.svc.cluster.local:8080/webhook/alert"
        
      metrics:
        prometheus_port: 8080
        enable_histograms: true
    
    anrt_compliance:
      enabled: true
      audit_log_enabled: true
      data_retention_days: 365
      regulatory_reporting: true
      lawful_intercept_support: true
      
    gdpr_protection:
      enabled: true
      pii_fields:
        - imsi
        - msisdn
        - subscriber_name
        - email_address
        - national_id
      masking_strategy: partial_hash
      data_minimization: true
      
    telecom_specific:
      ss7_monitoring:
        enabled: true
        monitored_operations:
          - sendAuthenticationInfo
          - provideSubscriberInfo
          - registerSS
          - insertSubscriberData
          
      diameter_monitoring:
        enabled: true
        monitored_commands:
          - CCR (Credit-Control-Request)
          - DAR (Disconnect-Answer-Request)
          - ASR (Abort-Session-Request)
          
      fraud_detection:
        enabled: true
        integration_ueba: true
        irgs_alerting: true
