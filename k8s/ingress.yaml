# ============================================================
# National SOC Platform - Ingress
# External access configuration for Djezzy Production
# Supports: NGINX Ingress Controller, Traefik, or AWS ALB
# ============================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: soc-platform-ingress
  namespace: soc-platform
  labels:
    app.kubernetes.io/name: soc-platform
    app.kubernetes.io/component: ingress
  annotations:
    # NGINX Ingress Controller specific annotations
    
    # SSL/TLS Configuration
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # Security Headers (OWASP + CIS)
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security max-age=63072000; includeSubDomains; preload";
      more_set_headers "X-Frame-Options SAMEORIGIN";
      more_set_headers "X-Content-Type-Options nosniff";
      more_set_headers "X-XSS-Protection 1; mode=block";
      more_set_headers "Referrer-Policy strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy camera=(), microphone=(), geolocation=()";
    
    # Rate Limiting (DDoS Protection)
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "100"
    nginx.ingress.kubernetes.io/limit-rpm: "3000"
    
    # Request Size Limits
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    
    # Timeouts for different endpoints
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"  # For SSE streaming
    
    # WebSocket/SSE Support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
    
    # Buffering off for SSE
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    
    # Real IP forwarding
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/compute-full-forwarded-for: "true"
    
    # Enable CORS if needed for API access
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Requested-With, Accept, Origin"
    
    # Rewrite rules
    nginx.ingress.kubernetes.io/rewrite-target: /
    
    # Ingress class (for multiple ingress controllers)
    kubernetes.io/ingress.class: "nginx"
    
    # Cert-manager annotation for automatic TLS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # or "djezzy-internal-ca"

spec:
  # TLS Configuration
  tls:
    - hosts:
        - soc.djezzy.dz
        - "*.soc.djezzy.dz"
      secretName: soc-tls-secret  # Use cert-managed secret
  
  # Routing Rules
  rules:
    # Main domain - Djezzy production
    - host: soc.djezzy.dz
      http:
        paths:
          # Main application
          - path: /
            pathType: Prefix
            backend:
              service:
                name: soc-platform-service
                port:
                  number: 80
          
          # API endpoints
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: soc-platform-service
                port:
                  number: 80
          
          # SSE Streaming (special handling)
          - path: /api/stream
            pathType: Prefix
            backend:
              service:
                name: soc-platform-service
                port:
                  number: 80

    # Wildcard subdomain support
    - host: "*.soc.djezzy.dz"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: soc-platform-service
                port:
                  number: 80

    # Fallback for internal/development access
    - host: ""
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: soc-platform-service
                port:
                  number: 80

---
