apiVersion: v2
name: soc-platform
description: |
  CyberSOC Platform - AI-Native Security Operations Center Operating System
  Production Helm Chart for Kubernetes Deployment
  41 Modules | 97 Sections | Enterprise-Grade Security | ANRT Compliant

type: application
version: 1.0.0
appVersion: "2.0.0"

keywords:
  - soc
  - security
  - siem
  - soar
  - threat-intelligence
  - cybersecurity
  - djezzy
  - anrt
  - telecom
  - ai-native
  - ml-security

maintainers:
  - name: CyberSOC Platform Team
    email: soc-platform@djezzy.dz
    url: https://soc.djezzy.dz

home: https://github.com/LAIDOUDI33/SOC_Project
sources:
  - https://github.com/LAIDOUDI33/SOC_Project

dependencies:
  - name: postgresql
    version: "15.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "18.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: elasticsearch
    version: "19.x"
    repository: https://charts.bitnami.com/bitnami
    condition: elasticsearch.enabled
  - name: kafka
    version: "28.x"
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled
  - name: prometheus
    version: "25.x"
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.prometheus.enabled
  - name: grafana
    version: "7.x"
    repository: https://grafana.github.io/helm-charts
    condition: monitoring.grafana.enabled

annotations:
  category: "Security"
  licenses: "Proprietary"
  anrt.compliance: "telecom-regulation"
  security.classification: "critical-infrastructure"
