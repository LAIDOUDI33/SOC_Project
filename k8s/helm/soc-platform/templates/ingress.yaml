{{/*
=============================================================================
CyberSOC Platform - Ingress Configuration
Multi-domain TLS Termination | Rate Limiting | WAF Ready
=============================================================================
*/}}
{{- if .Values.socPlatform.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "soc-platform.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soc-platform.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.socPlatform.ingress.annotations | nindent 4 }}
    # Security Headers via Ingress
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss: https:;
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=()";
spec:
  ingressClassName: {{ .Values.socPlatform.ingress.className }}
  {{- if .Values.socPlatform.ingress.tls }}
  tls:
    {{- range .Values.socPlatform.ingress.tls }}
    - hosts:
        {{- toYaml .hosts | nindent 8 }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.socPlatform.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "soc-platform.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
---
# API Gateway Ingress (Separate domain for API traffic)
{{- if .Values.socPlatform.apiIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "soc-platform.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soc-platform.labels" . | nindent 4 }}
    ingress-type: api-gateway
  annotations:
    {{- toYaml .Values.socPlatform.apiIngress.annotations | nindent 4 }}
    nginx.ingress.kubernetes.io/rate-limit: "true"
    nginx.ingress.kubernetes.io/rate-limit-requests: "1000"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-API-Key, X-Request-ID"
spec:
  ingressClassName: {{ .Values.socPlatform.apiIngress.className | default .Values.socPlatform.ingress.className }}
  {{- if .Values.socPlatform.apiIngress.tls }}
  tls:
    {{- range .Values.socPlatform.apiIngress.tls }}
    - hosts:
        {{- toYaml .hosts | nindent 8 }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.socPlatform.apiIngress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "soc-platform.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
{{- end }}
