{{/*
=============================================================================
CyberSOC Platform - Secrets Template
NOTE: Use External Secrets Operator or Vault in Production!
This template is for development/staging only.
=============================================================================
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "soc-platform.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soc-platform.labels" . | nindent 4 }}
    sensitive: "true"
type: Opaque
{{- if .Values.security.secrets.externalSecrets }}
# Using External Secrets Operator for production
{{- else }}
stringData:
  # Database Credentials
  database-url: {{ .Values.socPlatform.config.databaseUrl | default "postgresql://soc:soc@postgresql:5432/cybersoc?schema=public" }}
  
  # Redis Connection
  redis-url: {{ .Values.socPlatform.config.redisUrl | default "redis://redis-master:6379" }}
  
  # Authentication Secrets
  jwt-secret: {{ .Values.socPlatform.secrets.jwtSecret | default "change-me-in-production-super-secret-jwt-key-min-32-chars" }}
  encryption-key: {{ .Values.socPlatform.secrets.encryptionKey | default "change-me-in-production-aes-256-encryption-key" }}
  
  # API Keys (External Integrations)
  thehive-api-key: {{ .Values.socPlatform.secrets.thehiveApiKey | default "" }}
  cortex-api-key: {{ .Values.socPlatform.secrets.cortexApiKey | default "" }}
  misp-api-key: {{ .Values.threatIntel.config.feeds[0].apiKey | default "" }}
  
  # OAuth/SAML Configuration (if applicable)
  oauth-client-id: {{ .Values.socPlatform.secrets.oauthClientId | default "" }}
  oauth-client-secret: {{ .Values.socPlatform.secrets.oauthClientSecret | default "" }}
  saml-cert: {{ .Values.socPlatform.secrets.samlCert | default "" }}
  saml-key: {{ .Values.socPlatform.secrets.samlKey | default "" }}
  
  # Monitoring & Alerting
  pagerduty-key: {{ .Values.monitoring.prometheus.alertmanager.config.receivers[0].pagerduty_configs[0].routing_key | default "" }}
  slack-webhook: {{ .Values.monitoring.prometheus.alertmanager.config.receivers[1].slack_configs[0].api_url | default "" }}
  
  # Backup Encryption Key
  backup-encryption-key: {{ .Values.backup.encryption.key | default "change-me-backup-encryption-key" }}
  
  # ANRT Reporting Certificate (if using mTLS)
  anrt-client-certificate: {{ .Values.compliance.anrtReporting.authentication.certificate | default "" }}
  anrt-client-key: {{ .Values.compliance.anrtReporting.authentication.key | default "" }}
{{- end }}
---
{{/*
External Secrets Operator Resource (for production use)
*/}}
{{- if .Values.security.secrets.externalSecrets }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "soc-platform.fullname" . }}-vault-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soc-platform.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.security.secrets.vaultAddress | default "https://vault.vault.svc.cluster.local:8200" }}
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "cybersoc-app"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "soc-platform.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soc-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ include "soc-platform.fullname" . }}-vault-backend
    kind: SecretStore
  target:
    name: {{ include "soc-platform.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: cybersoc/database
        property: url
    - secretKey: redis-url
      remoteRef:
        key: cybersoc/redis
        property: url
    - secretKey: jwt-secret
      remoteRef:
        key: cybersoc/auth
        property: jwt-secret
    - secretKey: encryption-key
      remoteRef:
        key: cybersoc/auth
        property: encryption-key
    - secretKey: thehive-api-key
      remoteRef:
        key: cybersoc/integrations/thehive
        property: api-key
    - secretKey: misp-api-key
      remoteRef:
        key: cybersoc/integrations/misp
        property: api-key
{{- end }}
