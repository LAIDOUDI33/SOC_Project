{{/*
=============================================================================
CyberSOC Platform - Service Account & RBAC
Least Privilege | Minimal Permissions | Audit Trail
=============================================================================
*/}}
{{- if .Values.security.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "soc-platform.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soc-platform.labels" . | nindent 4 }}
  {{- with .Values.security.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.security.serviceAccount.automountServiceAccountToken | default false }}
---
# Role for SOC Platform Pods (Minimal permissions)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "soc-platform.fullname" . }}-pod-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soc-platform.labels" . | nindent 4 }}
rules:
  # Allow reading ConfigMaps (own namespace)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  
  # Allow creating/updating events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  
  # Allow reading pods (for health checks)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "soc-platform.fullname" . }}-pod-binding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soc-platform.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "soc-platform.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "soc-platform.fullname" . }}-pod-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
{{/*
ClusterRole for Cross-Namespace Access (if needed)
*/}}
{{- if .Values.security.rbac.createClusterRole }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "soc-platform.fullname" . }}-cluster-role
  labels:
    {{- include "soc-platform.labels" . | nindent 4 }}
rules:
  # Read access to nodes (limited)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
    resourceNames: []
  
  # Read access to namespaces
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  
  # Persistent volume claims (for backup operations)
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "soc-platform.fullname" . }}-cluster-binding
  labels:
    {{- include "soc-platform.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "soc-platform.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "soc-platform.fullname" . }}-cluster-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
