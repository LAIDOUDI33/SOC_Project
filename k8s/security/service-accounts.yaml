    app.kubernetes.io/component: message-broker
    security.djezzy.dz/criticality: "high"
    security.djezzy.dz/privileged: "false"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-streams-sa
  namespace: soc-events
  labels:
    app.kubernetes.io/name: redis-streams
    app.kubernetes.io/component: stream-processor
    security.djezzy.dz/criticality: "high"
    security.djezzy.dz/privileged: "false"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: event-collector-sa
  namespace: soc-events
  labels:
    app.kubernetes.io/name: event-collector
    app.kubernetes.io/component: data-ingestion
    security.djezzy.dz/data-access: "confidential"
    security.djezzy.dz/privileged: "false"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-aggregator-sa
  namespace: soc-events
  labels:
    app.kubernetes.io/name: log-aggregator
