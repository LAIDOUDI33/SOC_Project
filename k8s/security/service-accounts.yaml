  namespace: soc-monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    security.djezzy.dz/read-only: "true"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-sa
  namespace: soc-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    security.djezzy.dz/read-only: "true"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager-sa
  namespace: soc-monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: alerting
    security.djezzy.dz/privileged: "false"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elasticsearch-exporter-sa
  namespace: soc-monitoring
  labels:
    app.kubernetes.io/name: elasticsearch-exporter
    app.kubernetes.io/component: metrics-exporter
    security.djezzy.dz/read-only: "true"
automountServiceAccountToken: true

# ============================================
# SECURITY-SPECIFIC SERVICE ACCOUNTS
# ============================================

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth-delegator
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: hashicorp-vault
    app.kubernetes.io/component: secrets-management
    security.djezzy.dz/sensitive: "true"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-scanner-sa
  namespace: soc-monitoring
  labels:
    app.kubernetes.io/name: security-scanner
    app.kubernetes.io/component: vulnerability-scanner
    security.djezzy.dz/audit-capable: "true"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-log-reader-sa
  namespace: soc-monitoring
  labels:
    app.kubernetes.io/name: audit-reader
    app.kubernetes.io/component: compliance
    security.djezzy.dz/compliance-role: "auditor"
    security.djezzy.dz/audit-retention: "5-years"
automountServiceAccountToken: true

# ============================================
# TRIPWIRE: DETECT OVER-PERMISSIONED SAs
# ============================================

# ResourceQuota to limit SA creation
apiVersion: v1
kind: ResourceQuota
metadata:
  name: service-account-limit
  namespace: soc-backend
spec:
  hard:
    count/serviceaccounts: "20"  # Limit total SAs per namespace
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: service-account-limit
  namespace: soc-frontend
spec:
  hard:
    count/serviceaccounts: "10"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: service-account-limit
  namespace: soc-events
spec:
  hard:
    count/serviceaccounts: "15"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: service-account-limit
  namespace: soc-monitoring
spec:
  hard:
    count/serviceaccounts: "10"
