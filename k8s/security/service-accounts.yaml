# Djezzy National SOC Platform - Service Accounts
# Minimal RBAC Service Accounts with Least Privilege
# Compliance: ANRT, NIST AC-3 (Access Enforcement)
# Version: 1.0.0

# ============================================
# FRONTEND NAMESPACE SERVICE ACCOUNTS
# ============================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-webapp-sa
  namespace: soc-frontend
  labels:
    app.kubernetes.io/name: soc-frontend
    app.kubernetes.io/component: web-application
    security.djezzy.dz/privileged: "false"
automountServiceAccountToken: false  # Don't mount token unless needed
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway-sa
  namespace: soc-frontend
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    security.djezzy.dz/privileged: "false"
automountServiceAccountToken: true
secrets:
  - name: api-gateway-tls-cert
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cdn-cache-sa
  namespace: soc-frontend
  labels:
    app.kubernetes.io/name: cdn-cache
    app.kubernetes.io/component: cache
    security.djezzy.dz/privileged: "false"
automountServiceAccountToken: false

# ============================================
# BACKEND NAMESPACE SERVICE ACCOUNTS
# ============================================

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: core-api-sa
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: core-api
    app.kubernetes.io/component: backend-service
    security.djezzy.dz/data-access: "confidential"
    security.djezzy.dz/privileged: "false"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-management-sa
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: incident-management
    app.kubernetes.io/component: business-service
    security.djezzy.dz/data-access: "confidential"
    security.djezzy.dz/privileged: "false"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: threat-intel-sa
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: threat-intelligence
    app.kubernetes.io/component: intelligence-service
    security.djezzy.dz/data-access: "confidential"
    security.djezzy.dz/privileged: "false"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: siem-correlator-sa
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: siem-correlator
    app.kubernetes.io/component: analytics-engine
    security.djezzy.dz/data-access: "restricted"
    security.djezzy.dz/privileged: "false"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: database-migrator-sa
  namespace: soc-backend
  labels:
    app.kubernetes.io/name: database-migrator
    app.kubernetes.io/component: maintenance
    security.djezzy.dz/data-access: "restricted"
    security.djezzy.dz/ephemeral: "true"  # Temporary SA for migrations
automountServiceAccountToken: true

# ============================================
# EVENTS NAMESPACE SERVICE ACCOUNTS
# ============================================

---
