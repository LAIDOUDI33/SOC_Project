# =============================================================================
# CyberSOC Platform - Threat Intelligence Secrets Template
# ⚠️  IMPORTANT: Encrypt before applying to production!
# Target: Djezzy Telecom Algeria - ANRT Compliant
# =============================================================================

---
apiVersion: v1
kind: Secret
metadata:
  name: threat-intel-secrets
  namespace: cybersoc-threat-intel
  labels:
    app.kubernetes.io/part-of: cybersoc-threat-intel
type: Opaque
stringData:
  # Database Credentials
  database-url: "postgresql://threat_intel:${DB_PASSWORD}@postgresql-cybersoc-primary.cybersoc-db.svc.cluster.local:5432/threat_intel"
  
  # JWT Secret for API Authentication
  jwt-secret: "${JWT_SECRET}"  # Generate: openssl rand -base64 64
  
  # TAXII Feed API Keys & Credentials
  cisa-user: "${CISA_USER}"
  cisa-pass: "${CISA_PASS}"
  
  otx-api-key: "${OTX_API_KEY}"  # AlienVault OTX
  
  anomali-key: "${ANOMALI_KEY}"  # Anomali ThreatStream
  
  rf-token: "${RF_TOKEN}"  # Recorded Future
  
  mandiant-key: "${MANDIANT_KEY}"  # Mandiant Advantage
  
  first-user: "${FIRST_USER}"  # FIRST.org
  first-pass: "${FIRST_PASS}"
  
  # ANRT CSIRT Certificate (for national feed)
  anrt-certificate: |
    ${ANRT_CERT_CONTENT}
  
  anrt-private-key: |
    ${ANRT_KEY_CONTENT}

---
# Instructions for Secrets Generation
# ====================================
#
# 1. Generate strong passwords:
#    DB_PASSWORD=$(openssl rand -base64 32)
#    JWT_SECRET=$(openssl rand -base64 64)
#
# 2. Obtain API keys from threat intel providers:
#    - CISA: https://www.cisa.gov/free-tools/services (register for TAXII access)
#    - AlienVault OTX: https://otx.alienvault.com/api (free tier available)
#    - Anomali: https://www.anomali.com/products/threatstream/
#    - Recorded Future: https://www.recordedfuture.com/
#    - Mandiant: https://www.mandiant.com/advantage
#    - FIRST.org: https://first.org/membership/
#
# 3. ANRT National CSIRT:
#    Contact ANRT's CERT-DZ for TAXII endpoint credentials and certificates
#    This is MANDATORY for Algerian telecom operators
#
# 4. Encrypt with SOPS:
#    sops --encrypt --kms "arn:aws:kms:eu-west-1:123456789012:key/xyz" \
#        threat-intel-secrets.yaml > threat-intel-secrets.enc.yaml
#
# NEVER commit unencrypted secrets!
