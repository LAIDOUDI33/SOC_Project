# =============================================================================
# CyberSOC Platform - Threat Intelligence Network Policies (Zero-Trust)
# Target: Djezzy Telecom Algeria
# =============================================================================

---
# Default Deny All Ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cybersoc-threat-intel
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Default Deny All Egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: cybersoc-threat-intel
spec:
  podSelector: {}
  policyTypes:
    - Egress

---
# Allow DNS Egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: cybersoc-threat-intel
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# TAXII Server Network Policy (External access for partners)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taxii-server-netpol
  namespace: cybersoc-threat-intel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: taxii-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # External partner access via Ingress
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 9497
    
    # Internal API Gateway access
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: threat-intel-api-gateway
      ports:
        - protocol: TCP
          port: 8080
  
  egress:
    # Database access
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cybersoc-db
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432

---
# TAXII Client Network Policy (Needs external egress to fetch feeds)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taxii-client-netpol
  namespace: cybersoc-threat-intel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: taxii-client
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: threat-intel-api-gateway
      ports:
        - protocol: TCP
          port: 8080
  
  egress:
    # External TAXII servers (HTTPS)
    - to:
        - namespaceSelector: {}  # Any external destination
      ports:
        - protocol: TCP
          port: 443
    
    # Database
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cybersoc-db
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    
    # Kafka (output IOCs)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: logging
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - protocol: TCP
          port: 9094

---
# STIX Processor & IOC Manager Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stix-ioc-netpol
  namespace: cybersoc-threat-intel
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [stix-processor, ioc-manager]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: threat-intel-api-gateway
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
  
  egress:
    # Elasticsearch
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cybersoc-siem
          podSelector:
            matchLabels:
              app.kubernetes.io/name: elasticsearch
      ports:
        - protocol: TCP
          port: 9200
    
    # Redis (cache)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cybersoc-cache
          podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379

---
# Threat Hunting Platform Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: threat-hunting-netpol
  namespace: cybersoc-threat-intel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: threat-hunting
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: threat-intel-api-gateway
      ports:
        - protocol: TCP
          port: 8083
  
  egress:
    # Elasticsearch (query logs)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cybersoc-siem
          podSelector:
            matchLabels:
              app.kubernetes.io/name: elasticsearch
      ports:
        - protocol: TCP
          port: 9200

---
# API Gateway Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: threat-intel-api-gateway-netpol
  namespace: cybersoc-threat-intel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: threat-intel-api-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # External users via Ingress
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
  
  egress:
    # All internal services
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
