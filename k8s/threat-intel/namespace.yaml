# =============================================================================
# CyberSOC Platform - Threat Intelligence Phase Namespace
# Target: Djezzy Telecom Algeria - ANRT Compliant
# Purpose: External threat intelligence, IOC management, threat hunting
# =============================================================================

---
# Threat Intelligence Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: cybersoc-threat-intel
  labels:
    app.kubernetes.io/name: cybersoc-platform
    app.kubernetes.io/component: threat-intelligence
    app.kubernetes.io/part-of: security-operations
    cybersoc.djezzy.dz/environment: production
    cybersoc.djezzy.dz/department: soc
    cybersoc.djezzy.dz/compliance: anrt
    name: cybersoc-threat-intel
  annotations:
    description: "CyberSOC Threat Intelligence Platform"
    contact: "threat-intel@djezzy.dz"

---
# Resource Quota
apiVersion: v1
kind: ResourceQuota
metadata:
  name: threat-intel-resource-quota
  namespace: cybersoc-threat-intel
spec:
  hard:
    requests.cpu: "16"
    requests.memory: "32Gi"
    limits.cpu: "32"
    limits.memory: "64Gi"
    pods: "30"
    services: "15"
    secrets: "20"
    configmaps: "20"
    persistentvolumeclaims: "10"

---
# Limit Range
apiVersion: v1
kind: LimitRange
metadata:
  name: threat-intel-limit-range
  namespace: cybersoc-threat-intel
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: "4Gi"
      defaultRequest:
        cpu: "200m"
        memory: "512Mi"
      max:
        cpu: "8"
        memory: "16Gi"
