# =============================================================================
# CyberSOC Platform - Analytics Secrets (TEMPLATE)
# =============================================================================
# ⚠️ PRODUCTION SECRETS - DO NOT COMMIT ACTUAL VALUES
# Use: kubectl create secret generic analytics-secrets --from-literal or
# External Secrets Operator with HashiCorp Vault
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: analytics-secrets
  namespace: cybersoc-analytics
  labels:
    app.kubernetes.io/part-of: cybersoc-platform
    app.kubernetes.io/component: analytics
type: Opaque
data:
  # Database Connection (PostgreSQL via PgBouncer)
  # Format: postgresql://user:pass@host:5432/db?schema=public
  database-url: <FROM_VAULT:analytics/database-url>
  
  # Redis Connection (with AUTH)
  # Format: redis://:password@host:6379/0
  redis-url: <FROM_VAULT:analytics/redis-url>
  
  # Kafka SASL Authentication
  kafka-username: <FROM_VAULT:analytics/kafka-username>
  kafka-password: <FROM_VAULT:analytics/kafka-password>
  kafka-sasl-mechanism: "SCRAM-SHA-512"
  
  # Elasticsearch Authentication
  elasticsearch-username: <FROM_VAULT:analytics/es-username>
  elasticsearch-password: <FROM_VAULT:analytics/es-password>
  
  # JWT Secret for Internal Service Auth
  jwt-secret: <GENERATE_JWT_SECRET_64BYTES>
  
  # Encryption Key for PII Data (AES-256)
  encryption-key: <GENERATE_ENCRYPTION_KEY_32BYTES>
  
  # API Keys for External Services
  misp-api-key: <FROM_VAULT:integrations/misp-api-key>
  opencti-api-key: <FROM_VAULT:integrations/opencti-api-key>
  
  # Model Repository Credentials (if using private registry)
  model-registry-username: <FROM_VAULT:registry/username>
  model-registry-password: <FROM_VAULT:registry/password>
  
  # Monitoring/Tracing
  datadog-api-key: <FROM_VAULT:monitoring/datadog-key>  # Optional
---
