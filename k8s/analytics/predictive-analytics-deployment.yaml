# =============================================================================
# CyberSOC Platform - Predictive Analytics Engine
# =============================================================================
# ML-powered threat forecasting and prediction service
# - Threat volume prediction (24h, 7d, 30d horizons)
# - Incident trend forecasting
# - Risk trajectory modeling
# - Resource requirement prediction
#
# Production: 3 replicas, GPU-optional, HA
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictive-analytics-engine
  namespace: cybersoc-analytics
  labels:
    app.kubernetes.io/name: predictive-analytics
    app.kubernetes.io/component: ml-engine
    app.kubernetes.io/part-of: cybersoc-platform
    environment: production
    version: "2.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: predictive-analytics
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: predictive-analytics
        app.kubernetes.io/component: ml-engine
        app.kubernetes.io/part-of: cybersoc-platform
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: analytics-sa
      automountServiceAccountToken: false
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      
      containers:
        - name: predictive-analytics
          image: ghcr.io/laidoudi33/soc-predictive-analytics:2.0.0-production
          imagePullPolicy: Always
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
            - name: grpc
              containerPort: 50052
              protocol: TCP
            - name: metrics
              containerPort: 8002
              protocol: TCP
          
          env:
            - name: NODE_ENV
              value: "production"
            - name: SERVICE_PORT
              value: "8002"
            - name: LOG_LEVEL
              value: "warn"
            
            # Database Connections
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: analytics-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: analytics-secrets
                  key: redis-url
            
            # Kafka for streaming predictions
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: analytics-config
                  key: kafka-brokers
            - name: KAFKA_PREDICTIONS_TOPIC
              value: "analytics.predictions.output"
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: analytics-secrets
                  key: kafka-username
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analytics-secrets
                  key: kafka-password
            
            # Elasticsearch for storing predictions
            - name: ELASTICSEARCH_URL
              valueFrom:
                configMapKeyRef:
                  name: analytics-config
                  key: elasticsearch-url
            - name: ELASTICSEARCH_INDEX
              value: "cybersoc-predictions"
            
            # Model Configuration
            - name: MODEL_PATH
              value: "/models/predictive"
            - name: PREDICTION_HORIZONS
              value: "24h,7d,30d"
            - name: CONFIDENCE_THRESHOLD
              value: "0.7"
            - name: BATCH_SIZE
              value: "1000"
            - name: MAX_CONCURRENT_PREDICTIONS
              value: "10"
          
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "8000m"
              memory: "16Gi"
          
          # Liveness Probe
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          
          # Readiness Probe
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          volumeMounts:
            - name: models-volume
              mountPath: /models
              readOnly: true
            - name: tmp-dir
              mountPath: /tmp
            - name: cache-dir
              mountPath: /.cache
          
          # GPU resource request (optional)
          # resources:
          #   limits:
          #     nvidia.com/gpu: 1
      
      volumes:
        - name: models-volume
          persistentVolumeClaim:
            claimName: analytics-models-pvc
        - name: tmp-dir
          emptyDir: {}
        - name: cache-dir
          emptyDir:
            sizeLimit: "2Gi"
      
      nodeSelector:
        node-type: production
        workload-class: ml-inference
      
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "ml-workloads"
          effect: NoSchedule
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - predictive-analytics
                topologyKey: kubernetes.io/hostname
      
      terminationGracePeriodSeconds: 120
      priorityClassName: high-priority
---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: predictive-analytics-hpa
  namespace: cybersoc-analytics
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: predictive-analytics-engine
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    - type: Pods
      pods:
        metric:
          name: prediction_queue_depth
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 120
---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: predictive-analytics-pdb
  namespace: cybersoc-analytics
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: predictive-analytics
