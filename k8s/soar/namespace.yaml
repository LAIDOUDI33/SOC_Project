# CyberSOC Platform - SOAR Namespace
# Target: Djezzy Telecom Algeria (ANRT/ISO27001/GDPR Compliant)
# Phase: Security Orchestration, Automation & Response

apiVersion: v1
kind: Namespace
metadata:
  name: cybersoc-soar
  labels:
    app.kubernetes.io/name: cybersoc-platform
    app.kubernetes.io/component: soar
    app.kubernetes.io/part-of: djezzy-telecom
    app.kubernetes.io/managed-by: kubernetes
    security.djezzy.dz/compliance: anrt-iso27001-gdpr
    security.djezzy.dz/classification: confidential
    environment: production
    region: algeria-dz
  annotations:
    description: "CyberSOC SOAR Namespace - Djezzy Telecom Algeria"
    contact: "soc-team@djezzy.dz"
    compliance-framework: "ANRT Telecom Security | ISO27001:2022 | GDPR EU Data Protection"
---
# Resource Quota for SOAR Namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: soar-resource-quota
  namespace: cybersoc-soar
spec:
  hard:
    requests.cpu: "16"
    requests.memory: "32Gi"
    limits.cpu: "32"
    limits.memory: "64Gi"
    persistentvolumeclaims: "10"
    pods: "25"
    services: "15"
    secrets: "20"
    configmaps: "15"
---
# Limit Range for SOAR Namespace
apiVersion: v1
kind: LimitRange
metadata:
  name: soar-limit-range
  namespace: cybersoc-soar
spec:
  limits:
  - type: Container
    default:
      cpu: "2"
      memory: "4Gi"
    defaultRequest:
      cpu: "500m"
      memory: "1Gi"
    max:
      cpu: "8"
      memory: "16Gi"
    min:
      cpu: "100m"
      memory: "128Mi"
