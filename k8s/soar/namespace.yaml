# =============================================================================
# CyberSOC Platform - SOAR Phase Namespace & Configuration
# Target: Djezzy Telecom Algeria - ANRT Compliant
# Purpose: Security Orchestration, Automation, and Response
# =============================================================================

---
# SOAR Namespace with Production Labels
apiVersion: v1
kind: Namespace
metadata:
  name: cybersoc-soar
  labels:
    app.kubernetes.io/name: cybersoc-platform
    app.kubernetes.io/component: soar
    app.kubernetes.io/part-of: security-operations
    cybersoc.djezzy.dz/environment: production
    cybersoc.djezzy.dz/department: soc
    cybersoc.djezzy.dz/compliance: anrt
    name: cybersoc-soar
  annotations:
    description: "CyberSOC Security Orchestration, Automation & Response"
    contact: "soc-ops@djezzy.dz"

---
# Resource Quota - SOAR Workloads (Moderate compute, high I/O)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: soar-resource-quota
  namespace: cybersoc-soar
spec:
  hard:
    # Compute Resources
    requests.cpu: "32"
    requests.memory: "64Gi"
    limits.cpu: "64"
    limits.memory: "128Gi"
    
    # Object Counts
    pods: "50"
    services: "20"
    secrets: "30"
    configmaps: "30"
    persistentvolumeclaims: "15"

---
# Limit Range - Default Container Constraints
apiVersion: v1
kind: LimitRange
metadata:
  name: soar-limit-range
  namespace: cybersoc-soar
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: "4Gi"
      defaultRequest:
        cpu: "250m"
        memory: "512Mi"
      max:
        cpu: "16"
        memory: "32Gi"
      min:
        cpu: "100m"
        memory: "128Mi"

---
# Priority Classes for SOAR Components
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: soar-critical
  namespace: cybersoc-soar
value: 1000000
globalDefault: false
description: "Critical priority for SOAR playbook execution engine"

apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: soar-normal
  namespace: cybersoc-soar
value: 100000
globalDefault: true
description: "Normal priority for SOAR UI and auxiliary services"
