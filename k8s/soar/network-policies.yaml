# =============================================================================
# CyberSOC Platform - SOAR Network Policies (Zero-Trust)
# Target: Djezzy Telecom Algeria
# =============================================================================

---
# Default Deny All Ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cybersoc-soar
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Default Deny All Egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: cybersoc-soar
spec:
  podSelector: {}
  policyTypes:
    - Egress

---
# Allow DNS Egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: cybersoc-soar
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Playbook Engine Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: playbook-engine-netpol
  namespace: cybersoc-soar
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: playbook-engine
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # API Gateway access
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: soar-api-gateway
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 50070
    
    # SIEM alerts input
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cybersoc-siem
          podSelector:
            matchLabels:
              app.kubernetes.io/name: siem-soar-bridge
      ports:
        - protocol: TCP
          port: 8080
    
    # Monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
  
  egress:
    # Database (PostgreSQL)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cybersoc-db
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    
    # Kafka
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: logging
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - protocol: TCP
          port: 9094
    
    # Redis
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cybersoc-cache
          podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    
    # Call SIEM for enrichment
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cybersoc-siem
          podSelector:
            matchLabels:
              app.kubernetes.io/name: sigma-engine
      ports:
        - protocol: TCP
          port: 8080

---
# Incident/Case Manager Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: incident-manager-netpol
  namespace: cybersoc-soar
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [incident-manager, case-manager]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: soar-api-gateway
      ports:
        - protocol: TCP
          port: 8090
        - protocol: TCP
          port: 8091
  
  egress:
    # PostgreSQL
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cybersoc-db
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432

---
# API Gateway Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: soar-api-gateway-netpol
  namespace: cybersoc-soar
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: soar-api-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Ingress controller (external users)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
  
  egress:
    # Internal services
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8090
        - protocol: TCP
          port: 8091

---
# Web UI Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: soar-web-ui-netpol
  namespace: cybersoc-soar
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: soar-web-ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  
  egress:
    # To API Gateway only
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: soar-api-gateway
      ports:
        - protocol: TCP
          port: 8080
