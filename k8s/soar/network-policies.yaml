# CyberSOC Platform - SOAR Network Policies
# Djezzy Telecom Algeria - Zero-Trust Security Architecture

# ============================================
# POLICY 1: Default Deny All Ingress
# ============================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: soar-default-deny-ingress
  namespace: cybersoc-soar
  labels:
    policy: zero-trust-deny-all
    severity: critical
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
# ============================================
# POLICY 2: Default Deny All Egress
# ============================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: soar-default-deny-egress
  namespace: cybersoc-soar
  labels:
    policy: zero-trust-deny-all
    severity: critical
spec:
  podSelector: {}
  policyTypes:
  - Egress

---
# ============================================
# POLICY 3: SOAR Engine API Access
# ============================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: soar-engine-api-access
  namespace: cybersoc-soar
  labels:
    component: core-soar
    purpose: api-access
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: soar-engine
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # SIEM → SOAR (Alert Webhook)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cybersoc-siem
      podSelector:
        matchLabels:
          app.kubernetes.io/name: siem-correlation-engine
    ports:
    - protocol: TCP
      port: 8080
    
  # Threat Intel → SOAR
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cybersoc-threat-intel
      podSelector:
        matchLabels:
          app.kubernetes.io/name: threat-intel-hub
    ports:
    - protocol: TCP
      port: 8080
      
  # Analytics Services → SOAR
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cybersoc-analytics
    ports:
    - protocol: TCP
      port: 8080
      
  egress:
  # To Elasticsearch (SIEM)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cybersoc-siem
      podSelector:
        matchLabels:
          app.kubernetes.io/name: elasticsearch
    ports:
    - protocol: TCP
      port: 9200
      
  # To PostgreSQL (Infrastructure)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cybersoc-infrastructure
      podSelector:
        matchLabels:
          app.kubernetes.io/name: postgres
    ports:
    - protocol: TCP
      port: 5432
      
  # To Redis (Infrastructure)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cybersoc-infrastructure
      podSelector:
        matchLabels:
          app.kubernetes.io/name: redis-master
    ports:
    - protocol: TCP
      port: 6379

---
# ============================================
# POLICY 4: SOAR UI/Portal Access
# ============================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: soar-ui-access
  namespace: cybersoc-soar
  labels:
    component: user-interface
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: soar-portal
  policyTypes:
  - Ingress
  ingress:
  # From Ingress Controller
  - from:
    - namespaceSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
      podSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80

---
# ============================================
# POLICY 5: Monitoring Access
# ============================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: soar-monitoring-access
  namespace: cybersoc-soar
  labels:
    purpose: observability
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cybersoc-monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 8080

---
# ============================================
# POLICY 6: DNS Resolution
# ============================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: soar-dns-resolution
  namespace: cybersoc-soar
  labels:
    purpose: infrastructure
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
