# ============================================================
# National SOC Platform - Horizontal Pod Autoscaler (HPA)
# Auto-scales based on CPU, Memory, and Custom Metrics
# ============================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: soc-platform-hpa
  namespace: soc-platform
  labels:
    app.kubernetes.io/name: soc-platform
    app.kubernetes.io/component: hpa
spec:
  # Target deployment to scale
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: soc-platform
  
  # Scaling limits (adjust based on Djezzy capacity)
  minReplicas: 3
  maxReplicas: 20
  
  # Metrics for scaling decisions
  metrics:
    # CPU utilization (primary metric)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    
    # Memory utilization (secondary metric)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    
    # Custom metric: HTTP requests per second (requires Prometheus adapter)
    # Uncomment when Prometheus metrics adapter is configured
    # - type: Pods
    #   pods:
    #     metric:
    #       name: http_requests_per_second
    #     target:
    #       type: AverageValue
    #       averageValue: "1000"
    
    # Custom metric: Active SSE connections
    # - type: Pods
    #   pods:
    #     metric:
    #       name: active_sse_connections
    #     target:
    #       type: AverageValue
    #       averageValue: "500"
  
  # Scaling behavior configuration
  behavior:
    # Scale up behavior (aggressive for traffic spikes)
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100      # Double pods quickly
          periodSeconds: 60
        - type: Pods
          value: 4        # Or add 4 pods at a time
          periodSeconds: 60
      selectPolicy: Max
    
    # Scale down behavior (conservative to prevent oscillation)
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
        - type: Percent
          value: 10      # Reduce by 10% at a time
          periodSeconds: 120
        - type: Pods
          value: 1        # Remove 1 pod at a time
          periodSeconds: 120
      selectPolicy: Min

---
