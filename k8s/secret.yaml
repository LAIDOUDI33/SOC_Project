# ============================================================
# National SOC Platform - Kubernetes Secret Template
# ⚠️ IMPORTANT: Use sealed-secrets or external secrets in production
# 
# To create this secret:
# kubectl create secret generic soc-platform-secrets \
#   --namespace soc-platform \
#   --from-literal=postgres-password=YOUR_SECURE_PASSWORD \
#   --from-literal=redis-password=YOUR_REDIS_PASSWORD \
#   --from-literal=jwt-secret=YOUR_JWT_SECRET \
#   --from-literal=jwt-refresh-secret=YOUR_REFRESH_SECRET \
#   --from-literal=nextauth-secret=YOUR_NEXTAUTH_SECRET \
#   --from-literal=encryption-key=YOUR_ENCRYPTION_KEY_32_BYTES \
#   --dry-run=client -o yaml | kubectl apply -f -
#
# For production, use:
# - Sealed Secrets (bitnami-labs/sealed-secrets)
# - External Secrets Operator (external-secrets)
# - HashiCorp Vault Injector
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: soc-platform-secrets
  namespace: soc-platform
  labels:
    app.kubernetes.io/name: soc-platform
    app.kubernetes.io/component: secrets
  annotations:
    # This annotation enables automatic rotation with external-secrets
    reflector.v1.k8s.emberstack.io/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.io/auto-reflect: "true"
type: Opaque
stringData:
  # Database Password (PostgreSQL)
  postgres-password: "CHANGE_ME_IN_PRODUCTION"
  
  # Redis Password
  redis-password: "CHANGE_ME_IN_PRODUCTION"
  
  # JWT Secrets (use openssl rand -base64 32 to generate)
  jwt-secret: "CHANGE_ME_IN_PRODUCTION_MIN_32_CHARS"
  jwt-refresh-secret: "CHANGE_ME_IN_PRODUCTION_MIN_32_CHARS"
  
  # NextAuth Secret
  nextauth-secret: "CHANGE_ME_IN_PRODUCTION_MIN_32_CHARS"
  
  # Encryption Key for sensitive data (AES-256, must be 32 bytes)
  encryption-key: "CHANGE_ME_MUST_BE_EXACTLY_32_BYTES!!"
  
  # LDAP Bind Password (if using LDAP auth)
  ldap-bind-password: ""
  
  # SSL/TLS Certificates (if not using cert-manager)
  tls-cert: ""
  tls-key: ""
---
# ============================================================
# TLS Certificate Secret (for Ingress)
# Use cert-manager or manually create with:
# kubectl create secret tls soc-tls-secret \
#   --namespace soc-platform \
#   --cert=path/to/fullchain.pem \
#   --key=path/to/privkey.pem
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: soc-tls-secret
  namespace: soc-platform
  labels:
    app.kubernetes.io/name: soc-platform
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    YOUR_CERTIFICATE_HERE
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    YOUR_PRIVATE_KEY_HERE
    -----END PRIVATE KEY-----
