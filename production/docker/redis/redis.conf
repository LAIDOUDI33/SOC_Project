# 🇩🇿 National SOC - Redis Production Configuration
# Optimized for security and performance

# ────────────────────────────────────────────────────────
# NETWORK SETTINGS
# ────────────────────────────────────────────────────────
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ────────────────────────────────────────────────────────
# MEMORY MANAGEMENT
# ────────────────────────────────────────────────────────
maxmemory 512mb
maxmemory-policy allkeys-lru

# ────────────────────────────────────────────────────────
# PERSISTENCE (RDB Snapshots)
# ────────────────────────────────────────────────────────
save 900 1      # After 900 sec (15 min) if at least 1 key changed
save 300 10     # After 300 sec (5 min) if at least 10 keys changed
save 60 10000   # After 60 sec if at least 10000 keys changed

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ────────────────────────────────────────────────────────
# REPLICATION (For future HA setup)
# ────────────────────────────────────────────────────────
# replicaof <masterip> <masterport>
# masterauth <master-password>
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync yes
repl-diskless-sync-delay 5

# ────────────────────────────────────────────────────────
# SECURITY (CRITICAL)
# ────────────────────────────────────────────────────────
requirepass CHANGE_ME_IN_ENV_FILE
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG ""

# ────────────────────────────────────────────────────────
# CLIENTS
# ────────────────────────────────────────────────────────
maxclients 500

# ────────────────────────────────────────────────────────
# LOGGING
# ────────────────────────────────────────────────────────
loglevel notice
logfile ""

# Slow log - log queries slower than 10ms
slowlog-log-slower-than 10000
slowlog-max-length 128

# ────────────────────────────────────────────────────────
# ADVANCED CONFIG
# ────────────────────────────────────────────────────────
hash-max-listpack-entries 512
hash-max-listpack-value 64
list-max-listpack-size -2
set-max-intset-entries 512
zset-max-listpack-entries 128
zset-max-listpack-value 64
hll-sparse-max-bytes 3000

# Active rehashing (don't block)
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ────────────────────────────────────────────────────────
# LATENCY MONITORING
# ────────────────────────────────────────────────────────
latency-monitor-threshold 100  # Log events > 100ms

# ────────────────────────────────────────────────────────
# EVENT NOTIFICATION (For monitoring)
# ────────────────────────────────────────────────────────
notify-keyspace-events Exg

# ────────────────────────────────────────────────────────
# THREADING
# ────────────────────────────────────────────────────────
io-threads 4
io-threads-do-reads no

# ────────────────────────────────────────────────────────
# KERNEL SETTINGS (Document for sysctl)
# ────────────────────────────────────────────────────────
