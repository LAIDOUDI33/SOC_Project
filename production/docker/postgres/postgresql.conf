# 🇩🇿 National SOC - PostgreSQL Production Configuration
# Optimized for security, performance, and reliability

# ────────────────────────────────────────────────────────
# CONNECTION SETTINGS
# ────────────────────────────────────────────────────────
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# ────────────────────────────────────────────────────────
# MEMORY SETTINGS (Tune based on available RAM)
# ────────────────────────────────────────────────────────
# For 4GB dedicated DB server:
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 512MB

# ────────────────────────────────────────────────────────
# QUERY PLANNER
# ────────────────────────────────────────────────────────
random_page_cost = 1.1  # SSD optimized
effective_io_concurrency = 200
default_statistics_target = 100

# ────────────────────────────────────────────────────────
# WAL (Write-Ahead Logging) CONFIGURATION
# ────────────────────────────────────────────────────────
wal_level = replica
max_wal_senders = 3
wal_keep_size = 1GB
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB

# ────────────────────────────────────────────────────────
# REPLICATION (For future clustering)
# ────────────────────────────────────────────────────────
hot_standby = on
hot_standby_feedback = on

# ────────────────────────────────────────────────────────
# LOGGING & AUDITING (Critical for SOC)
# ────────────────────────────────────────────────────────
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0600
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 100MB

# Log all statements for audit
log_statement = 'all'
log_duration = on
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# ────────────────────────────────────────────────────────
# SECURITY SETTINGS
# ────────────────────────────────────────────────────────
password_encryption = scram-sha-256
ssl = on
ssl_cert_file = 'server.crt'
ssl_key_file = 'server.key'
ssl_ca_file = 'root.crt'

# Require SSL for all connections (uncomment for production)
# hostssl all all 0.0.0.0/0 scram-sha-256

# ────────────────────────────────────────────────────────
# PERFORMANCE TUNING
# ────────────────────────────────────────────────────────
shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.track = all
auto_explain.log_min_duration = 1000  # Log slow queries > 1s

# Parallel query settings
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# ────────────────────────────────────────────────────────
# AUTOVACUUM (Critical for high-volume tables)
# ────────────────────────────────────────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 1000

# ────────────────────────────────────────────────────────
# CLIENT AUTHENTICATION DEFAULTS
# ────────────────────────────────────────────────────────
tcp_keepalives_idle = 300
tcp_keepalives_interval = 100
tcp_keepalives_count = 10

# ────────────────────────────────────────────────────────
# ERROR HANDLING
# ────────────────────────────────────────────────────────
exit_on_error = false
restart_after_crash = on
data_sync_retry = false
