# 🇩🇿 National SOC Production Platform - Docker Compose Stack
# Algeria 2026-2030 | 100% Open Source
# Version: 1.0.0
#
# This compose file defines all infrastructure services for the production SOC platform.
# Each service is configured for security, performance, and reliability.

version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════════════════
  # POSTGRESQL - Primary Database (Production Grade)
  # ═══════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: soc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soc_production}
      POSTGRES_USER: ${POSTGRES_USER:-soc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c log_statement=all
      -c logging_collector=on
      -c log_destination=stderr
      -c shared_preload_libs=pg_stat_statements
    networks:
      - soc-backend
      - soc-database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc_admin} -d ${POSTGRES_DB:-soc_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    labels:
      com.soc.description: "Primary PostgreSQL database for SOC platform"
      com.soc.tier: "data"
      com.soc.backup: "daily"

  # ═══════════════════════════════════════════════════════════════════════
  # REDIS - Cache & Message Broker
  # ═══════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: soc-redis
    restart: unless-stopped
    command: >
      redis-server
      /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD:?Redis password is required}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - soc-backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    labels:
      com.soc.description: "Redis cache and message broker"
      com.soc.tier: "cache"

  # ═══════════════════════════════════════════════════════════════════════
  # NGINX - Reverse Proxy & SSL Termination
  # ═══════════════════════════════════════════════════════════════════════
  nginx:
    image: nginx:alpine
    container_name: soc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      - ssl_certs:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      - postgres
      - redis
    networks:
      - soc-frontend
      - soc-backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'
    labels:
      com.soc.description: "Nginx reverse proxy with SSL termination"
      com.soc.tier: "gateway"

  # ═══════════════════════════════════════════════════════════════════════
  # MINIO - Object Storage (IOC samples, evidence files)
  # ═══════════════════════════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: soc-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MinIO access key is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MinIO secret key is required}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - soc-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    labels:
      com.soc.description: "MinIO object storage for files and evidence"
      com.soc.tier: "storage"

  # ═══════════════════════════════════════════════════════════════════════
  # ADMINER - Database Management UI (Development Only)
  # ═══════════════════════════════════════════════════════════════════════
  adminer:
    image: adminer:latest
    container_name: soc-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - soc-backend
    profiles:
      - development
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    labels:
      com.soc.description: "Database management interface (dev only)"
      com.soc.environment: "development"

  # ═══════════════════════════════════════════════════════════════════════
  # REDIS COMMANDER - Redis Management UI (Development Only)
  # ═══════════════════════════════════════════════════════════════════════
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: soc-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD}
      HTTP_USER: ${REDIS_COMMANDER_USER:-admin}
      HTTP_PASSWORD: ${REDIS_COMMANDER_PASSWORD:-admin123}
    ports:
      - "${REDIS_CMD_PORT:-8081}:8081"
    depends_on:
      - redis
    networks:
      - soc-backend
    profiles:
      - development
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    labels:
      com.soc.description: "Redis management interface (dev only)"
      com.soc.environment: "development"

  # ═══════════════════════════════════════════════════════════════════════
  # MISP - Threat Intelligence Platform
  # ═══════════════════════════════════════════════════════════════════════
  misp:
    image: misp/misp:latest
    container_name: soc-misp
    restart: unless-stopped
    environment:
      - MYSQL_HOST=${MISP_MYSQL_HOST:-soc-misp-db}
      - MYSQL_PORT=${MISP_MYSQL_PORT:-3306}
      - MYSQL_USER=${MISP_MYSQL_USER:-misp}
      - MYSQL_PASSWORD=${MISP_MYSQL_PASSWORD:?MISP database password is required}
      - MISP_ADMIN_EMAIL=${MISP_ADMIN_EMAIL:-admin@algeria-soc.dz}
      - MISP_ADMIN_PASSPHRASE=${MISP_ADMIN_PASSPHRASE:?MISP admin password is required}
      - MISP_BASEURL=${MISP_BASEURL:-https://misp.algeria-soc.dz}
      - REDIS_HOST=${MISP_REDIS_HOST:-soc-misp-redis}
      - REDIS_PORT=${MISP_REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - TZ=Africa/Algiers
    ports:
      - "${MISP_PORT:-8082}:80"
      - "${MISP_SSL_PORT:-8443}:443"
    volumes:
      - misp_data:/var/www/html/MISP/app/files
      - misp_logs:/var/www/html/MISP/app/tmp/logs
      - ./misp/config.php:/var/www/html/MISP/app/config.php:ro
    depends_on:
      - postgres
      - redis
      - misp-db
      - misp-redis
    networks:
      - soc-backend
      - soc-database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/users/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    labels:
      com.soc.description: "MISP threat intelligence platform"
      com.soc.tier: "application"
      com.soc.module: "threat-intel"

  # ═══════════════════════════════════════════════════════════════════════
  # MISP Database (MariaDB for MISP)
  # ═══════════════════════════════════════════════════════════════════════
  misp-db:
    image: mariadb:10.11
    container_name: soc-misp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MISP_MYSQL_ROOT_PASSWORD:?MISP MySQL root password is required}
      MYSQL_DATABASE: ${MISP_MYSQL_DB:-misp}
      MYSQL_USER: ${MISP_MYSQL_USER:-misp}
      MYSQL_PASSWORD: ${MISP_MYSQL_PASSWORD:?MISP database password is required}
    volumes:
      - misp_db_data:/var/lib/mysql
      - ./misp/db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${MISP_MYSQL_PORT:-3307}:3306"
    networks:
      - soc-database
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MISP_MYSQL_USER:-misp} -p${MISP_MYSQL_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    labels:
      com.soc.description: "MariaDB database for MISP"
      com.soc.tier: "data"

  # ═══════════════════════════════════════════════════════════════════════
  # MISP Redis (Dedicated cache for MISP)
  # ═══════════════════════════════════════════════════════════════════════
  misp-redis:
    image: redis:7-alpine
    container_name: soc-misp-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${MISP_REDIS_PASSWORD:-${REDIS_PASSWORD}}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    volumes:
      - misp_redis_data:/data
    networks:
      - soc-database
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${MISP_REDIS_PASSWORD:-${REDIS_PASSWORD}}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    labels:
      com.soc.description: "Redis cache dedicated to MISP"
      com.soc.tier: "cache"

  # ═══════════════════════════════════════════════════════════════════════
  # SURICATA - Network Intrusion Detection System (IDS/IPS)
  # ═══════════════════════════════════════════════════════════════════════
  suricata:
    image: jasonish/suricata:latest
    container_name: soc-suricata
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_NICE
      - NET_RAW
      - IPC_LOCK
    network_mode: host  # Required for packet capture
    volumes:
      - suricata_logs:/var/log/suricata
      - suricata_config:/etc/suricata
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./suricata/rules:/var/lib/suricata/rules:ro
      - suricata_capture:/var/lib/suricata/capture
    environment:
      - SURICATA_INTERFACE=${SURICATA_INTERFACE:-eth0}
      - SURICATA_MODE=${SURICATA_MODE:-ids}
      - TZ=Africa/Algiers
    command: >
      --af-packet
      -i ${SURICATA_INTERFACE:-eth0}
      --set classification-file=/etc/suricata/classification.config
      --set reference-config-file=/etc/suricata/reference.config
      --set threshold-file=/etc/suricata/threshold.conf
      --set rule-files=/var/lib/suricata/rules/*.rules
      --set eve-log.filename=/var/log/suricata/eve.json
      --set eve-log.types=alert,http,dns,tls,files,ssh,smtp,ftp,smb,dhcp
      --set stats.enabled=true
      --set stats.interval=30
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4.0'
        reservations:
          memory: 2G
          cpus: '2.0'
    labels:
      com.soc.description: "Suricata IDS/IPS for network threat detection"
      com.soc.tier: "security"
      com.soc.module: "ids-ips"

# ════════════════════════════════════════════════════════════════════════
# NETWORKS - Network Isolation
# ════════════════════════════════════════════════════════════════════════
networks:
  soc-frontend:
    name: soc-frontend
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

  soc-backend:
    name: soc-backend
    driver: bridge
    internal: true  # No external access
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/16

  soc-database:
    name: soc-database
    driver: bridge
    internal: true  # Isolated database network
    ipam:
      driver: default
      config:
        - subnet: 172.22.0.0/16

# ════════════════════════════════════════════════════════════════════════
# VOLUMES - Persistent Storage
# ════════════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
    name: soc-postgres-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUME_PATH:-./data}/postgres

  redis_data:
    name: soc-redis-data
    driver: local

  minio_data:
    name: soc-minio-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUME_PATH:-./data}/minio

  ssl_certs:
    name: soc-ssl-certs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SSL_PATH:-./ssl}

  nginx_logs:
    name: soc-nginx-logs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LOG_PATH:-./logs}/nginx

  misp_data:
    name: soc-misp-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUME_PATH:-./data}/misp

  misp_db_data:
    name: soc-misp-db-data
    driver: local

  misp_redis_data:
    name: soc-misp-redis-data
    driver: local

  misp_logs:
    name: soc-misp-logs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LOG_PATH:-./logs}/misp

  suricata_logs:
    name: soc-suricata-logs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LOG_PATH:-./logs}/suricata

  suricata_config:
    name: soc-suricata-config
    driver: local

  suricata_capture:
    name: soc-suricata-capture
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUME_PATH:-./data}/suricata/capture
