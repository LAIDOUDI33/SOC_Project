# 🇩🇿 National SOC - Main Server Configuration
# SSL/TLS Termination + Reverse Proxy

# ────────────────────────────────────────────────────────
# HTTP → HTTPS REDIRECT (Force SSL)
# ────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name soc.dz *.soc.dz localhost;

    # Health check endpoint (no redirect)
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ────────────────────────────────────────────────────────
# MAIN HTTPS SERVER
# ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name soc.dz *.soc.dz localhost;

    # Enable TLS 1.3 only (modern, secure)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Certificates (Let's Encrypt or custom)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/ssl/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # SSL Session settings
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Document root
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Security headers
    include /etc/nginx/includes/security-headers.conf;

    # Logging
    access_log /var/log/nginx/soc.access.log security;
    error_log /var/log/nginx/soc.error.log warn;

    # ────────────────────────────────────────────────────
    # HEALTH CHECK ENDPOINT
    # ────────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 '{"status":"healthy","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # ────────────────────────────────────────────────────
    # NEXT.JS APPLICATION (Main Dashboard)
    # ────────────────────────────────────────────────────
    location / {
        limit_req zone=general burst=20 nodelay;
        
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Forward real client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ────────────────────────────────────────────────────
    # API ROUTES (Higher rate limit)
    # ────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API-specific timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;  # Longer for heavy queries
        proxy_read_timeout 120s;
    }

    # ────────────────────────────────────────────────────
    # AUTHENTICATION ENDPOINTS (Strict rate limiting)
    # ────────────────────────────────────────────────────
    location ~ ^/api/auth/.*$ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ────────────────────────────────────────────────────
    # WEBSOCKET (Socket.io Real-time Updates)
    # ────────────────────────────────────────────────────
    location /socket.io/ {
        limit_conn websocket 10;
        
        proxy_pass http://websocket_server;
        proxy_http_version 1.1;
        
        # Required for WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts (long-lived connections)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ────────────────────────────────────────────────────
    # STATIC FILES (Cache aggressively)
    # ────────────────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        
        try_files $uri =404;
    }

    # ────────────────────────────────────────────────────
    # SECURITY: Block sensitive files
    # ────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|gitignore|md|sql|bak|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ────────────────────────────────────────────────────
    # ERROR PAGES
    # ────────────────────────────────────────────────────
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
