# 🇩🇿 National SOC - Nginx Main Configuration
# Production-grade with security hardening

# Run as non-root user
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Worker connections
worker_rlimit_nofile 65535;
events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ────────────────────────────────────────────────────
    # BASIC SETTINGS
    # ────────────────────────────────────────────────────
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with security info
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time $upstream_response_time '
                    '$pipe';

    log_format security '$remote_addr - [$time_local] '
                       '"$request" $status '
                       '"$http_user_agent" '
                       '$http_x_forwarded_for';

    access_log /var/log/nginx/access.log main;

    # ────────────────────────────────────────────────────
    # PERFORMANCE OPTIMIZATION
    # ────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Client body limits (prevent DoS)
    client_max_body_size 50m;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Timeouts
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    # ────────────────────────────────────────────────────
    # GZIP COMPRESSION
    # ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ────────────────────────────────────────────────────
    # RATE LIMITING ZONES
    # ────────────────────────────────────────────────────
    # General requests: 10 req/s per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    
    # Login/auth endpoints: 3 req/min per IP (brute force protection)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/m;
    
    # API endpoints: 30 req/s per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    
    # WebSocket connections: 5 conn/s per IP
    limit_conn_zone $binary_remote_addr zone=websocket:10m;

    # ────────────────────────────────────────────────────
    # UPSTREAM DEFINITIONS (Backend Services)
    # ────────────────────────────────────────────────────
    upstream nextjs_app {
        server host.docker.internal:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream websocket_server {
        server host.docker.internal:3003 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ────────────────────────────────────────────────────
    # SECURITY HEADERS (Included in all locations)
    # ────────────────────────────────────────────────────
    include /etc/nginx/includes/security-headers.conf;

    # ────────────────────────────────────────────────────
    # INCLUDE SERVER CONFIGURATIONS
    # ────────────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
