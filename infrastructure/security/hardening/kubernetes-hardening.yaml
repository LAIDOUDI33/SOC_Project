# ============================================================
# Verify each item before production go-live:
#
# [x] PodSecurityPolicy enforced (restricted profile)
# [x] Default deny-all NetworkPolicy applied
# [x] Explicit allow rules for required traffic
# [x] Resource quotas configured per namespace
# [x] LimitRanges set for container defaults
# [x] ServiceAccount token auto-mount disabled
# [x] ReadOnlyRootFilesystem enabled
# [x] Capabilities dropped (ALL)
# [x] Seccomp/AppArmor profiles configured
# [x] No privileged containers allowed
# [x] Image pull policy set to Always
# [x] Image signatures verified (if using cosign/notary)
# [x] Admission webhooks configured
# [x] Audit logging enabled
# [x] RBAC follows least-privilege principle
# [x] Network segmentation implemented
# [x] TLS enforced for all communications
