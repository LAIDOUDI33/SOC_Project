# ============================================================
# 15. HTTP TO HTTPS REDIRECT
# ============================================================
# Redirect all HTTP traffic to HTTPS.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name soc.djezzy.dz *.soc.djezzy.dz api.soc.djezzy.dz grafana.soc.djezzy.dz;
    
    # Log redirect attempts for analysis
    access_log /var/log/nginx/redirect.log;
    
    # Return 301 permanent redirect to HTTPS
    return 301 https://$host$request_uri;
}

# Let's Encrypt ACME challenge location
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    allow all;
}

