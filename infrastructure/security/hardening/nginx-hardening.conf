# ============================================================
# National SOC Platform - NGINX Security Hardening
# Djezzy Production Environment - CIS Benchmark Compliant
# ============================================================
# This configuration implements comprehensive NGINX security
# measures aligned with:
# - CIS NGINX Benchmark v1.0
# - OWASP Secure Configuration Project
# - ANOR Regulatory Requirements for Telecom Operators
# - NIST Cybersecurity Framework (CSF)
#
# Usage: Include this file in your main nginx.conf
#   include /etc/nginx/conf.d/security/nginx-hardening.conf;
# ============================================================

# ============================================================
# 1. SERVER TOKEN HIDING
# ============================================================
# Prevents NGINX version disclosure in response headers
# and error pages. Essential for security through obscurity.
# ============================================================

server_tokens off;                           # Hide version number
more_set_headers "Server: Djezzy-SOC";       # Custom server header (optional)

# ============================================================
# 2. TLS/SSL CONFIGURATION
# ============================================================
# Enforces strong TLS configuration with modern ciphers.
# TLS 1.3 preferred, TLS 1.2 minimum required.
# ============================================================

# SSL/TLS Protocol Settings
ssl_protocols TLSv1.2 TLSv1.3;              # Only TLS 1.2+ allowed
ssl_prefer_server_ciphers on;                # Use server cipher preference

# Modern cipher suite - prioritizes ECDHE for PFS
# Excludes weak ciphers (RC4, DES, 3DES, MD5, etc.)
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

# Session settings for performance
ssl_session_cache shared:SSL:50m;            # 50MB session cache (~200k sessions)
ssl_session_timeout 1d;                      # Session lifetime
ssl_session_tickets off;                     # Disable tickets (forward secrecy)

# OCSP Stapling - improves certificate validation performance
ssl_stapling on;
ssl_stapling_verify on;
ssl_trusted_certificate /etc/nginx/ssl/ca-bundle.crt;

# DH Parameters - use strong parameters (2048+ bits)
ssl_dhparam /etc/nginx/ssl/dhparams.pem;

# Certificate configuration
ssl_certificate /etc/nginx/ssl/soc.djezzy.dz.crt;
ssl_certificate_key /etc/nginx/ssl/soc.djezzy.dz.key;

# ============================================================
# 3. SECURITY HEADERS
# ============================================================
# Implements OWASP recommended security headers for
# protection against common web vulnerabilities.
# ============================================================

# Content Security Policy (CSP)
# Strict policy preventing XSS, clickjacking, injection attacks
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' wss: https://*.djezzy.dz https://api.djezzy.dz; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; media-src 'self'; manifest-src 'self'" always;

# HTTP Strict Transport Security (HSTS)
# Forces HTTPS connections for 2 years, includes subdomains
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# X-Frame-Options - prevents clickjacking attacks
add_header X-Frame-Options "SAMEORIGIN" always;

# X-Content-Type-Options - prevents MIME sniffing
add_header X-Content-Type-Options "nosniff" always;

# X-XSS-Protection - enables browser XSS filter
add_header X-XSS-Protection "1; mode=block" always;

# Referrer Policy - controls referrer information leakage
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions Policy - controls browser features
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=(), usb=(), magnetometer=(), gyroscope=(), fullscreen=(self)" always;

# Cache-Control for sensitive responses
add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;

# Pragma header for legacy compatibility
add_header Pragma "no-cache" always;

# Cross-Origin policies
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;

# ============================================================
# 4. RATE LIMITING ZONES
# ============================================================
# Defines rate limiting zones for DDoS protection and
# abuse prevention. Multiple zones for different use cases.
# ============================================================

# General request rate limiting (per client IP)
limit_req_zone $binary_remote_addr zone=soc_general_limit:10m rate=100r/s;

# API endpoint rate limiting (stricter)
limit_req_zone $binary_remote_addr zone=soc_api_limit:10m rate=50r/s;

# Authentication endpoint rate limiting (very strict - prevent brute force)
limit_req_zone $binary_remote_addr zone=soc_auth_limit:10m rate=10r/m;

# Login-specific rate limiting (extremely strict)
limit_req_zone $binary_remote_addr zone=soc_login_limit:10m rate=5r/m;

# Connection limiting zone
limit_conn_zone $binary_remote_addr zone=soc_connection_limit:10m;

# WebSocket connection limit
limit_conn_zone $binary_remote_addr zone=soc_ws_limit:10m;

# Upstream request tracking (for backend protection)
limit_req_zone $binary_remote_addr zone=soc_backend_limit:10m rate=200r/s;

# ============================================================
# 5. REQUEST SIZE AND BODY LIMITS
# ============================================================
# Prevents buffer overflow and DoS attacks via large payloads.
# ============================================================

# Maximum request body size
client_max_body_size 10m;                   # Limit upload size

# Buffer size limits to prevent buffer overflow attacks
client_body_buffer_size 128k;               # Body buffer size
client_header_buffer_size 1k;               # Header buffer size

# Maximum sizes for headers to prevent oversized header attacks
large_client_header_buffers 4 16k;          # Max 4 headers of 16KB each

# Body timeout settings
client_body_timeout 30s;                    # Read body timeout
client_header_timeout 15s;                  # Read header timeout

# Request timeout
send_timeout 60s;                           # Response send timeout
keepalive_timeout 65s;                      # Keep-alive timeout
keepalive_requests 1000;                    # Max requests per connection

# Ignore certain headers (prevent header injection)
ignore_invalid_headers on;

# ============================================================
# 6. DDOS PROTECTION SETTINGS
# ============================================================
# Multi-layered DDoS mitigation configuration.
# ============================================================

# Connection throttling
limit_conn soc_connection_limit 50;         # Max concurrent connections per IP

# Rate limiting application
limit_req zone=soc_general_limit burst=200 nodelay;
limit_req_status 429;                       # Return 429 when limited

# Connection delay/rejection for abusive IPs
limit_conn_status 429;

# Real IP resolution (behind load balancer/proxy)
set_real_ip_from 10.0.0.0/8;                # Internal network
set_real_ip_from 172.16.0.0/12;             # Private network
set_real_ip_from 192.168.0.0/16;            # Private network
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ============================================================
# 7. BOT MITIGATION RULES
# ============================================================
# Blocks or limits known malicious bots and crawlers.
# Allows legitimate search engines and monitoring tools.
# ============================================================

# Map for bot detection based on User-Agent
map $http_user_agent $is_bad_bot {
    default 0;
    ~*(bot|crawl|spider|scraper|curl|wget|python|perl) 1;
    ~*Googlebot|bingbot|Baiduspider|YandexBot 0;         # Allow search engines
    ~*Prometheus|UptimeRobot|Pingdom 0;                    # Allow monitoring
}

# Map for malicious user agents
map $http_user_agent $blocked_agent {
    default 0;
    ~*(sqlmap|nikto|nmap|masscan|zgrab|gobuster|dirbuster|wfuzz|hydra|medusa|ncat|nmap) 1;
}

# ============================================================
# 8. WEB SOCKET HARDENING
# ============================================================
# Secure WebSocket configuration for real-time features.
# ============================================================

# WebSocket upgrade handling
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# WebSocket specific timeouts
proxy_read_timeout 86400s;                 # 24 hours for long-lived WS
proxy_send_timeout 86400s;

# WebSocket rate limiting
limit_conn soc_ws_limit 10;                 # Max 10 WS connections per IP

# ============================================================
# 9. WAF-FRIENDLY CONFIGURATION
# ============================================================
# Prepares NGINX for integration with ModSecurity WAF
# or cloud-based WAF services (Cloudflare, AWS WAF).
# ============================================================

# Enable ModSecurity if available (uncomment to activate)
# mod_security on;
# mod_security_rules_file /etc/modsecurity/rules.conf;

# Pass client information to WAF/backend
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Original-URI $request_uri;
proxy_set_header X-SSL-Client-CN $ssl_client_s_dn_cn;
proxy_set_header X-SSL-Client-Verify $ssl_client_verify;

# Proxy buffering for API responses
proxy_buffering on;
proxy_buffer_size 128k;
proxy_buffers 8 128k;
proxy_busy_buffers_size 256k;

# ============================================================
# 10. ACCESS CONTROL DIRECTIVES
# ============================================================
# Restricts access to sensitive endpoints and resources.
# ============================================================

# Block access to hidden files (dotfiles)
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# Block access to sensitive file types
location ~* \.(git|svn|env|conf|ini|log|sh|bak|backup|sql|tar|gz|zip)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# Block common attack patterns in URL
location ~* (\.\./|union.*select|select.*from|insert.*into|delete.*from|drop.*table|update.*set|exec\(|script:) {
    deny all;
    access_log off;
    log_not_found off;
    return 444;                             # Close connection immediately
}

# Health check endpoint (allow without auth, restrict access)
location /api/health {
    allow 10.0.0.0/8;                       # Internal network only
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    
    proxy_pass http://soc-platform:3000;
    
    # No logging for health checks
    access_log off;
}

# Metrics endpoint (restrict to Prometheus)
location /api/metrics {
    allow 10.0.0.0/8;                       # Internal network only
    deny all;
    
    proxy_pass http://soc-platform:3000;
    
    # Basic auth option (uncomment if needed)
    # auth_basic "Prometheus Metrics";
    # auth_basic_user_file /etc/nginx/.htpasswd-metrics;
}

# ============================================================
# 11. LOGGING CONFIGURATION
# ============================================================
# Custom log format for security analysis and SIEM integration.
# ============================================================

# Custom log format for security analysis
log_format security_log escape=json 
    '{"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"remote_user":"$remote_user",'
    '"request":"$request",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"http_referrer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"http_x_forwarded_for":"$http_x_forwarded_for",'
    '"request_id":"$request_id",'
    '"ssl_protocol":"$ssl_protocol",'
    '"ssl_cipher":"$ssl_cipher",'
    '"sent_http_content_type":"$sent_http_content_type"'
    '}';

# Access log location
access_log /var/log/nginx/soc_access.log security_log;
error_log /var/log/nginx/soc_error.log warn;

# Disable logging for static assets
location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|woff|woff2|ttf|eot)$ {
    access_log off;
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
}

# ============================================================
# 12. ERROR PAGE CONFIGURATION
# ============================================================
# Custom error pages that don't leak information.
# ============================================================

# Error pages (generic messages, no stack traces)
error_page 400 /errors/400.html;
error_page 401 /errors/401.html;
error_page 403 /errors/403.html;
error_page 404 /errors/404.html;
error_page 429 /errors/429.html;
error_page 500 502 503 504 /errors/5xx.html;

# Error page location block
location ^~ /errors/ {
    internal;
    root /usr/share/nginx/html;
}

# Suppress errors in error responses (don't expose details)
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
proxy_hide_header X-AspNet-Version;
proxy_hide_header X-AspNetMvc-Version;

