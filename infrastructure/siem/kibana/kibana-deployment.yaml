# =============================================================================
# Djezzy National SOC Platform - Phase 5: SIEM Integration
# Kibana Deployment - Security Analytics Dashboard
# =============================================================================
# Production Kibana with:
# - TLS encryption
# - SSO integration (SAML/OIDC)
# - Custom SOC dashboards
# - Alerting and reporting
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: siem
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/component: siem-ui
    app.kubernetes.io/part-of: djezzy-soc
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
        app.kubernetes.io/component: siem-ui
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: kibana
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: configure-kibana
          image: docker.elastic.co/kibana/kibana:8.12.0
          command:
            - sh
            - -c
            - |
              # Wait for Elasticsearch to be ready
              echo "Waiting for Elasticsearch..."
              until curl -sk https://elasticsearch-client:9200/_cluster/health?local=true --cert /etc/kibana/certs/tls.crt --key /etc/kibana/certs/tls.key --cacert /etc/kibana/certs/ca.crt | grep -q '"status"'; do
                echo "Elasticsearch not ready, waiting 5s..."
                sleep 5
              done
              echo "Elasticsearch is ready!"
              
              # Import saved objects (dashboards, visualizations, etc.)
              if [ -f /usr/share/kibana/config/saved_objects.ndjson ]; then
                echo "Importing saved objects..."
                curl -sk -X POST "https://elasticsearch-client:9200/.kibana/_import?createNewCopies=true" \
                  -H "kbn-xsrf: true" \
                  -H "Content-Type: application/x-ndjson" \
                  --cert /etc/kibana/certs/tls.crt \
                  --key /etc/kibana/certs/tls.key \
                  --cacert /etc/kibana/certs/ca.crt \
                  --data-binary @/usr/share/kibana/config/saved_objects.ndjson
                echo "Saved objects imported!"
              fi
          volumeMounts:
            - name: certs
              mountPath: /etc/kibana/certs
              readOnly: true
            - name: saved-objects
              mountPath: /usr/share/kibana/config/saved_objects.ndjson
              subPath: saved_objects.ndjson
              readOnly: true
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.12.0
          ports:
            - name: http
              containerPort: 5601
              protocol: TCP
          env:
            - name: SERVER_NAME
              value: "kibana.soc.djezzy.dz"
            - name: SERVER_BASEPATH
              value: ""
            - name: ELASTICSEARCH_HOSTS
              value: "https://elasticsearch-client:9200"
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: username
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password
            - name: ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES
              value: "/usr/share/kibana/config/certs/ca.crt"
            - name: XPACK_SECURITY_ENABLED
              value: "true"
            - name: XPACK_ENCRYPTEDCOOKIES_KEY
              valueFrom:
                secretKeyRef:
                  name: kibana-secrets
                  key: cookies-key
            - name: XPACK_REPORTING_ENCRYPTIONKEY
              valueFrom:
                secretKeyRef:
                  name: kibana-secrets
                  key: reporting-key
            - name: XPACK_ALERTING_ENCRYPTIONKEY
              valueFrom:
                secretKeyRef:
                  name: kibana-secrets
                  key: alerting-key
            - name: XPACK_ACTIONS_ALLOWEDTYPES
              value: "*.slack,*.email,*.webhook,*.index,*.pagerduty,*.servicenow,*.jira"
            - name: XPACK_FLEET_ENABLED
              value: "true"
            - name: FLEET_INTEGRATIONS_ELASTIC_AGENT_HOST
              value: "https://fleet-server.soc.djezzy.dz:8220"
            - name: i18n.locale
              value: "en"
            - name: TZ
              value: "Africa/Algiers"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /api/status
              port: 5601
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /api/status
              port: 5601
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: certs
              mountPath: /usr/share/kibana/config/certs
              readOnly: true
            - name: kibana-config
              mountPath: /usr/share/kibana/config/kibana.yml
              subPath: kibana.yml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: certs
          secret:
            secretName: elasticsearch-tls-certs
            defaultMode: 0400
        - name: kibana-config
          configMap:
            name: kibana-config
        - name: saved-objects
          configMap:
            name: kibana-saved-objects
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kibana
  namespace: siem
  labels:
    app.kubernetes.io/name: kibana
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: siem
  labels:
    app.kubernetes.io/name: kibana
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kibana
  ports:
    - name: https
      port: 5601
      targetPort: 5601
      protocol: TCP
---
# Kibana Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-config
  namespace: siem
data:
  kibana.yml: |
    # Server settings
    server.host: "0.0.0.0"
    server.port: 5601
    server.basePath: ""
    server.publicBaseUrl: "https://kibana.soc.djezzy.dz"
    server.rewriteBasePath: false
    server.maxPayloadBytes: 1048576
    server.cors: true
    server.cors.origin: ["https://*.soc.djezzy.dz"]
    
    # Elasticsearch connection
    elasticsearch.hosts: ["https://elasticsearch-client:9200"]
    elasticsearch.ssl.verificationMode: certificate
    elasticsearch.ssl.certificateAuthorities: ["/usr/share/kibana/config/certs/ca.crt"]
    elasticsearch.requestTimeout: 120000
    elasticsearch.shardTimeout: 60000
    
    # Logging
    logging.dest: stdout
    logging.verbose: false
    logging.quiet: false
    logging.json: true
    logrotate.enabled: true
    logrotate.everyBytes: 10485760
    logrotate.keepFiles: 10
    
    # Monitoring
    monitoring.ui.container.elasticsearch.enabled: true
    monitoring.kibana.collection.enabled: true
    monitoring.kibana.collection.interval: 15000
    
    # Security
    xpack.security.enabled: true
    xpack.security.encryptionKey: ${XPACK_ENCRYPTEDCOOKIES_KEY}
    xpack.security.secureCookies: true
    xpack.security.sessionTimeout: 28800000  # 8 hours
    xpack.security.session.lifespan: 28800000
    
    # SSO/SAML Configuration (Djezzy AD integration)
    xpack.security.authc:
      providers:
        saml.saml1:
          order: 0
          realm: saml1
          description: "Log in with Djezzy AD"
          saml:
            idp.metadata.path: /usr/share/kibana/config/saml-metadata.xml
            idp.entityId: https://adfs.djezzy.dz/adfs/services/trust
            sp.entityId: https://kibana.soc.djezzy.dz
            sp.acs: https://kibana.soc.djezzy.dz/api/security/saml/callback
            sp.logout: https://kibana.soc.djezzy.dz/logout
            attributes.principal: NameID
            attributes.groups: http://schemas.microsoft.com/ws/2008/06/identity/claims/groups
            signatureAlgorithm: rsa-sha256
            wantAssertionsSigned: true
            wantMessageSigned: true
            wantAssertionEncrypted: true
            maxAuthAge: 86400
            nameIDFormat: urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress
        basic.basic1:
          order: 1
          realm: basic1
          description: "Log in with Username and Password"
    
    # Reporting & Alerting
    xpack.reporting.enabled: true
    xpack.reporting.encryptionKey: ${XPACK_REPORTING_ENCRYPTIONKEY}
    xpack.reporting.csv.maxSizeBytes: 10485760
    xpack.reporting.queue.timeout: 120000
    xpack.alerting.enabled: true
    xpack.alerting.encryptionKey: ${XPACK_ALERTING_ENCRYPTIONKEY}
    xpack.actions.allowedTypes: ["*.slack","*.email","*.webhook","*.index","*.pagerduty","*.servicenow","*.jira"]
    xpack.actions.allowedHosts: ["*"]
    
    # Fleet/Agent Management
    xpack.fleet.enabled: true
    xpack.fleet.agents:
      enabled: true
      elasticsearch.host: "https://elasticsearch-client:9200"
      fleetServerHosts: ["https://fleet-server.soc.djezzy.dz:8220"]
    
    # Maps (for geo visualization)
    xpack.maps.emsFileLicenseApiUrl: https://api.mapbox.com
    xpack.maps.includeElasticMapsService: true
    
    # Dashboard defaults
    dashboard.defaultDarkMode: false
    newsfeed.enabled: false
    regionmap: Algeria
    
    # UI Customization
    uiSettings:
      overrides:
        defaultIndex: "soc-security-events-*"
        dateFormat:tz: "Africa/Algiers"
        format:number:defaultPattern: "#,###[.]###"
        format:percent:defaultPattern: "0.0%"
        telemetry:optIn: false
        docTable:hideTimeColumn: false
        search:queryLanguage: lucene
        timeline:enable: true
        securitySolution:showCase: true
---
# Horizontal Pod Autoscaler for Kibana
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kibana-hpa
  namespace: siem
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kibana
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
