# =============================================================================
# Djezzy National SOC Platform - Phase 5: SIEM Integration
# Filebeat Configuration - Log Collection Agent
# =============================================================================
# Enterprise-grade log shipping with:
# - Multi-source collection (system, application, security, telecom)
# - TLS encryption in transit
# - Auto-discovery via Kubernetes
# - Module-based configuration
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: siem
  labels:
    app.kubernetes.io/name: filebeat
data:
  filebeat.yml: |
    # Filebeat Configuration for Djezzy SOC Platform
    
    # ========================================
    # Main Settings
    # ========================================
    filebeat.inputs:
    
    # System Logs (Linux)
    - type: log
      enabled: true
      paths:
        - /var/log/auth.log
        - /var/log/secure
        - /var/log/syslog
        - /var/log/messages
      fields:
        event.category: authentication
        source.system: linux
        environment: production
      fields_under_root: true
      tags: ["auth", "linux", "system"]
      multiline.pattern: '^\s'
      multiline.negate: false
      multiline.match: after
      close_eof: false
      scan_frequency: 10s
      harvester_buffer_size: 16384
      max_bytes: 10485760
      
    # Kubernetes Container Logs (DaemonSet)
    - type: container
      enabled: true
      paths:
        - /var/log/containers/*.log
      processors:
        - add_kubernetes_metadata:
            host: ${NODE_NAME}
            matchers:
              - logs_path:
                  logs_path: "/var/log/containers/"
      fields:
        event.category: container
        source.platform: kubernetes
        environment: production
      fields_under_root: true
      tags: ["kubernetes", "containers", "platform"]
      
    # Audit Logs
    - type: log
      enabled: true
      paths:
        - /var/log/audit/audit.log
      fields:
        event.category: audit
        source.type: linux-auditd
        environment: production
      fields_under_root: true
      tags: ["audit", "compliance", "linux"]
      json.keys_under_root: true
      json.overwrite_keys: true
      json.add_error_key: true
      
    # Application Security Logs (SOC Platform)
    - type: log
      enabled: true
      paths:
        - /var/log/soc-platform/*.log
        - /var/log/soc-platform/security/*.log
      fields:
        event.category: application
        source.application: soc-platform
        environment: production
      fields_under_root: true
      tags: ["application", "soc", "security"]
      json.keys_under_root: true
      json.message_key: message
      
    # Web Server Access Logs (NGINX)
    - type: log
      enabled: true
      paths:
        - /var/log/nginx/access.log
        - /var/log/nginx/error.log
      fields:
        event.category: web
        source.server: nginx
        environment: production
      fields_under_root: true
      tags: ["web", "nginx", "access"]
      
    # Database Audit Logs (PostgreSQL)
    - type: log
      enabled: true
      paths:
        - /var/lib/postgresql/data/log/*.csv
      fields:
        event.category: database
        source.database: postgresql
        environment: production
      fields_under_root: true
      tags: ["database", "postgresql", "audit"]
      
    # Telecom Signaling Logs
    - type: log
      enabled: true
      paths:
        - /var/log/telecom/ss7/*.log
        - /var/log/telecom/gtp/*.log
        - /var/log/telecom/sip/*.log
        - /var/log/telecom/diameter/*.log
      fields:
        event.category: telecom
        source.domain: telecommunications
        environment: production
      fields_under_root: true
      tags: ["telecom", "signaling", "ss7", "gtp", "sip"]

    # ========================================
    # Processors (Applied to All Inputs)
    # ========================================
    processors:
      # Add host metadata
      - add_host_metadata:
          when.not.contains.tags: forwarded
      
      # Add cloud metadata (if running on cloud)
      - add_cloud_metadata: ~
      
      # Add Docker metadata
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
          
      # Detect anomalies in event rate
      - detect_java_exception:
          languages: [java]
          max_lines: 50
          
      # Decode custom JSON logs
      - decode_json_fields:
          fields: ["message"]
          target: "json_payload"
          overwrite_keys: true
          
      # Add geoip data
      - add_geoip:
          source_ip_field: source.ip
          target_field: source.geo
          database_path: /usr/share/filebeat/data/GeoLite2-City.mmdb
          
      # Drop debug events to reduce noise
      - drop_event:
          when:
            equals:
              log.level: "debug"
              
      # Add SOC-specific metadata
      - add_fields:
          target: ''
          fields:
            observer.name: djezzy-soc-filebeat
            ecs.version: 8.11.0

    # ========================================
    # Output Configuration
    # ========================================
    output.logstash:
      hosts: ['logstash.siem:5044']
      loadbalance: true
      bulk_max_size: 2048
      worker: 2
      compression_level: 3
      ttl: 300
      pipelining: 2
      
      # TLS Configuration
      ssl.enabled: true
      ssl.certificate_authorities: ["/etc/filebeat/certs/ca.crt"]
      ssl.certificate: "/etc/filebeat/certs/client.crt"
      ssl.key: "/etc/filebeat/client.key"
      ssl.verification_mode: full
      
      # Proxy settings (if needed)
      # proxy_url: "http://proxy.djezzy.dz:3128"

    # ========================================
    # Queue Configuration (for reliability)
    # ========================================
    queue.mem:
      events: 4096
      flush.min_events: 512
      flush.timeout: 5s

    # ========================================
    # Monitoring & Logging
    # ========================================
    monitoring.enabled: true
    monitoring.elasticsearch:
      hosts: ["https://elasticsearch-client:9200"]
      username: "${ELASTICSEARCH_USER}"
      password: "${ELASTICSEARCH_PASSWORD}"
      ssl.enabled: true
      ssl.certificate_authorities: ["/etc/filebeat/certs/ca.crt"]
      
    logging.level: info
    logging.to_files: true
    logging.files:
      path: /var/log/filebeat
      name: filebeat
      keepfiles: 7
      permissions: 0644
      
    # HTTP endpoint for health checks
    http.enabled: true
    http.port: 5066

    # ========================================
    # Modules (Pre-built configurations)
    # ========================================
    filebeat.modules:
    
    # Module: System (syslog, auth)
    - module: system
      syslog:
        enabled: true
        var.paths: ["/var/log/syslog*", "/var/log/messages*"]
      auth:
        enabled: true
        var.paths: ["/var/log/auth.log*", "/var/log/secure*"]
        
    # Module: Apache/Nginx
    - module: nginx
      access:
        enabled: true
        var.paths: ["/var/log/nginx/access.log*"]
      error:
        enabled: true
        var.paths: ["/var/log/nginx/error.log*"]
        
    # Module: PostgreSQL
    - module: postgresql
      log:
        enabled: true
        var.paths: ["/var/lib/postgresql/data/log/*.csv*"]
        
    # Module: Elasticsearch (monitor ES itself)
    - module: elasticsearch
      server:
        enabled: true
        var.paths: ["/var/log/elasticsearch/*.log*", "/var/log/elasticsearch/*_server.json"]
      gc:
        enabled: true
        var.paths: ["/var/log/elasticsearch/gc.log.*"]
      slowlog:
        enabled: true
        var.paths: ["/var/log/elasticsearch/*_slowlog.json"]
      deprecation:
        enabled: true
        var.paths: ["/var/log/elasticsearch/*_deprecation.json"]
---
# Filebeat DaemonSet for Kubernetes nodes
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: siem
  labels:
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/component: log-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: filebeat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: filebeat
        app.kubernetes.io/component: log-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5066"
        prometheus.io/path: "/stats"
    spec:
      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.12.0
          args: [
            "-c", "/etc/filebeat/filebeat.yml",
            "-e",
            "-strict.perms=false"
          ]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ELASTICSEARCH_USER
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: username
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password
          securityContext:
            runAsUser: 0
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
          resources:
            requests:
              cpu: "100m"
              memory: "200Mi"
            limits:
              cpu: "500m"
              memory: "500Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/filebeat/filebeat.yml
              subPath: filebeat.yml
              readOnly: true
            - name: certs
              mountPath: /etc/filebeat/certs
              readOnly: true
            - name: data
              mountPath: /usr/share/filebeat/data
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: sock
              mountPath: /var/run/docker.sock
              readOnly: true
            - name: libsystemddir
              mountPath: /run/systemd
              readOnly: true
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  FILEBEAT_HEALTH=$(curl --write-out '%{http_code}' --silent --output /dev/null http://localhost:5066/health || echo "000")
                  if [ "$FILEBEAT_HEALTH" != "200" ]; then
                    exit 1
                  fi
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  FILEBEAT_READY=$(curl --write_out '%{http_code}' --silent --output /dev/null http://localhost:5066/health || echo "000")
                  if [ "$FILEBEAT_READY" == "200" ]; then
                    exit 0
                  else
                    exit 1
                  fi
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: filebeat-config
        - name: certs
          secret:
            secretName: elasticsearch-tls-certs
            defaultMode: 0400
        - name: data
          hostPath:
            path: /var/lib/filebeat-data
            type: DirectoryOrCreate
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: sock
          hostPath:
            path: /var/run/docker.sock
        - name: libsystemddir
          hostPath:
            path: /run/systemd
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: siem
  labels:
    app.kubernetes.io/name: filebeat
---
# RBAC for Filebeat (Kubernetes API access)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat-cluster-role
  labels:
    app.kubernetes.io/name: filebeat
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - nodes
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - replicasets
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat-cluster-role-binding
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: siem
roleRef:
  kind: ClusterRole
  name: filebeat-cluster-role
  apiGroup: rbac.authorization.k8s.io
