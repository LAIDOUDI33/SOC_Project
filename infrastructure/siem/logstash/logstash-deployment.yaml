# =============================================================================
# Djezzy National SOC Platform - Phase 5: SIEM Integration
# Logstash Deployment - Log Processing Pipeline
# =============================================================================
# Production Logstash with multiple input plugins:
# - Beats (Filebeat, Metricbeat, Packetbeat)
# - Kafka for high-throughput event streaming
# - HTTP for webhook-based integrations
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: siem
  labels:
    app.kubernetes.io/name: logstash
    app.kubernetes.io/component: siem-pipeline
    app.kubernetes.io/part-of: djezzy-soc
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: logstash
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logstash
        app.kubernetes.io/component: siem-pipeline
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9600"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: logstash
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.12.0
          ports:
            - name: beats
              containerPort: 5044
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: monitoring
              containerPort: 9600
              protocol: TCP
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
            - name: XPACK_MONITORING_ENABLED
              value: "true"
            - name: XPACK_MONITORING_ELASTICSEARCH_HOSTS
              value: "https://elasticsearch-client:9200"
            - name: ELASTICSEARCH_HOSTS
              value: "https://elasticsearch-client:9200"
            - name: ELASTICSEARCH_USER
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: username
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password
            - name: XPACK_SECURITY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: logstash-secrets
                  key: encryption-key
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /usr/share/logstash/pipeline
              readOnly: true
            - name: patterns
              mountPath: /usr/share/logstash/patterns
              readOnly: true
            - name: certs
              mountPath: /usr/share/logstash/certs
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: logstash-pipeline
        - name: patterns
          configMap:
            name: logstash-grok-patterns
        - name: certs
          secret:
            secretName: elasticsearch-tls-certs
            defaultMode: 0400
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logstash
  namespace: siem
  labels:
    app.kubernetes.io/name: logstash
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: siem
  labels:
    app.kubernetes.io/name: logstash
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: logstash
  ports:
    - name: beats
      port: 5044
      targetPort: 5044
      protocol: TCP
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: monitoring
      port: 9600
      targetPort: 9600
      protocol: TCP
---
# Horizontal Pod Autoscaler for Logstash
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: logstash-hpa
  namespace: siem
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: logstash
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
