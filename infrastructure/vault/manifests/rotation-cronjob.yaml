# ============================================================
# National SOC Platform - Vault Secret Rotation CronJob
# Djezzy Telecom - Automated Secrets Management
# ============================================================

apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-secret-rotation
  namespace: vault-system
  labels:
    app.kubernetes.io/name: vault-rotation
    app.kubernetes.io/component: automation
    environment: production
    managed-by: helm
  annotations:
    description: "Automated rotation of Vault secrets for SOC platform"
    schedule: "Weekly (Sunday 02:00 Algeria time)"
spec:
  # Run every Sunday at 02:00 Algeria time (00:00 UTC)
  schedule: "0 0 * * 0"
  
  # Keep job history for debugging
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  
  # Don't create new job if previous is still running
  concurrencyPolicy: Forbid
  
  # Job deadline (1 hour max)
  startingDeadlineSeconds: 3600
  
  # Suspend if needed (for maintenance)
  suspend: false
  
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: vault-rotation-job
      annotations:
        sidecar.istio.io/inject: "false"  # Disable service mesh
    
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400  # Clean up after 24h
      
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vault-rotation-pod
        
        spec:
          serviceAccountName: vault-auth-sa
          restartPolicy: OnFailure
          
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            fsGroup: 1000
          
          containers:
            - name: secret-rotator
              image: hashicorp/vault:1.15.0
              command: ["/bin/sh"]
              args:
                - -c
                - |
                  echo "=== Starting Vault Secret Rotation ==="
                  echo "Time: $(date)"
                  
                  # Wait for Vault to be ready
                  until vault status > /dev/null 2>&1; do
                    echo "Waiting for Vault..."
                    sleep 5
                  done
                  
                  # Authenticate using Kubernetes auth method
                  VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                    role=rotation-service \
                    jwt=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token))
                  
                  export VAULT_TOKEN
                  export VAULT_ADDR="https://vault.djezzy.dz:8200"
                  
                  echo "Authenticated successfully"
                  
                  # Copy and execute rotation script
                  cp /scripts/rotate-secrets.sh /tmp/rotate-secrets.sh
                  chmod +x /tmp/rotate-secrets.sh
                  
                  # Execute rotation (all types)
                  /tmp/rotate-secrets.sh all --force || {
                    echo "ERROR: Secret rotation failed!"
                    exit 1
                  }
                  
                  echo "=== Rotation Complete ==="
              
              env:
                - name: VAULT_ADDR
                  value: "https://vault.djezzy.dz:8200"
                - name: VAULT_NAMESPACE
                  value: ""
                - name: TZ
                  value: "Africa/Algiers"
              
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: logs
                  mountPath: /var/log/vault
              
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
              
              livenessProbe:
                exec:
                  command:
                    - pgrep
                    - -f
                    - rotate-secrets.sh
                initialDelaySeconds: 30
                periodSeconds: 60
              
              readinessProbe:
                exec:
                  command:
                    - test
                    - -f
                    - /tmp/rotate-secrets.sh
                initialDelaySeconds: 10
                periodSeconds: 10
          
          volumes:
            - name: scripts
              configMap:
                name: vault-rotation-scripts
                defaultMode: 0755
            
            - name: logs
              emptyDir:
                sizeLimit: 100Mi
          
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 50
                  preference:
                    matchExpressions:
                      - key: dedicated
                        operator: In
                        values:
                          - vault
          
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "vault"
              effect: "NoSchedule"

---
# ConfigMap containing the rotation script
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-rotation-scripts
  namespace: vault-system
  labels:
    app.kubernetes.io/name: vault-rotation
data:
  rotate-secrets.sh: |
    #!/bin/bash
    # Simplified version for CronJob execution
    set -euo pipefail
    
    log() {
      echo "[$(date '+%Y-%m-%d %H:%M:%S')] $*"
    }
    
    log "Starting secret rotation..."
    
    # Rotate JWT keys
    log "Rotating JWT signing keys..."
    vault write -f transit/keys/jwt-signing-key/rotate && \
      vault kv put soc-platform/data/auth/jwt \
        access_secret=$(openssl rand -base64 32) \
        refresh_secret=$(openssl rand -base64 32) \
        rotated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ) || {
      log "ERROR: JWT rotation failed"
      exit 1
    }
    log "✅ JWT keys rotated"
    
    # Revoke dynamic database leases to force credential renewal
    log "Revoking database leases..."
    vault lease revoke-prefix database/creds/ 2>/dev/null || true
    log "✅ Database leases revoked"
    
    # Rotate API keys
    log "Rotating integration API keys..."
    for integration in wazuh thehive cortex misp opencti slack pagerduty; do
      NEW_KEY=$(openssl rand -hex 24)
      vault kv put soc-platform/data/integrations/$integration \
        api_key="$NEW_KEY" \
        rotated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
    done
    log "✅ API keys rotated"
    
    # Check certificate expiry
    log "Checking TLS certificates..."
    for role in soc-server soc-client soc-probe; do
      EXPIRY=$(vault read pki-int/cert/$role -format=json 2>/dev/null | \
        jq -r '.data.expiration // empty' || echo "")
      
      if [[ -n "$EXPIRY" ]]; then
        NOW=$(date +%s)
        EXPIRY_UNIX=$(date -d "$EXPIRY" +%s 2>/dev/null || echo "$((NOW + 864000))")
        DAYS_LEFT=$(( (EXPIRY_UNIX - NOW) / 86400 ))
        
        if [[ $DAYS_LEFT -lt 30 ]]; then
          log "⚠️ Certificate $role expires in $DAYS_LEFT days, renewing..."
          vault write pki-int/issue/$role common_name="soc.djezzy.dz" ttl="90d" > /dev/null || true
        else
          log "✅ Certificate $role valid ($DAYS_LEFT days remaining)"
        fi
      fi
    done
    
    log "=== All rotations completed successfully ==="
