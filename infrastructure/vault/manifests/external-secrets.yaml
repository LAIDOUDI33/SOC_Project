  - secretKey: SAML_AZURE_CERT
    remoteRef:
      key: soc-platform/data/auth/saml/idp/azure-ad
      property: signing_cert

---
# Redis Session Store Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-credentials
  namespace: soc-platform
  labels:
    app.kubernetes.io/name: soc-platform
    component: cache
spec:
  refreshInterval: "24h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend-production
  target:
    name: redis-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        REDIS_PASSWORD: "{{ .password }}"
        REDIS_URL: "redis://:{{ .password }}@redis-master.soc-platform.svc.cluster.local:6379"
  dataFrom:
  - find:
      path: soc-platform/data/cache/redis

