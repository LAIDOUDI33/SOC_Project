# ============================================================
# National SOC Platform - External Secrets Operator
# Djezzy Telecom - Vault → K8s Secrets Sync
# ============================================================
#
# This manifest configures the External Secrets Operator (ESO)
# to sync secrets from HashiCorp Vault to Kubernetes.
#
# Prerequisites:
# 1. Vault installed and configured (see vault/config/)
# 2. External Secrets Operator installed in cluster
# 3. ClusterSecretStore or SecretStore configured
#
# Install ESO: helm install external-secrets external-secrets/external-secrets
# Docs: https://external-secrets.io/
#

# ============================================================
# Namespace for SOC Platform
# ============================================================

apiVersion: v1
kind: Namespace
metadata:
  name: soc-platform
  labels:
    app.kubernetes.io/name: soc-platform
    app.kubernetes.io/component: platform
    security.djezzy.dz/classification: confidential
---
# ============================================================
# ClusterSecretStore - Production Vault Connection
# ============================================================

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend-production
  labels:
    app.kubernetes.io/name: soc-platform
    environment: production
spec:
  provider:
    vault:
      server: "https://vault.djezzy.dz:8200"
      path: "secret"
      # Authentication via Kubernetes Service Account
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "soc-app"
          serviceAccountRef:
            name: "vault-auth-sa"
            namespace: "soc-platform"
      # TLS verification
      version: "v2"  # Use KV v2
      
      # Optional: Custom CA cert if using internal CA
      # caBundle: |
      #   -----BEGIN CERTIFICATE-----
      #   ... your CA cert here ...
      #   -----END CERTIFICATE-----
      
  # Health check configuration
  health:
    enabled: true
    interval: 30s

---
# ============================================================
# ClusterSecretStore - Staging Vault Connection
# ============================================================

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend-staging
  labels:
    app.kubernetes.io/name: soc-platform
    environment: staging
spec:
  provider:
    vault:
      server: "https://vault-staging.djezzy.dz:8200"
      path: "secret"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "soc-app-staging"
          serviceAccountRef:
            name: "vault-auth-sa"
            namespace: "soc-platform"
      version: "v2"

---
# ============================================================
# Service Account for Vault Authentication
# ============================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth-sa
  namespace: soc-platform
  labels:
    app.kubernetes.io/name: soc-platform
    component: vault-auth
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-token-reviewer
  namespace: soc-platform
rules:
- apiGroups: [""]
  resources: ["serviceaccounts/token"]
  verbs: ["create"]
  resourceNames: ["vault-auth-sa"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-token-reviewer-binding
  namespace: soc-platform
subjects:
- kind: ServiceAccount
  name: vault-auth-sa
  namespace: soc-platform
roleRef:
  kind: Role
  name: vault-token-reviewer
  apiGroup: rbac.authorization.k8s.io

---
# ============================================================
# External Secrets - Application Configuration
# ============================================================

# Database Connection String (Dynamic from Vault)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: soc-platform
  labels:
    app.kubernetes.io/name: soc-platform
    component: database
    secret-type: dynamic
spec:
  refreshInterval: "1h"  # Rotate every hour
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend-production
  target:
    name: database-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        connection_string: "postgresql://{{ .username }}:{{ .password }}@postgres-primary.soc-platform.svc.cluster.local:5432/soc_platform?sslmode=require"
  dataFrom:
  - find:
      path: "database/creds/soc-app-read"
      # Transform: Extract username and password from dynamic creds
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None

---
# JWT Configuration Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jwt-secrets
  namespace: soc-platform
  labels:
    app.kubernetes.io/name: soc-platform
    component: authentication
spec:
  refreshInterval: "24h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend-production
  target:
    name: jwt-secrets
    creationPolicy: Owner
    type: Opaque
  data:
  - secretKey: JWT_ACCESS_SECRET
    remoteRef:
      key: soc-platform/data/auth/jwt
      property: access_secret
  - secretKey: JWT_REFRESH_SECRET
    remoteRef:
      key: soc-platform/data/auth/jwt
      property: refresh_secret
  - secretKey: JWT_ISSUER
    remoteRef:
      key: soc-platform/data/auth/jwt
      property: issuer
  - secretKey: JWT_AUDIENCE
    remoteRef:
      key: soc-platform/data/auth/jwt
      property: audience

---
# NextAuth / Application Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
