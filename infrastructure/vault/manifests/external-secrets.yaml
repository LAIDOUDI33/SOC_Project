    app.kubernetes.io/name: soc-platform
    component: core
spec:
  refreshInterval: "24h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend-production
  target:
    name: application-secrets
    creationPolicy: Owner
    type: Opaque
  data:
  - secretKey: NEXTAUTH_SECRET
    remoteRef:
      key: soc-platform/data/config/app
      property: nextauth_secret
  - secretKey: NEXTAUTH_URL
    remoteRef:
      key: soc-platform/data/config/app
      property: nextauth_url
  - secretKey: ENCRYPTION_KEY
    remoteRef:
      key: soc-platform/data/config/app
      property: encryption_key
  - secretKey: APP_SECRET_KEY
    remoteRef:
      key: soc-platform/data/config/app
      property: secret_key_base64

---
