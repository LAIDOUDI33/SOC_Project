# ============================================================
# National SOC Platform - TLS ClusterIssuers
# Certificate Authorities for Automatic TLS
# Phase 3: TLS Automation with cert-manager
# ============================================================
#
# Supported Issuers:
# 1. letsencrypt-production - Public domains (soc.djezzy.dz)
# 2. letsencrypt-staging - Testing (no rate limits)
# 3. djezzy-internal-ca - Internal services (*.internal.djezzy.dz)
#
# ============================================================

---
# ============================================================
# Let's Encrypt Production Issuer (HTTP-01 Challenge)
# For public-facing Djezzy SOC domains
# ============================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: cluster-issuer
    app.kubernetes.io/part-of: national-soc
    environment: production
    issuer-type: letsencrypt-prod
    challenge-type: http-01
  annotations:
    description: "Let's Encrypt Production CA for public Djezzy domains"
    contact: "soc-ops@djezzy.dz"
spec:
  acme:
    # Let's Encrypt Production Server
    server: https://acme-v02.api.letsencrypt.org/directory
    
    # Email for registration and expiration notices
    email: soc-certificates@djezzy.dz
    
    # Private key for ACME registration (auto-generated)
    privateKeySecretRef:
      name: letsencrypt-production-key
    
    # Solvers for DNS/HTTP challenges
    solvers:
      # HTTP-01 Solver for NGINX Ingress
      - http01:
          ingress:
            class: nginx
        selector:
          dnsNames:
            - "soc.djezzy.dz"
            - "api.soc.djezzy.dz"
            - "grafana.soc.djezzy.dz"
            - "kibana.soc.djezzy.dz"
      
      # DNS-01 Solver for wildcard certificates (Cloudflare)
      - dns01:
          cloudflare:
            email: cloudflare-admin@djezzy.dz
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - "djezzy.dz"

---
# ============================================================
# Let's Encrypt Staging Issuer (For Testing)
# No rate limits - Use for development/staging only!
# ============================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: cluster-issuer
    app.kubernetes.io/part-of: national-soc
    environment: staging
    issuer-type: letsencrypt-staging
    challenge-type: http-01
  annotations:
    description: "Let's Encrypt Staging CA for testing (NOT for production)"
    contact: "soc-ops@djezzy.dz"
spec:
  acme:
    # Let's Encrypt Staging Server (no rate limits)
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    
    # Email for registration
    email: soc-certificates@djezzy.dz
    
    # Private key for ACME registration
    privateKeySecretRef:
      name: letsencrypt-staging-key
    
    # Solvers
    solvers:
      - http01:
          ingress:
            class: nginx

---
# ============================================================
# Djezzy Internal CA (Self-Signed / Private PKI)
# For internal services and air-gapped environments
# ============================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: djezzy-internal-ca
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: cluster-issuer
    app.kubernetes.io/part-of: national-soc
    environment: internal
    issuer-type: internal-ca
    ca: "true"
  annotations:
    description: "Djezzy Internal Certificate Authority for internal services"
    contact: "soc-security@djezzy.dz"
spec:
  ca:
    # Reference to the internal CA secret (must be pre-created)
    secretName: djezzy-internal-ca-secret

