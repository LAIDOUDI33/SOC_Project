# ============================================================
# National SOC Platform - Docker Compose (PRODUCTION)
# For Djezzy Production Deployment
# Usage: docker compose -f docker-compose.prod.yml up -d
# ============================================================

version: '3.8'

services:
  # ----------------------------------------------------------
  # Next.js Application (Production)
  # ----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: soc-platform:${VERSION:-latest}
    container_name: soc-platform-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Node.js
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      
      # Database (PostgreSQL)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-soc_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-soc_platform}
      
      # Redis
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-soc_redis_prod_2024}
      
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      
      # NextAuth / Application Secrets
      - NEXTAUTH_URL=https://${DOMAIN:-soc.djezzy.dz}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      
      # Encryption Key (for sensitive data)
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      
      # Djezzy Specific
      - DJEZZY_ENVIRONMENT=production
      - TZ=Africa/Algiers
      
      # Logging
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      
      # External Services (configure as needed)
      - LDAP_URL=${LDAP_URL:-ldap://ad.djezzy.dz:389}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      
    volumes:
      - app-logs:/app/logs
      - db-data:/app/db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - soc-backend
      - soc-frontend
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ----------------------------------------------------------
  # PostgreSQL (Production Ready)
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: soc-postgres-prod
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-soc_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-soc_platform}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./scripts/postgres/production.conf:/etc/postgresql.conf.d/production.conf
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=128MB
      -c wal_level=replica
      -c max_wal_senders=3
      -c work_mem=16MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc_admin} -d ${POSTGRES_DB:-soc_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - soc-backend
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  # ----------------------------------------------------------
  # Redis (Production with Persistence & Security)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: soc-redis-prod
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-soc_redis_prod_2024}
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-soc_redis_prod_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soc-backend
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ----------------------------------------------------------
  # Nginx Reverse Proxy (Load Balancer + SSL Termination)
  # ----------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: soc-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl/certs:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - soc-frontend
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ----------------------------------------------------------
  # Prometheus (Metrics Collection)
  # ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: soc-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - soc-monitoring
    profiles:
      - monitoring

  # ----------------------------------------------------------
  # Grafana (Visualization Dashboards)
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: soc-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - soc-monitoring
    profiles:
      - monitoring

# ============================================================
# Volumes (Production with named drivers for persistence)
# ============================================================
volumes:
  app-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/soc/app-data
  app-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/soc/logs
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/soc/database
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/soc/postgres
  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/soc/redis
  nginx-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/soc/nginx-logs
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ============================================================
# Networks (Segmented for security)
# ============================================================
networks:
  soc-frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
  soc-backend:
    driver: bridge
    internal: true  # No external access to backend
    ipam:
      config:
        - subnet: 172.31.0.0/16
  soc-monitoring:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.32.0.0/16
